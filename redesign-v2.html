<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atlas Redesign v2</title>
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    } }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0d0e12;
      --surface: #15171e;
      --surface-2: #1b1e27;
      --surface-3: #232735;
      --line: rgba(255, 255, 255, 0.07);
      --line-strong: rgba(255, 255, 255, 0.14);
      --text: #eceff4;
      --muted: #9aa2b2;
      --faint: #6b7282;
      --bar: #4a5061;
      --accent: #8bc5ff;
      --highlight: #4fc3f7;
      --r-xl: 28px;
      --r-lg: 22px;
      --r-md: 16px;
      --r-sm: 12px;
      --shadow: 0 22px 48px -22px rgba(0, 0, 0, 0.75), 0 2px 10px rgba(0, 0, 0, 0.25);
      --shadow-soft: 0 10px 26px -14px rgba(0, 0, 0, 0.6);
      --ease: cubic-bezier(0.22, 0.8, 0.24, 1);
      --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      --sans: "IBM Plex Sans", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 14px;
      overflow: hidden;
    }
    button { font: inherit; color: inherit; }
    select {
      font: 12px var(--mono);
      color: var(--text);
      background: var(--surface-3);
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      padding: 5px 10px;
      outline: none;
      cursor: pointer;
    }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pop { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: none; } }
    @keyframes slideFromLeft { from { opacity: 0; transform: translateX(-24px) scale(0.98); } to { opacity: 1; transform: none; } }
    @keyframes slideFromRight { from { opacity: 0; transform: translateX(24px) scale(0.98); } to { opacity: 1; transform: none; } }

    #app {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-rows: 62px auto 1fr;
    }

    /* ---------- Top bar ---------- */
    .topbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 16px;
      font-family: var(--mono);
      font-size: 12px;
      min-width: 0;
    }
    .crumbs {
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      min-width: 0;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 14px;
      box-shadow: var(--shadow-soft);
    }
    .crumbs button {
      background: none;
      border: none;
      padding: 0;
      color: var(--text);
      font-weight: 600;
      cursor: pointer;
    }
    .crumbs button:hover { color: var(--accent); }
    #crumb-trail { display: flex; align-items: center; gap: 6px; min-width: 0; overflow: hidden; }
    #crumb-trail:empty { display: none; }
    .crumb-sep { color: var(--faint); flex: 0 0 auto; }
    .crumbs .crumb { font-weight: 500; color: var(--muted); overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
    .crumbs .crumb:hover { color: var(--accent); }
    .crumbs .crumb.here { color: var(--text); font-weight: 600; cursor: default; }
    .crumbs .crumb.here:hover { color: var(--text); }
    .crumbs .crumb .dot { width: 7px; height: 7px; margin-right: 5px; vertical-align: 1px; }

    .search-wrap { position: relative; width: 240px; flex: 0 0 auto; }
    #search-input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      color: var(--text);
      padding: 9px 16px;
      font: 12px var(--mono);
      outline: none;
      box-shadow: var(--shadow-soft);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    #search-input:focus { border-color: var(--line-strong); box-shadow: 0 0 0 4px rgba(139, 197, 255, 0.12); }
    #search-results {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      background: var(--surface-2);
      border: 1px solid var(--line-strong);
      border-radius: var(--r-md);
      padding: 6px;
      z-index: 40;
      box-shadow: var(--shadow);
      animation: pop 0.18s var(--ease);
      transform-origin: top center;
    }
    .search-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 999px;
      cursor: pointer;
    }
    .search-item:hover, .search-item.active { background: var(--surface-3); }
    .search-item .t { color: var(--faint); text-transform: capitalize; }

    .filters-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 999px;
      padding: 8px 14px;
      font: 12px var(--mono);
      cursor: pointer;
      white-space: nowrap;
      box-shadow: var(--shadow-soft);
      transition: border-color 0.2s, background 0.2s;
    }
    .filters-btn:hover, .filters-btn.open { border-color: var(--line-strong); background: var(--surface-2); }
    .filters-btn .n {
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      border-radius: 999px;
      background: var(--accent);
      color: #0a0b0f;
      font-weight: 600;
      font-size: 11px;
      display: inline-grid;
      place-items: center;
    }

    /* Active filters, under the top bar, on every page */
    .filter-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      padding: 0 16px 10px;
      font: 12px var(--mono);
      animation: fadeUp 0.25s var(--ease);
    }
    .filter-bar .scope {
      color: var(--muted);
      margin-right: 4px;
    }
    .filter-bar .scope strong { color: var(--text); font-weight: 600; }
    .filter-bar .scope.gap { color: #ffcf8a; }
    .filter-bar .chip-filter { animation: none; }
    .filter-bar .chip-filter .dot { width: 7px; height: 7px; }
    .filter-bar .clear-all { margin-left: 4px; }

    /* Filter panel: one shared panel, slides over the left side */
    .filter-panel {
      position: absolute;
      top: 0;
      left: 14px;
      bottom: 14px;
      width: 330px;
      z-index: 30;
      overflow-y: auto;
      padding: 16px;
      background: var(--surface);
      border: 1px solid var(--line-strong);
      border-radius: var(--r-xl);
      box-shadow: 0 30px 70px -20px rgba(0, 0, 0, 0.85), var(--shadow);
      animation: slideFromLeft 0.32s var(--ease);
    }
    .fp-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
    .fp-head h2 { margin: 0; font-size: 18px; }
    .fp-head .actions { display: flex; align-items: center; gap: 10px; }
    .fp-section { border-top: 1px solid var(--line); padding: 14px 0 4px; margin-top: 12px; }
    .fp-section:first-of-type { border-top: none; margin-top: 4px; }
    .fp-section > .label { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .fp-hint { margin: -2px 0 10px; color: var(--faint); font-size: 12px; line-height: 1.45; }
    .pin-list { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
    .pin-list .and { color: var(--faint); font: 11px var(--mono); align-self: center; }
    .pin-search { position: relative; }
    .pin-search input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface-2);
      color: var(--text);
      padding: 8px 14px;
      font: 12px var(--mono);
      outline: none;
    }
    .pin-search input:focus { border-color: var(--line-strong); }
    .pin-results {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      z-index: 5;
      background: var(--surface-2);
      border: 1px solid var(--line-strong);
      border-radius: var(--r-md);
      padding: 4px;
      box-shadow: var(--shadow);
    }
    .scope-meter { margin-top: 12px; }
    .scope-meter .bar { height: 6px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
    .scope-meter .bar i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width 0.35s var(--ease); }
    .scope-meter .txt { margin-top: 6px; font: 12px var(--mono); color: var(--muted); }
    .scope-meter .txt strong { color: var(--text); }
    .gap-box {
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: var(--r-md);
      border: 1px dashed rgba(255, 207, 138, 0.55);
      background: rgba(255, 183, 77, 0.07);
    }
    .gap-box strong { color: #ffcf8a; }
    .gap-box p { margin: 6px 0 0; color: #d5dbe6; font-size: 12.5px; line-height: 1.5; }
    .gap-box .sugg { display: grid; gap: 4px; margin-top: 8px; }
    .gap-box .sugg button {
      text-align: left;
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 5px 12px;
      font: 12px var(--mono);
      color: var(--text);
      cursor: pointer;
    }
    .gap-box .sugg button:hover { border-color: var(--line-strong); }
    .stepper { display: flex; align-items: center; gap: 8px; font: 12px var(--mono); }
    .stepper button {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid var(--line-strong);
      background: var(--surface-2);
      cursor: pointer;
    }
    .stepper button:disabled { opacity: 0.35; cursor: not-allowed; }
    .stepper .val { min-width: 24px; text-align: center; font-weight: 600; font-size: 14px; }
    .stepper .note { color: var(--faint); }
    .pin-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 12px;
      border: 1px dashed var(--line-strong);
      background: none;
      color: var(--muted);
      border-radius: 999px;
      padding: 5px 12px;
      font: 12px var(--mono);
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
    }
    .pin-btn:hover { color: var(--text); border-color: var(--muted); }
    .pin-btn.on { border-style: solid; border-color: rgba(139, 197, 255, 0.6); background: rgba(139, 197, 255, 0.14); color: #d8ebff; }
    .gaps-list { margin-top: 18px; padding-top: 12px; border-top: 1px dashed var(--line-strong); }
    .gaps-list .conn-row { opacity: 0.85; }
    .gaps-list .count.zero { background: rgba(255, 183, 77, 0.12); color: #ffcf8a; }
    .filter-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 999px;
      padding: 7px 12px;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      box-shadow: var(--shadow-soft);
      transition: opacity 0.2s, transform 0.15s var(--ease);
    }
    .filter-pill:active { transform: scale(0.96); }
    .filter-pill.off { opacity: 0.35; }
    .filter-pill .n { color: var(--faint); }
    .spacer { flex: 1; }
    #help-btn {
      width: 36px;
      height: 36px;
      flex: 0 0 auto;
      border-radius: 50%;
      border: 1px solid var(--line-strong);
      background: var(--surface);
      font-weight: 600;
      cursor: pointer;
      box-shadow: var(--shadow-soft);
      transition: transform 0.15s var(--ease), border-color 0.2s;
    }
    #help-btn:hover { border-color: var(--muted); transform: scale(1.06); }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      display: inline-block;
      flex: 0 0 auto;
    }

    /* Rows are pinned so main keeps the last row even while the filter bar is hidden. */
    .topbar { grid-row: 1; }
    .filter-bar { grid-row: 2; }
    main { grid-row: 3; min-height: 0; position: relative; }

    /* ---------- Full network in 3D ---------- */
    .net3d { position: absolute; inset: 0; background: #07080c; overflow: hidden; }
    .net3d canvas { display: block; width: 100%; height: 100%; cursor: grab; outline: none; }
    .net3d canvas:active { cursor: grabbing; }
    .net3d.hovering canvas { cursor: pointer; }
    .net3d-labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .nl {
      position: absolute;
      left: 0;
      top: 0;
      display: none;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      font: 11.5px var(--mono);
      color: #e6eaf1;
      text-shadow: 0 0 4px #07080c, 0 0 8px #07080c, 0 0 2px #07080c;
      will-change: transform, opacity;
    }
    .nl.big { font-size: 12.5px; font-weight: 600; }
    .nl.hot { color: #fff; font-weight: 600; }
    .nl.hot::before { content: ""; position: absolute; inset: -3px -6px; border-radius: 999px; background: rgba(7, 8, 12, 0.72); z-index: -1; }
    .net-tools {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 6;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .net-tools .seg button { padding: 6px 14px; }
    .net-legend {
      position: absolute;
      left: 16px;
      bottom: 16px;
      max-width: 330px;
      background: rgba(13, 14, 18, 0.9);
      border: 1px solid var(--line);
      border-radius: var(--r-lg);
      padding: 12px 16px;
      font: 11.5px var(--mono);
      color: var(--muted);
      display: grid;
      gap: 6px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(4px);
    }
    .net-legend .types { display: flex; flex-wrap: wrap; gap: 4px 12px; color: #cfd5e0; }
    .net-legend .types span { display: inline-flex; align-items: center; gap: 6px; }
    .net-legend b { color: #cfd5e0; font-weight: 500; }
    .net-legend .how { color: var(--faint); border-top: 1px solid var(--line); padding-top: 6px; }
    .net-note {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 6;
      background: rgba(13, 14, 18, 0.92);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 7px 16px;
      font: 12px var(--mono);
      color: var(--muted);
      white-space: nowrap;
      animation: fadeUp 0.3s var(--ease);
    }

    /* ---------- Landing ---------- */
    #landing-view { position: absolute; inset: 0; overflow-y: auto; animation: fadeIn 0.35s var(--ease); }
    .landing { max-width: 1240px; margin: 0 auto; padding: 28px 28px 48px; }
    .hero { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px; align-items: end; margin-bottom: 26px; }
    .hero .kicker { font: 500 11px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); margin: 0 0 10px; }
    .hero h1 { margin: 0; font-size: 34px; line-height: 1.1; letter-spacing: -0.01em; }
    .hero p { margin: 12px 0 0; max-width: 720px; color: #cfd5e0; line-height: 1.55; font-size: 15px; }
    .hero p strong { color: var(--text); }
    .hero-side { display: grid; gap: 8px; justify-items: end; }
    .hero-search { position: relative; width: 340px; }
    .hero-search input {
      width: 100%;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      background: var(--surface);
      color: var(--text);
      padding: 13px 20px;
      font: 14px var(--sans);
      outline: none;
      box-shadow: var(--shadow-soft);
    }
    .hero-search input:focus { box-shadow: 0 0 0 4px rgba(139, 197, 255, 0.14); }
    .hero-search .pin-results { top: calc(100% + 6px); }
    .see-network { font: 12px var(--mono); color: var(--muted); background: none; border: none; cursor: pointer; padding: 4px 2px; }
    .see-network:hover { color: var(--accent); }
    .land-section { margin-top: 30px; }
    .land-section > h2 { font: 600 12px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px; }
    .land-section > .sub { margin: 0 0 14px; color: var(--faint); font-size: 13px; }
    .type-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
    @media (max-width: 1100px) { .type-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    .type-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-top: 3px solid var(--c);
      border-radius: var(--r-lg);
      padding: 16px 14px 12px;
      box-shadow: var(--shadow-soft);
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .type-card h3 { margin: 0; font-size: 17px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .type-card h3 .n { font: 12px var(--mono); color: var(--faint); font-weight: 400; }
    .type-card .def { margin: 6px 0 12px; color: var(--muted); font-size: 12.5px; line-height: 1.45; min-height: 36px; }
    .lm-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 3px 10px;
      align-items: center;
      width: 100%;
      text-align: left;
      background: none;
      border: 1px solid transparent;
      border-radius: var(--r-sm);
      padding: 7px 8px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    .lm-row:hover { background: var(--surface-2); border-color: var(--line); }
    .lm-row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
    .lm-row .num { font: 12px var(--mono); color: var(--muted); }
    .lm-row .bar { grid-column: 1 / -1; height: 3px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
    .lm-row .bar i { display: block; height: 100%; background: var(--c); opacity: 0.75; border-radius: 999px; }
    .type-card .more { margin-top: 6px; align-self: flex-start; }
    .type-card .all-list { max-height: 320px; overflow-y: auto; margin-top: 4px; }
    .rise-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    @media (max-width: 1100px) { .rise-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    .rise-card, .pair-card {
      display: block;
      width: 100%;
      text-align: left;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      padding: 12px 14px;
      cursor: pointer;
      transition: border-color 0.2s, transform 0.15s var(--ease);
    }
    .rise-card:hover, .pair-card:hover { border-color: var(--line-strong); transform: translateY(-1px); }
    .rise-card .top { display: flex; align-items: center; gap: 8px; font-weight: 600; }
    .rise-card .meta { margin-top: 6px; font: 12px var(--mono); color: var(--muted); }
    .rise-card .meta strong { color: #a5e3b0; font-weight: 600; }
    .rise-card svg { display: block; width: 100%; height: 26px; margin-top: 8px; }
    .pair-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    @media (max-width: 1100px) { .pair-grid { grid-template-columns: 1fr; } }
    .pair-card .names { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-weight: 600; }
    .pair-card .names .arrow { color: var(--faint); font-weight: 400; }
    .pair-card .s { margin-top: 6px; color: #cfd5e0; font-size: 13px; line-height: 1.45; }
    .land-gap { margin-top: 20px; }

    /* ---------- Field view ---------- */
    #field-view { position: absolute; inset: 0; animation: fadeIn 0.35s var(--ease); }
    #field { width: 100%; height: 100%; display: block; cursor: grab; }
    #field:active { cursor: grabbing; }
    .field-legend {
      position: absolute;
      left: 16px;
      bottom: 16px;
      background: rgba(21, 23, 30, 0.92);
      border: 1px solid var(--line);
      border-radius: var(--r-lg);
      padding: 12px 16px;
      font: 12px var(--mono);
      color: var(--muted);
      display: grid;
      gap: 5px;
      box-shadow: var(--shadow);
    }
    .field-legend .row { display: flex; align-items: center; gap: 8px; }
    .field-legend .hint { color: var(--faint); margin-top: 4px; }

    /* ---------- Concept view ---------- */
    #concept-view {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: 290px minmax(0, 1fr) 372px;
      gap: 12px;
      padding: 0 14px 14px;
    }
    #concept-view.enter .left { animation: slideFromLeft 0.5s var(--ease); }
    #concept-view.enter .right { animation: slideFromRight 0.5s var(--ease); }
    #concept-view.enter .orbit-wrap { animation: fadeIn 0.6s var(--ease); }
    .bubble-panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r-xl);
      box-shadow: var(--shadow);
      min-height: 0;
    }
    .left { overflow-y: auto; padding: 14px; }
    .pane { display: flex; flex-direction: column; gap: 12px; }

      background: var(--surface-3);
      border-radius: 999px;
      padding: 4px 12px;
      font: 12px var(--mono);
      color: #cfd5e0;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--line-strong);
      background: var(--surface-2);
      border-radius: 999px;
      padding: 5px 12px;
      font-size: 12.5px;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s var(--ease);
    }
    .chip:hover { background: var(--surface-3); }
    .chip:active { transform: scale(0.95); }
    .chip.current { cursor: default; border-style: dashed; }
    .chip.current:hover { background: var(--surface-2); }
    .placeholder { color: var(--faint); font-style: italic; margin: 0; }
    .related .why { display: block; margin-top: 6px; color: #b9c1cf; font-size: 12.5px; line-height: 1.45; }

    /* ---------- Tooltip & glossary ---------- */
    .tooltip {
      position: fixed;
      pointer-events: none;
      z-index: 60;
      max-width: 300px;
      background: rgba(27, 30, 39, 0.98);
      border: 1px solid var(--line-strong);
      border-radius: var(--r-lg);
      padding: 12px 14px;
      box-shadow: var(--shadow);
    }
    .tooltip.show { animation: pop 0.16s var(--ease); }
    .tooltip .tt-name { font-weight: 700; font-size: 14px; margin-bottom: 6px; }
    .tooltip .tt-def { margin: 8px 0 0; color: #cfd5e0; line-height: 1.45; font-size: 12.5px; }
    .tooltip .tt-meta { margin-top: 8px; font: 11.5px var(--mono); color: var(--muted); line-height: 1.5; }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 80;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(3px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      animation: fadeIn 0.2s var(--ease);
    }
    .modal {
      width: min(560px, 100%);
      max-height: calc(100vh - 32px);
      overflow-y: auto;
      background: var(--surface);
      border: 1px solid var(--line-strong);
      border-radius: var(--r-xl);
      padding: 22px 24px;
      box-shadow: var(--shadow);
      animation: pop 0.28s var(--ease);
    }
    .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .modal-head h2 { margin: 0; font-size: 20px; }
    .modal-close {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--surface-3);
      border: none;
      color: var(--muted);
      font-size: 18px;
      cursor: pointer;
      line-height: 1;
    }
    .modal-close:hover { color: var(--text); }
    .gloss-item {
      display: grid;
      grid-template-columns: 14px 1fr;
      gap: 4px 10px;
      padding: 12px 14px;
      margin-bottom: 6px;
      background: var(--surface-2);
      border-radius: var(--r-md);
    }
    .gloss-item .dot { margin-top: 5px; }
    .gloss-item strong { font-size: 14px; }
    .gloss-item p { grid-column: 2; margin: 0; color: #cfd5e0; line-height: 1.45; }
    .gloss-item .n { color: var(--faint); font: 12px var(--mono); margin-left: 6px; }
    .modal .more { margin-top: 14px; color: #cfd5e0; line-height: 1.55; }
    .modal .more p { margin: 0 0 8px; }

    .error { padding: 24px; color: #ff8a80; font: 13px var(--mono); line-height: 1.6; }

    /* ---------- Example data (Atlas 2 preview) ----------
       Anything built on atlas2_example.json sits in a dashed amber frame with an "Example data" badge,
       so it can never be mistaken for real findings. */
    :root { --ex: #ffc46b; --ex-line: rgba(255, 196, 107, 0.55); --ex-bg: rgba(255, 183, 77, 0.06); }
    .ex-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 9px;
      border: 1px dashed var(--ex-line);
      border-radius: 999px;
      background: var(--ex-bg);
      color: var(--ex);
      font: 600 10.5px var(--mono);
      letter-spacing: 0.4px;
      text-transform: uppercase;
      white-space: nowrap;
      vertical-align: 1px;
    }
    .ex-zone {
      position: relative;
      border: 1.5px dashed var(--ex-line);
      border-radius: var(--r-lg);
      background:
        repeating-linear-gradient(135deg, rgba(255, 196, 107, 0.035) 0 8px, transparent 8px 16px),
        var(--surface-2);
      padding: 14px 14px 12px;
      margin-top: 14px;
    }
    .ex-zone > .ex-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
    .ex-zone > .ex-head .t { font: 600 11px var(--mono); color: var(--text); text-transform: uppercase; letter-spacing: 0.6px; }
    .ex-zone .ex-note { margin: 8px 0 0; font-size: 11.5px; color: var(--muted); line-height: 1.45; }
    .cert { display: inline-grid; place-items: center; width: 13px; height: 13px; box-sizing: border-box; border-radius: 50%; font: 700 9px var(--sans); line-height: 1; vertical-align: -1px; flex: 0 0 auto; }
    .cert-recorded { background: #aab3c5; }
    .cert-ai { border: 1.5px dashed #9fb6d9; color: #9fb6d9; }
    .cert-checked { background: #7fd39a; color: #0d0e12; }
    .cert-key { display: flex; flex-wrap: wrap; gap: 4px 12px; font: 11px var(--mono); color: var(--muted); }
    .cert-key span { display: inline-flex; align-items: center; gap: 5px; }
    /* Evidence card */
    .dir { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 6px; font: 700 12px var(--sans); flex: 0 0 auto; }
    .dir-increased { background: rgba(139, 197, 255, 0.18); color: #a9d4ff; }
    .dir-reduced { background: rgba(244, 163, 192, 0.18); color: #f6b6cd; }
    .dir-noeffect { background: rgba(154, 162, 178, 0.18); color: #c3c9d4; }
    .dir-mixed { background: rgba(201, 182, 255, 0.18); color: #d6c9ff; }
    .ev-title { margin: 0 0 10px; font-size: 14px; line-height: 1.4; }
    .ev-title b { font-weight: 600; }
    .ev-bars { display: grid; gap: 5px; }
    .ev-bar { display: grid; grid-template-columns: 20px 92px minmax(0, 1fr) 54px; align-items: center; gap: 8px; font-size: 12.5px; }
    .ev-bar .track { height: 8px; border-radius: 999px; background: rgba(255, 255, 255, 0.05); overflow: hidden; }
    .ev-bar .track i { display: block; height: 100%; border-radius: 999px; }
    .ev-bar .n { font: 11.5px var(--mono); color: var(--muted); text-align: right; }
    .ev-facts { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 6px 10px; margin-top: 12px; font-size: 12.5px; line-height: 1.45; }
    .ev-facts .k { font: 11px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; padding-top: 1px; }
    .ev-facts .v { color: #d5dbe6; }
    .holds { display: grid; gap: 3px; }
    .holds .hrow { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
    .holds .hk { color: var(--muted); min-width: 0; }
    .holds .hv { display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; }
    .holds .hv .dir { width: 16px; height: 16px; font-size: 10px; border-radius: 4px; }
    .finding {
      display: grid;
      grid-template-columns: 20px minmax(0, 1fr);
      gap: 8px;
      width: 100%;
      text-align: left;
      background: rgba(13, 14, 18, 0.45);
      border: 1px solid var(--line);
      border-radius: var(--r-sm);
      padding: 9px 10px;

      transition: border-color 0.2s;

    .finding:hover { border-color: var(--line-strong); }
    .finding .st { font-size: 12.5px; line-height: 1.45; color: #e3e7ee; }

    .strength-bars { letter-spacing: 1px; color: #cfd5e0; }
    .ex-empty { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; color: var(--muted); font-size: 12.5px; }

    /* Orbit tools: mode switch and split-by */
    .orbit-tools {
      position: absolute;
      top: 12px;

      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }
    .seg {
      display: inline-flex;
