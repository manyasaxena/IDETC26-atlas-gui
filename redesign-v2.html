        const list = EX.papers.filter((p) => p.concepts.includes(center.id) && (!state.connection || p.concepts.includes(state.connection)) && exPaperPasses(p));
        if (!list.length) return "";
        return `<div class="ex-zone ex-papers">
          <div class="ex-head"><span class="t">Example papers (${list.length})</span>${exampleBadge()}</div>
          <div class="rows">${list.map((p) => `<button type="button" class="paper-row" data-action="paper" data-id="${esc(p.id)}"><span class="p-title">${esc(p.title)}</span><span class="p-meta">${esc(p.authors)} · ${p.year} · ${plural((p.findings || []).length, "finding")}</span></button>`).join("")}</div>
          <p class="ex-note">Made-up papers with Atlas 2 study cards. Not counted in the real papers above.</p>
        </div>`;
      }

      function updateTabs() {
        const counts = { papers: papersListForTab().length, connections: visibleNeighbors().length };
        let active = null;
        $("tabs").querySelectorAll(".tab").forEach((btn) => {
          const tab = btn.dataset.tab;
          btn.textContent = `${tab === "papers" ? "Papers" : "Connections"} (${counts[tab]})`;
          btn.classList.toggle("active", tab === state.tab);
          if (tab === state.tab) active = btn;
        });
        const indicator = $("tab-indicator");
        indicator.style.width = `${active.offsetWidth}px`;
        indicator.style.transform = `translateX(${active.offsetLeft}px)`;
      }

      function renderRight({ keepScroll = false } = {}) {
        updateTabs();
        const body = $("right-body");
        const scroll = body.scrollTop;
        const html = state.tab === "papers"
          ? state.paper != null ? renderPaperDetail() : renderPapersList()
          : state.connection ? renderConnectionDetail() : renderConnectionsList();
        body.innerHTML = `<div class="pane ${keepScroll ? "" : "swap"}">${html}</div>`;
        body.scrollTop = keepScroll ? scroll : 0;
        appendFrom = null;
      }

      function highlightRow(id, on) {
        $("right-body").querySelectorAll(".conn-row").forEach((row) => {
          if (row.dataset.id === id) row.classList.toggle("hovered", on);
        });
      }

      $("tabs").addEventListener("click", (event) => {
        const tab = event.target.closest("[data-tab]");
        if (!tab || tab.dataset.tab === state.tab) return;
        state.tab = tab.dataset.tab;
        renderRight();
        updateOrbit();
      });

      $("right-body").addEventListener("click", (event) => {
        const el = event.target.closest("[data-action]");
        if (!el) return;
        const id = el.dataset.id;
        switch (el.dataset.action) {
          case "paper":
          case "paper-push":
            openPaper(isExampleId(id) ? id : Number(id));
            break;
          case "back-paper":
            // Step back to the previous paper if we came from one; otherwise to the paper list (shared papers for a connection).
            if (state.paperTrail.length) history.back();
            else { state.keepPapersTab = true; closePaper(); }
            break;
          case "conn":
            selectConnection(id);
            break;
          case "compare":
            toggleCompare(el.dataset.a, el.dataset.b);
            break;
          case "back-conns":
          case "clear-conn":
            clearConnection();
            break;
          case "clear-range":
            setRange(Y0, Y1);
            break;
          case "pin":
            togglePins(el.dataset.ids.split(","));
            break;
          case "open-concept":
            openConcept(id);
            break;
          case "more-papers":
            appendFrom = state.papersShown;
            state.papersShown += PAGE;
            renderRight({ keepScroll: true });
            break;
          case "more-conn-papers":
            state.connPapersShown += PAGE;
            renderRight({ keepScroll: true });
            break;
        }
      });
      $("right-body").addEventListener("keydown", (event) => {
        if ((event.key === "Enter" || event.key === " ") && event.target.matches('[role="button"]')) {
          event.preventDefault();
          event.target.click();
        }
      });
      $("right-body").addEventListener("change", (event) => {
        const which = event.target.dataset.change;
        if (which === "papers-sort") { state.papersSort = event.target.value; state.papersShown = PAGE; }
        else if (which === "conn-sort") state.connSort = event.target.value;
        else return;
        renderRight();
      });
      $("right-body").addEventListener("mouseover", (event) => {
        const row = event.target.closest("[data-hover]");
        const id = row ? row.dataset.hover : null;
        if (id === state.hover) return;
        state.hover = id;
        styleOrbit();
      });
      $("right-body").addEventListener("mouseleave", () => {
        if (state.hover === null) return;
        state.hover = null;
        styleOrbit();
      });

      // ---------- Filters: one shared panel, and the active filters under the top bar ----------
      const filterCount = () => state.pins.length + (rangeActive() ? 1 : 0) + (state.minPapers > 1 ? 1 : 0) + (state.types.size < nodeTypes.length ? 1 : 0) + exFilterCount();

      function pinButton(ids, what) {
        const on = ids.every((id) => state.pins.includes(id));
        return `<button type="button" class="pin-btn ${on ? "on" : ""}" data-action="pin" data-pin="${esc(ids.join(","))}" data-ids="${esc(ids.join(","))}"
          title="Only count papers that include ${esc(what)}">${on ? "✓ Narrowed to papers with " + esc(what) : "＋ Narrow to papers with " + esc(what)}</button>`;
      }

      function clearExFilters() {
        state.exValues = new Map();
        state.exMin = new Map();
        state.exCert = new Set(["recorded", "ai", "checked"]);
      }

      // Pins all the given concepts, or unpins them if they're all pinned already.
      function togglePins(ids) {
        const all = ids.every((id) => state.pins.includes(id));
        if (all) state.pins = state.pins.filter((id) => !ids.includes(id));
        else ids.forEach((id) => { if (!state.pins.includes(id)) state.pins.push(id); });
        applyFilters();
      }

      // Re-renders whatever view is showing after a filter change. Slider drags (live) skip rebuilding the panels.
      let filterFrame = null;
      function applyFilters({ live = false } = {}) {
        recomputeScope();
        renderFilterBar();
        if (live) refreshFilterRange(); else renderFilterPanel();
        if (state.view === "concept") { if (live) refreshLeftLive(); else renderLeft(false); }
        if (filterFrame) return;
        filterFrame = requestAnimationFrame(() => {
          filterFrame = null;
          if (state.view === "field") updateField();
          else if (state.view === "landing") renderLanding();
          else if (state.view === "concept") {
            renderCompare();
            fitOrbitViewBox(false);
            updateOrbit(live ? 260 : 450);
            renderRight({ keepScroll: true });
          }
        });
      }

      // Combinations to try when the pinned concepts share no papers: drop one pin at a time.
      function gapSuggestions() {
        if (state.pins.length < 2) return [];
        return state.pins.map((drop) => {
          const keep = state.pins.filter((id) => id !== drop);
          const sets = keep.map((id) => new Set(byId.get(id).papers.filter(inRange).map((p) => p.paper_id)));
          const n = [...sets[0]].filter((pid) => sets.every((set) => set.has(pid))).length;
          return { drop, n };
        }).filter((d) => d.n > 0).sort((a, b) => b.n - a.n);
      }

      function scopeCount() { return pinnedPapers ? [...pinnedPapers].filter((id) => inRange(paperById.get(id))).length : papersIn([...paperById.values()]).length; }
      const totalPapers = paperById.size;

      function renderFilterBar() {
        const bar = $("filter-bar");
        const n = filterCount();
        $("filters-count").hidden = !n;
        $("filters-count").textContent = n;
        if (!n) { bar.hidden = true; bar.innerHTML = ""; return; }
        const count = scopeCount();
        const chip = (html, action, value = "") => `<span class="chip-filter"><span>${html}</span><button type="button" data-fb="${action}" data-v="${esc(value)}" aria-label="Remove filter">×</button></span>`;
        const hidden = nodeTypes.filter((t) => !state.types.has(t));
        bar.innerHTML = `
          <span class="scope ${count ? "" : "gap"}">${count ? `<strong>${count}</strong> of ${totalPapers} papers match` : "<strong>0 papers:</strong> possible gap"}</span>
          ${state.pins.map((id) => chip(`Includes ${dot(byId.get(id).type)} ${esc(cap(byId.get(id).label))}`, "pin", id)).join("")}
          ${rangeActive() ? chip(`Years ${rangeText()}`, "range") : ""}
          ${state.minPapers > 1 ? chip(`Concepts with ≥ ${state.minPapers} papers`, "min") : ""}
          ${hidden.length ? chip(`Hiding ${listJoin(hidden.map((t) => typeOf(t).plural.toLowerCase()))}`, "types") : ""}
          ${exChips().map((c) => `<span class="chip-filter ex" title="Filters the example papers only"><span>◇ ${c.html}</span><button type="button" data-fb="ex-${c.kind}" data-v="${esc(c.v)}" aria-label="Remove filter">×</button></span>`).join("")}
          <button type="button" class="link-btn clear-all" data-fb="all">Clear all</button>`;
        bar.hidden = false;
      }
      $("filter-bar").addEventListener("click", (event) => {
        const el = event.target.closest("[data-fb]");
        if (!el) return;
        const what = el.dataset.fb;
        if (what === "pin") state.pins = state.pins.filter((id) => id !== el.dataset.v);
        if (what === "range" || what === "all") state.range = [Y0, Y1];
        if (what === "min" || what === "all") state.minPapers = 1;
        if (what === "types" || what === "all") state.types = new Set(nodeTypes);
        if (what === "all") { state.pins = []; clearExFilters(); }
        if (what === "ex-val") state.exValues.delete(el.dataset.v);
        if (what === "ex-min") state.exMin.delete(el.dataset.v);
        if (what === "ex-cert") state.exCert = new Set(["recorded", "ai", "checked"]);
        applyFilters();
      });

      function setFiltersOpen(open) {
        state.filtersOpen = open;
        $("filter-panel").hidden = !open;
        $("filters-btn").classList.toggle("open", open);
        $("filters-btn").setAttribute("aria-expanded", String(open));
        if (open) renderFilterPanel();
      }
      $("filters-btn").addEventListener("click", () => setFiltersOpen(!state.filtersOpen));

      // Type rows: one per type, nested under its group; groups collapse. Counts are concepts that pass the other filters.
      function typeTreeHtml() {
        const nested = shownTypeTree.some((t) => t.children.some((c) => c.total > 0));
        const shownOf = (type) => nodes.filter((n) => n.type === type && papersInRange(n.papers).length >= state.minPapers).length;
        const row = (t) => {
          const kids = t.children.filter((c) => c.total > 0);
          const open = !state.collapsedTypes.has(t.id);
          const caret = kids.length
            ? `<button type="button" class="caret ${open ? "open" : ""}" data-action="toggle-group" data-tid="${esc(t.id)}" aria-expanded="${open}" aria-label="Show or hide ${esc(t.plural)}">▶</button>`
            : nested ? `<span class="caret-spacer"></span>` : "";
          const on = t.nodeTypes.filter((id) => state.types.has(id)).length;
          const c = d3.sum(t.nodeTypes, shownOf);
          return `<div class="fnode" data-tid="${esc(t.id)}">
            <div class="frow">
              ${caret}
              <label><input type="checkbox" data-tid="${esc(t.id)}" ${on === t.nodeTypes.length ? "checked" : ""} data-partial="${on > 0 && on < t.nodeTypes.length}" />${dot(t.id)} ${esc(t.plural)} <span class="n">(${c})</span></label>
            </div>
            ${kids.length ? `<div class="fchildren ${open ? "" : "collapsed"}"><div>${kids.map(row).join("")}</div></div>` : ""}
          </div>`;
        };
        return shownTypeTree.filter((t) => !t.parentId).map(row).join("");
      }

      function renderFilterPanel() {
        const panel = $("filter-panel");
        if (!state.filtersOpen) return;
        const count = scopeCount();
        const sugg = count ? [] : gapSuggestions();
        const pins = state.pins.map((id, i) => `${i ? `<span class="and">and</span>` : ""}<span class="chip-filter">${dot(byId.get(id).type)}<span>${esc(cap(byId.get(id).label))}</span><button type="button" data-fp="unpin" data-v="${esc(id)}" aria-label="Remove">×</button></span>`).join("");
        panel.innerHTML = `
          <div class="fp-head">
            <h2>Filters</h2>
            <div class="actions">
              ${filterCount() ? `<button type="button" class="link-btn" data-fp="reset">Reset all</button>` : ""}
              <button type="button" class="modal-close" data-fp="close" aria-label="Close filters">×</button>
            </div>
          </div>
          <p class="fp-hint">These apply everywhere: the landing page, the orbit, connections and paper lists.</p>

          <section class="fp-section">
            <p class="label"><span>Narrow to papers that include</span></p>
            <p class="fp-hint">Pick concepts to see only the papers that cover all of them, e.g. a population and a construct.</p>
            ${pins ? `<div class="pin-list">${pins}</div>` : ""}
            <div class="pin-search">
              <input type="text" id="pin-input" placeholder="${state.pins.length ? "And also…" : "Add a concept…"}" autocomplete="off" />
              <div class="pin-results" id="pin-results" hidden></div>
            </div>
            <div class="scope-meter">
              <div class="bar"><i style="width:${(count / totalPapers) * 100}%"></i></div>
              <div class="txt"><strong>${count}</strong> of ${totalPapers} papers match</div>
            </div>
            ${!count ? `<div class="gap-box">
              <strong>0 papers: possible gap</strong>
              <p>No paper in the Atlas${rangeActive() ? ` from ${rangeText()}` : ""} covers ${state.pins.length > 1 ? "all of these together" : "this"}. That can be an open research question, or a sign the combination doesn't make sense.</p>
              ${sugg.length ? `<p>Closest combinations with papers:</p><div class="sugg">${sugg.map((d) => `<button type="button" data-fp="unpin" data-v="${esc(d.drop)}">Without ${esc(cap(byId.get(d.drop).label))} → ${plural(d.n, "paper")}</button>`).join("")}</div>` : ""}
            </div>` : ""}
          </section>

          <section class="fp-section">
            <p class="label"><span>Concept types</span></p>
            <div class="filters">${typeTreeHtml()}</div>
          </section>

          <section class="fp-section">
            <p class="label"><span>Years</span><span class="range-text ${rangeActive() ? "active" : ""}" id="fp-range-text">${rangeActive() ? rangeText() : "All years"}</span></p>
            <div class="range-slider">
              <div class="track"><div class="fill" id="fp-range-fill"></div></div>
              <input type="range" id="fp-lo" min="${Y0}" max="${Y1}" step="1" value="${state.range[0]}" aria-label="First year" />
              <input type="range" id="fp-hi" min="${Y0}" max="${Y1}" step="1" value="${state.range[1]}" aria-label="Last year" />
            </div>
            <div class="year-axis"><span>${Y0}</span><span>${Y1}</span></div>
          </section>

          <section class="fp-section">
            <p class="label"><span>Minimum papers per concept</span></p>
            <p class="fp-hint">Hide concepts that appear in only a few papers.</p>
            <div class="stepper">
              <button type="button" data-fp="min-" ${state.minPapers <= 1 ? "disabled" : ""} aria-label="Fewer">−</button>
              <span class="val">${state.minPapers}</span>
              <button type="button" data-fp="min+" ${state.minPapers >= 50 ? "disabled" : ""} aria-label="More">+</button>
              <span class="note">${nodes.filter(conceptOn).length} of ${nodes.length} concepts shown</span>
            </div>
          </section>
          ${exFiltersHtml()}`;
        panel.querySelectorAll("input[data-partial='true']").forEach((box) => { box.indeterminate = true; });
        refreshFilterRange();
      }

      function refreshFilterRange() {
        if (!state.filtersOpen || !$("fp-lo")) return;
        const [lo, hi] = state.range;
        const span = Y1 - Y0 || 1;
        $("fp-range-fill").style.left = `${((lo - Y0) / span) * 100}%`;
        $("fp-range-fill").style.right = `${((Y1 - hi) / span) * 100}%`;
        $("fp-range-text").textContent = rangeActive() ? rangeText() : "All years";
        $("fp-range-text").classList.toggle("active", rangeActive());
        if (Number($("fp-lo").value) !== lo) $("fp-lo").value = lo;
        if (Number($("fp-hi").value) !== hi) $("fp-hi").value = hi;
        $("fp-lo").style.zIndex = lo >= Y1 - 1 ? 3 : 1;
        const count = scopeCount();
        const meter = $("filter-panel").querySelector(".scope-meter");
        if (meter) {
          meter.querySelector("i").style.width = `${(count / totalPapers) * 100}%`;
          meter.querySelector("strong").textContent = count;
        }
      }

      $("filter-panel").addEventListener("click", (event) => {
        const caret = event.target.closest('[data-action="toggle-group"]');
        if (caret) {
          const id = caret.dataset.tid;
          if (state.collapsedTypes.has(id)) state.collapsedTypes.delete(id); else state.collapsedTypes.add(id);
          renderFilterPanel();
          return;
        }
        const item = event.target.closest(".search-item[data-id]");
        if (item) { togglePins([item.dataset.id]); $("pin-input")?.focus(); return; }
        const ex = event.target.closest("[data-ex]");
        if (ex) {
          const { v, val } = ex.dataset;
          if (ex.dataset.ex === "group") {
            if (state.exOpen.has(v)) state.exOpen.delete(v); else state.exOpen.add(v);
            renderFilterPanel();
            return;
          }
          if (ex.dataset.ex === "val") {
            const set = state.exValues.get(v) || new Set();
            if (set.has(val)) set.delete(val); else set.add(val);
            state.exValues.set(v, set);
          } else if (ex.dataset.ex === "min") {
            if (val === "") state.exMin.delete(v); else state.exMin.set(v, Number(val));
          } else if (ex.dataset.ex === "cert") {
            if (state.exCert.has(v)) { if (state.exCert.size > 1) state.exCert.delete(v); } else state.exCert.add(v);
          }
          applyFilters();
          return;
        }
        const el = event.target.closest("[data-fp]");
        if (!el) return;
        switch (el.dataset.fp) {
          case "close": setFiltersOpen(false); return;
          case "reset": state.pins = []; state.range = [Y0, Y1]; state.minPapers = 1; state.types = new Set(nodeTypes); clearExFilters(); break;
          case "unpin": state.pins = state.pins.filter((id) => id !== el.dataset.v); break;
          case "min-": state.minPapers = Math.max(1, state.minPapers - 1); break;
          case "min+": state.minPapers = Math.min(50, state.minPapers + 1); break;
        }
        applyFilters();
      });
      $("filter-panel").addEventListener("change", (event) => {
        const tid = event.target.dataset.tid;
        if (!tid) return;
        // Checking a group switches every type inside it; at least one type always stays on.
        const ids = typeOf(tid).nodeTypes;
        if (event.target.checked) ids.forEach((id) => state.types.add(id));
        else {
          const next = new Set([...state.types].filter((id) => !ids.includes(id)));
          if (next.size) state.types = next;
        }
        applyFilters();
      });
      $("filter-panel").addEventListener("input", (event) => {
        const id = event.target.id;
        if (id === "pin-input") {
          const q = event.target.value.trim();
          const results = $("pin-results");
          const matches = q ? nodes.filter((n) => !state.pins.includes(n.id) && fuzzyMatch(n.label, q))
            .sort((a, b) => (b.label.toLowerCase().includes(q.toLowerCase()) - a.label.toLowerCase().includes(q.toLowerCase())) || b.paperCount - a.paperCount)
            .slice(0, 6) : [];
          results.hidden = !matches.length;
          results.innerHTML = matches.map((n) => `<div class="search-item" data-id="${esc(n.id)}"><span>${dot(n.type)} ${esc(cap(n.label))}</span><span class="t">${esc(typeWord(n.type))}</span></div>`).join("");
          return;
        }
        if (id !== "fp-lo" && id !== "fp-hi") return;
        let lo = Number($("fp-lo").value), hi = Number($("fp-hi").value);
        if (lo > hi) {
          if (id === "fp-lo") lo = hi; else hi = lo;
          event.target.value = id === "fp-lo" ? lo : hi;
        }
        setRange(lo, hi);
      });
      $("filter-panel").addEventListener("keydown", (event) => {
        if (event.target.id !== "pin-input" || event.key !== "Enter") return;
        const first = $("pin-results").querySelector(".search-item");
        if (first) { event.preventDefault(); togglePins([first.dataset.id]); $("pin-input")?.focus(); }
      });

      // Shows a concept, and optionally one of its connections and/or a paper, as given by the address.
      // Moving within the same concept keeps the orbit and only refreshes what changed.
      // The year range carries over from concept to concept; everything else starts fresh.
      function showConcept(id, { connection = null, paper = null } = {}) {
        hideTip();
        if (state.view === "concept" && state.center === id) {
          const connChanged = connection !== state.connection;
          const prevPaper = state.paper;
          if (connChanged || paper == null) state.paperTrail = [];
          else if (prevPaper != null && paper !== prevPaper) {
            // Going back to the paper we came from pops the trail; opening a new one pushes the current paper.
            if (state.paperTrail[state.paperTrail.length - 1] === paper) state.paperTrail.pop();
            else state.paperTrail.push(prevPaper);
          }
          state.connection = connection;
          state.paper = paper;
          if (connChanged) { state.papersShown = PAGE; state.connPapersShown = PAGE; }
          state.tab = paper != null || state.keepPapersTab ? "papers" : connection ? "connections" : connChanged ? "papers" : state.tab;
          state.keepPapersTab = false;
          renderCrumbs();
          if (connChanged) renderLeft(false);
          renderRight();
          updateOrbit();
          return;
        }
        const fromField = state.view !== "concept";
        if (state.filtersOpen) setFiltersOpen(false);
        state.view = "concept";
        state.center = id;
        state.connection = connection;
        state.paper = paper;
        state.tab = paper != null || !connection ? "papers" : "connections";
        state.papersSort = "newest";
        state.papersShown = PAGE;
        state.connSort = "most";
        state.connPapersShown = PAGE;
        state.showTypes = new Set(nodeTypes);
        state.paperTrail = [];
        state.orbitLimit = ORBIT_STEP;
        state.hover = null;
        $("field-view").hidden = true;
        $("landing-view").hidden = true;
        const view = $("concept-view");
        view.hidden = false;
        if (fromField && !REDUCED_MOTION) {
          view.classList.remove("enter");
          void view.offsetWidth;
          view.classList.add("enter");
          setTimeout(() => view.classList.remove("enter"), 700);
        }
        renderCrumbs();
        renderCompare();
        fitOrbitViewBox(false);
        if (fromField) orbitSvg.call(orbitZoom.transform, d3.zoomIdentity);
        renderLeft(!fromField);
        renderRight();
        updateOrbit(fromField ? 750 : 650);
      }

      recomputeScope();
      renderFilterBar();
      route();
    })();
  </script>
</body>
</html>
