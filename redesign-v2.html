        const avail = 2 * Math.PI - TOP_GAP - SECTOR_PAD * Math.max(0, groups.length - 1);
        const minWeight = shown.length * 0.1;
        const weights = groups.map((g) => Math.max(g.items.length, minWeight));
        const totalWeight = d3.sum(weights) || 1;
        let a = -Math.PI / 2 + TOP_GAP / 2;
        groups.forEach((g, gi) => {
          const span = (avail * weights[gi]) / totalWeight;
          g.start = a;
          g.end = a + span;
          g.mid = a + span / 2;
          [0, 1, 2].forEach((k) => {
            const onRing = g.items.filter((d) => d.ring === k).sort(byRelevance);
            onRing.forEach((d, i) => {
              const frac = (i + 0.5 + RING_OFFSET[k]) / onRing.length;
              d.angle = a + span * Math.min(0.96, Math.max(0.04, frac));
              d.group = g;
            });
          });
          a += span + SECTOR_PAD;
        });
        shown.forEach((d) => {
          d.r = RINGS[d.ring];
          d.size = nodeR(d.total);
          d.x = d.r * Math.cos(d.angle);
          d.y = d.r * Math.sin(d.angle);
        });
        if (shown.length > 1) {
          const sim = d3.forceSimulation(shown)
            .force("radial", d3.forceRadial((d) => d.r, 0, 0).strength(0.5))
            .force("collide", d3.forceCollide((d) => d.size + 4).strength(0.8))
            .stop();
          for (let i = 0; i < 160; i += 1) {
            sim.tick();
            shown.forEach(keepInWedge);
          }
        }
        shown.forEach(keepInWedge);
        return groups;
      }

      // A node never leaves its type's slice, and collisions can only nudge it a little off its ring.
      function keepInWedge(d) {
        const g = d.group;
        let angle = Math.atan2(d.y, d.x);
        if (angle < -Math.PI / 2) angle += 2 * Math.PI;
        const r = Math.min(d.r + RING_BAND, Math.max(d.r - RING_BAND, Math.hypot(d.x, d.y) || d.r));
        const margin = Math.min((d.size + 6) / r, (g.end - g.start) / 2);
        angle = Math.min(g.end - margin, Math.max(g.start + margin, angle));
        d.x = r * Math.cos(angle);
        d.y = r * Math.sin(angle);
      }

      const boxesOverlap = (a, b) => a.x0 < b.x1 + 2 && a.x1 + 2 > b.x0 && a.y0 < b.y1 + 2 && a.y1 + 2 > b.y0;
      function circleHitsBox(c, b) {
        const nx = Math.max(b.x0, Math.min(c.x, b.x1)), ny = Math.max(b.y0, Math.min(c.y, b.y1));
        return (c.x - nx) ** 2 + (c.y - ny) ** 2 < c.r * c.r;
      }
      function textAt(box) {
        const x = box.anchor === "start" ? box.x0 : box.anchor === "end" ? box.x1 : (box.x0 + box.x1) / 2;
        return { x, y: box.y0 + 11, anchor: box.anchor };
      }
      // Spots to try for a label, best first: beside the node on its outer side, then above/below, then the other side.
      function labelCandidates(d, w, h) {
        const s = d.size;
        const angle = Math.atan2(d.y, d.x), cos = Math.cos(angle), sin = Math.sin(angle);
        const box = (x0, y0, anchor) => ({ x0, y0, x1: x0 + w, y1: y0 + h, anchor });
        const right = (dy) => box(d.x + s + 5, d.y - h / 2 + dy, "start");
        const left = (dy) => box(d.x - s - 5 - w, d.y - h / 2 + dy, "end");
        const below = (dx) => box(d.x - w / 2 + dx, d.y + s + 3, "middle");
        const above = (dx) => box(d.x - w / 2 + dx, d.y - s - 3 - h, "middle");
        const nudge = h / 2 + 4;
        const dir = cos >= 0 ? 1 : -1;
        const shift = Math.max(0, w / 2 - s);
        const sides = dir > 0 ? [right(0), right(-nudge), right(nudge)] : [left(0), left(-nudge), left(nudge)];
        const other = dir > 0 ? [left(0), left(-nudge), left(nudge)] : [right(0), right(-nudge), right(nudge)];
        const outV = sin < 0 ? above : below, inV = sin < 0 ? below : above;
        const vert = (fn) => [fn(0), fn(dir * shift), fn(-dir * shift)];
        if (Math.abs(cos) > 0.35) return [...sides, ...vert(outV), ...vert(inV), ...other];
        return [...vert(outV), ...sides, ...other, ...vert(inV)];
      }

      // Greedy placement: the selected and highlighted neighbors pick first, then by relevance.
      // A label that can't fit without overlapping stays hidden until its node is hovered.
      function placeLabels(shown, groups, center, centerSize, inPaper) {
        const { vb } = orbit;
        const inBounds = (b) => b.x0 >= vb.x0 && b.x1 <= vb.x1 && b.y0 >= vb.y0 && b.y1 <= vb.y1;
        const boxes = RINGS.map((r, i) => {
          const w = RING_NAMES[i].length * 6 + 6;
          return { x0: -w / 2, x1: w / 2, y0: -r - 6, y1: -r + 6 };
        });
        orbit.centerLines = wrapLabel(cap(center.label));
        const cw = d3.max(orbit.centerLines, (l) => l.length) * 8.4;
        boxes.push({ x0: -cw / 2, x1: cw / 2, y0: centerSize + 5, y1: centerSize + 8 + orbit.centerLines.length * 17 });
        // The legend floats over the orbit, so labels treat its footprint as taken.
        // (Mapped through the target viewBox, since the svg may still be animating toward it.)
        const legendRect = $("orbit-legend").getBoundingClientRect();
        const wrapRect = $("orbit-wrap").getBoundingClientRect();
        if (orbit.box && legendRect.width) {
          const toVb = (px, py) => ({ x: orbit.box[0] + (px - wrapRect.left) * orbit.unit, y: orbit.box[1] + (py - wrapRect.top) * orbit.unit });
          const p1 = toVb(legendRect.left - 8, legendRect.top - 8);
          const p2 = toVb(legendRect.right + 8, legendRect.bottom + 8);
          boxes.push({ x0: p1.x, y0: p1.y, x1: p2.x, y1: p2.y });
        }
        const circles = shown.map((d) => ({ id: d.node.id, x: d.x, y: d.y, r: d.size + 2 }));
        circles.push({ id: center.id, x: 0, y: 0, r: centerSize + 3 });

        // Each type's name sits just outside the outer edge of its slice and is always shown;
        // it slides along that edge if the middle spot is taken (by the legend, say).
        groups.forEach((g) => {
          const w = typeOf(g.type).plural.length * 8 + 4;
          const span = g.end - g.start;
          const spots = [0, -0.25, 0.25, -0.4, 0.4].map((f) => {
            const angle = g.mid + f * span;
            const cos = Math.cos(angle), sin = Math.sin(angle);
            const anchor = cos > 0.3 ? "start" : cos < -0.3 ? "end" : "middle";
            const x = SECTOR_LABEL_R * cos;
            const y = SECTOR_LABEL_R * sin + (sin > 0.5 ? 11 : sin < -0.5 ? 0 : 4);
            const x0 = anchor === "start" ? x : anchor === "end" ? x - w : x - w / 2;
            return { label: { x, y, anchor }, box: { x0, x1: x0 + w, y0: y - 11, y1: y + 3 } };
          });
          const spot = spots.find((s) => inBounds(s.box) && !boxes.some((o) => boxesOverlap(o, s.box))) || spots[0];
          g.label = spot.label;
          boxes.push(spot.box);
        });

        const priority = (d) => (d.node.id === state.connection ? 2 : inPaper && inPaper.has(d.node.id) ? 1 : 0);
        shown.slice().sort((a, b) => priority(b) - priority(a) || byRelevance(a, b)).forEach((d) => {
          d.lines = wrapLabel(cap(d.node.label));
          const cands = labelCandidates(d, d3.max(d.lines, (l) => l.length) * CHAR_W, d.lines.length * LINE_H);
          d.lab = { ...textAt(cands[0]), placed: false };
          if (inPaper && !inPaper.has(d.node.id)) return;
          const fit = cands.find((b) => inBounds(b) && !boxes.some((o) => boxesOverlap(o, b)) && !circles.some((c) => c.id !== d.node.id && circleHitsBox(c, b)));
          if (fit) {
            d.lab = { ...textAt(fit), placed: true };
            boxes.push(fit);
          }
        });
      }

      // Example findings between the center and each neighbor that pass the Atlas 2 filters.
      function findingPartners(centerId) {
        const map = new Map();
        if (!EX) return map;
        (EX.byConcept.get(centerId) || []).filter(exFindingPasses).forEach((f) => {
          const other = f.iv === centerId ? f.dv : f.iv;
          if (!map.has(other)) map.set(other, []);
          map.get(other).push(f);
        });
        return map;
      }

      function updateOrbit(duration = 650) {
        const center = byId.get(state.center);
        const findingsMode = state.orbitMode === "findings" && !!EX;
        const partners = findingsMode ? findingPartners(center.id) : null;
        const typed = visibleNeighbors().filter((d) => !partners || partners.has(d.node.id)).sort(byRelevance);
        typed.forEach((d) => { d.findings = partners ? partners.get(d.node.id) : null; });
        const base = typed.slice(0, state.orbitLimit);
        const baseIds = new Set(base.map((d) => d.node.id));
        const paper = currentPaper();
        const inPaper = paper ? new Set(conceptIdsOfPaper(paper)) : null;
        // The selected connection and the open paper's concepts always appear, even outside the top N.
        const extras = typed.filter((d) => !baseIds.has(d.node.id) && (d.node.id === state.connection || (inPaper && inPaper.has(d.node.id))));
        base.forEach((d, i) => { d.ring = Math.min(2, Math.floor((i * 3) / base.length)); });
        extras.forEach((d) => { d.ring = 2; });
        const shown = base.concat(extras);
        const centerSize = Math.max(12, nodeR(papersOf(center).length));
        Object.assign(orbit, { center, shown, inPaper, typedCount: typed.length, centerSize, findingsMode });
        shown.forEach((d) => { d.split = splitCounts(d); });
        // The legend and tools are drawn first so label placement sees their final size.
        renderOrbitTools();
        renderOrbitLegend();

        const groups = layoutOrbit(shown);
        placeLabels(shown, groups, center, centerSize, inPaper);

        const t = orbitSvg.transition("layout").duration(ms(duration)).ease(d3.easeCubicOut);
        const key = (d) => d.node.id;

        centerCircle.transition(t).attr("r", centerSize).attr("fill", colorOf(center.type));
        centerLabel.selectAll("tspan").data(orbit.centerLines).join("tspan")
          .attr("x", 0)
          .attr("dy", (l, i) => (i ? 17 : 0))
          .text((l) => l);
        centerLabel.transition(t).attr("y", centerSize + 18);

        wedgeG.selectAll("path").data(groups, (g) => g.type).join(
          (enter) => enter.append("path").attr("class", "wedge")
            .each(function (g) {
              const a = arcAngles(g);
              this._arc = { startAngle: a.startAngle, endAngle: a.startAngle };
            })
            .attr("d", function () { return wedgeArc(this._arc); }),
          (update) => update,
          (exit) => exit.transition(t).style("opacity", 0).remove()
        )
          .style("fill", (g) => colorOf(g.type))
          .style("stroke", (g) => colorOf(g.type))
          .transition(t)
          .style("opacity", 1)
          .attrTween("d", function (g) {
            const target = arcAngles(g);
            const interp = d3.interpolate(this._arc || target, target);
            this._arc = target;
            return (k) => wedgeArc(interp(k));
          });

        sectorLabelG.selectAll("text").data(groups, (g) => g.type).join(
          (enter) => enter.append("text").attr("class", "sector-label").style("opacity", 0),
          (update) => update,
          (exit) => exit.transition(t).style("opacity", 0).remove()
        )
          .attr("fill", (g) => colorOf(g.type))
          .attr("text-anchor", (g) => g.label.anchor)
          .text((g) => typeOf(g.type).plural)
          .transition(t)
          .style("opacity", 1)
          .attr("x", (g) => g.label.x)
          .attr("y", (g) => g.label.y);

        spokeG.selectAll("line").data(shown, key).join(
          (enter) => enter.append("line").attr("class", "spoke").attr("x1", 0).attr("y1", 0).attr("x2", 0).attr("y2", 0),
          (update) => update,
          (exit) => exit.transition(t).attr("x2", 0).attr("y2", 0).style("opacity", 0).remove()
        ).transition(t)
          .style("opacity", null)
          .attr("x2", (d) => d.x)
          .attr("y2", (d) => d.y);

        orbitNodeG.selectAll("g.onode").data(shown, key).join(
          (enter) => {
            const g = enter.append("g").attr("class", "onode").attr("transform", "translate(0,0)").style("opacity", 0);
            g.append("circle").attr("class", "hit");
            g.append("circle").attr("class", "fill").attr("r", 0);
            g.on("mouseenter", (event, d) => {
              state.hover = d.node.id;
              styleOrbit();
              highlightRow(d.node.id, true);
              const range = rangeActive() ? ` in ${rangeText()}` : "";
              const split = d.split ? `<br/>${d.split.filter((x) => x.n).map((x) => `${esc(x.key)} ${x.n}`).join(" · ")}` : "";
              const found = d.findings ? `<br/>◇ Example findings: ${d.findings.map((f) => DIR[f.direction].sym).join(" ")}` : "";
              showTip(conceptTip(d.node, `${plural(d.shared, "shared paper")}${range} · ${pct(d.j)} overlap<br/>${RING_NAMES[d.ring]} · click to see the connection${split}${found}`), event, $("orbit-wrap"));
            })
              .on("mousemove", moveTip)
              .on("mouseleave", (event, d) => {
                state.hover = null;
                styleOrbit();
                highlightRow(d.node.id, false);
                hideTip();
              })
              .on("click", (event, d) => {
                event.stopPropagation();
                hideTip();
                selectConnection(d.node.id);
              });
            return g;
          },
          (update) => update,
          (exit) => exit.transition(t).attr("transform", "translate(0,0)").style("opacity", 0).remove()
        )
          .call((g) => g.select("circle.hit").attr("r", (d) => Math.max(d.size + 3, 11)))
          .call((g) => g.select("circle.fill").attr("fill", (d) => colorOf(d.node.type)).transition(t).attr("r", (d) => d.size))
          .transition(t)
          .style("opacity", 1)
          .attr("transform", (d) => `translate(${d.x},${d.y})`);

        labelG.selectAll("text.nb-name").data(shown, key).join(
          (enter) => enter.append("text").attr("class", "name nb-name").attr("transform", "translate(0,0)"),
          (update) => update,
          (exit) => exit.remove()
        )
          .attr("text-anchor", (d) => d.lab.anchor)
          .each(function (d) {
            d3.select(this).selectAll("tspan").data(d.lines).join("tspan")
              .attr("x", 0)
              .attr("dy", (l, i) => (i ? LINE_H : 0))
              .text((l) => l);
          })
          .transition(t)
          .attr("transform", (d) => `translate(${d.lab.x},${d.lab.y})`);
        centerLabel.raise();
        drawSplitRings(shown, t);
        drawFindings(shown, t);
        $("orbit-wrap").classList.toggle("findings-mode", findingsMode);
        ringG.selectAll("circle").classed("dim", findingsMode);
        ringLabelG.selectAll("text").classed("dim", findingsMode);

        const empty = $("orbit-empty");
        empty.hidden = shown.length > 0;
        if (!shown.length) {
          empty.textContent = findingsMode
            ? "No example findings involve this concept (or none match your filters). Try cognitive fixation or divergent thinking."
            : !papersOf(center).length && scopeActive()
            ? "No papers match your filters."
            : !neighborData().length
              ? scopeActive() ? "No connections that match your filters." : "No connections for this concept in the graph."
              : "No connections that match your filters.";
        }
        styleOrbit();
      }

      function styleOrbit() {
        const { center, inPaper } = orbit;
        if (!center) return;
        const sel = state.connection, hov = state.hover;
        const faded = (id) => !!inPaper && !inPaper.has(id);

        spokeG.selectAll("line.spoke")
          .classed("hide", () => !!orbit.findingsMode)
          .classed("sel", (d) => d.node.id === sel)
          .classed("faded", (d) => d.node.id !== sel && faded(d.node.id))
          .classed("lit", (d) => !!inPaper && !faded(d.node.id))
          .style("stroke", (d) => (d.node.id === sel ? colorOf(d.node.type) : null));
        orbitNodeG.selectAll("g.onode")
          .classed("faded", (d) => faded(d.node.id))
          .classed("sel", (d) => d.node.id === sel)
          .classed("hov", (d) => d.node.id === hov);
        labelG.selectAll("text.nb-name")
          .classed("show", (d) => !faded(d.node.id) && (d.lab.placed || d.node.id === hov || d.node.id === sel));
        centerG.classed("faded", faded(center.id));

        orbitNodeG.selectAll("g.onode").filter((d) => d.node.id === hov || d.node.id === sel).raise();
        labelG.selectAll("text.nb-name").filter((d) => d.node.id === hov).raise();

        const paper = currentPaper();
        const note = $("orbit-note");
        if (paper) {
          const count = conceptIdsOfPaper(paper).length;
          note.textContent = `Highlighting the ${plural(count, "concept")} in “${paperTitle(paper)}”`;
          note.hidden = false;
        } else {
          note.hidden = true;
        }
      }

      // A tiny pie in the colors of the first few types.
      function sliceIcon() {
        const colors = nodeTypes.slice(0, 3).map(colorOf);
        if (colors.length < 2) return `<svg width="30" height="18" aria-hidden="true"><circle cx="15" cy="9" r="8" fill="${colors[0] || "#8a93a6"}" fill-opacity="0.5"/></svg>`;
        const point = (a) => `${(15 + 8 * Math.sin(a)).toFixed(1)} ${(9 - 8 * Math.cos(a)).toFixed(1)}`;
        const paths = colors.map((c, i) => {
          const a0 = (i / colors.length) * 2 * Math.PI, a1 = ((i + 1) / colors.length) * 2 * Math.PI;
          return `<path d="M15 9 L${point(a0)} A8 8 0 0 1 ${point(a1)} Z" fill="${c}" fill-opacity="0.5"/>`;
        }).join("");
        return `<svg width="30" height="18" aria-hidden="true">${paths}</svg>`;
      }

      // ---------- Split by ----------
      const DECADES = d3.range(Math.floor(Y0 / 10) * 10, Y1 + 1, 10);
      const DECADE_COLORS = ["#3d5580", "#4f72ab", "#6d95d0", "#97baea", "#cfe3ff"];
      const SPLIT_COLORS = ["#8bc5ff", "#f4a3c0", "#a5e3b0", "#d6c9ff", "#ffd59a", "#80cbc4"];
      const NOT_CODED = "#3a3f4d";
      const SPLIT_VARS = ["subject_expertise", "task_team", "setting", "method", "condition_tool"];
      const splitIsExample = () => state.splitBy && state.splitBy !== "decade";

      // Slices for one orbit node: decades of its shared papers (real), or values of an Atlas 2 variable
      // among example papers covering both concepts, with every real shared paper counted as "not coded yet".
      function splitKeys() {
        if (state.splitBy === "decade") return DECADES.map((d) => `${d}s`);
        const def = EX?.varById.get(state.splitBy);
        if (!def) return [];
        return [...(def.kind === "yesno" ? ["yes", "no"] : def.values || []), "not coded yet"];
      }
      function splitColor(key, i) {
        if (state.splitBy === "decade") return DECADE_COLORS[Math.min(i, DECADE_COLORS.length - 1)];
        return key === "not coded yet" ? NOT_CODED : SPLIT_COLORS[i % SPLIT_COLORS.length];
      }
      function splitCounts(d) {
        if (!state.splitBy) return null;
        const keys = splitKeys();
        const counts = new Map(keys.map((k) => [k, 0]));
        if (state.splitBy === "decade") {
          d.sharedPapers.forEach((p) => { const k = `${Math.floor(p.year / 10) * 10}s`; counts.set(k, (counts.get(k) || 0) + 1); });
        } else {
          const def = EX.varById.get(state.splitBy);
          EX.papers.filter((p) => p.concepts.includes(state.center) && p.concepts.includes(d.node.id) && exPaperPasses(p)).forEach((p) => {
            const v = p.values?.[def.id];
            const k = v && state.exCert.has(v.certainty) ? fmtValue(v, def) : "not coded yet";
            counts.set(k, (counts.get(k) || 0) + 1);
          });
          counts.set("not coded yet", counts.get("not coded yet") + d.shared);
        }
        return keys.map((k, i) => ({ key: k, n: counts.get(k) || 0, color: splitColor(k, i) }));
      }
      const splitPie = d3.pie().sort(null).value((x) => x.n);
      function drawSplitRings(shown, t) {
        const data = state.splitBy ? shown.filter((d) => d.split && d3.sum(d.split, (x) => x.n)) : [];
        splitG.selectAll("g.split-ring").data(data, (d) => d.node.id).join(
          (enter) => enter.append("g").attr("class", "split-ring").style("opacity", 0).attr("pointer-events", "none"),
          (update) => update,
          (exit) => exit.remove()
        )
          .each(function (d) {
            const arc = d3.arc().innerRadius(d.size + 2.5).outerRadius(d.size + 7);
            d3.select(this).selectAll("path").data(splitPie(d.split.filter((x) => x.n))).join("path")
              .attr("d", arc)
              .attr("fill", (a) => a.data.color);
          })
          .transition(t)
          .style("opacity", 1)
          .attr("transform", (d) => `translate(${d.x},${d.y})`);
      }

      // ---------- Findings mode ----------
      const DIR_COLORS = { increased: "#8bc5ff", reduced: "#f4a3c0", "no effect": "#9aa2b2", mixed: "#c9b6ff" };
      // Marker ids per direction (set up at load time, before the DIR table further down exists).
      const DIR_MARK = { increased: "increased", reduced: "reduced", "no effect": "noeffect", mixed: "mixed" };
      function drawFindings(shown, t) {
        const data = orbit.findingsMode ? shown.filter((d) => d.findings && d.findings.length) : [];
        const center = orbit.center;
        // One arrow per neighbor, drawn from cause (IV) to effect (DV); its badge counts each direction.
        const items = data.map((d) => {
          const fs = d.findings;
          const fromCenter = fs.filter((f) => f.iv === center.id).length >= fs.length / 2;
          const dirs = Object.keys(DIR).map((k) => ({ k, n: fs.filter((f) => f.direction === k).length })).filter((x) => x.n);
          const main = dirs.length === 1 ? dirs[0].k : "mixed";
          const [sx, sy, ex, ey, sr, er] = fromCenter ? [0, 0, d.x, d.y, orbit.centerSize, d.size] : [d.x, d.y, 0, 0, d.size, orbit.centerSize];
          const len = Math.hypot(ex - sx, ey - sy) || 1;
          const ux = (ex - sx) / len, uy = (ey - sy) / len;
          return {
            d, main, dirs,
            x1: sx + ux * (sr + 3), y1: sy + uy * (sr + 3), x2: ex - ux * (er + 9), y2: ey - uy * (er + 9),
            mx: (sx + ex) / 2, my: (sy + ey) / 2,
            label: dirs.map((x) => `${DIR[x.k].sym}${x.n}`).join(" ")
          };
        });
        const g = findingG.selectAll("g.f-item").data(items, (x) => x.d.node.id).join(
          (enter) => {
            const e = enter.append("g").attr("class", "f-item").style("opacity", 0);
            e.append("path").attr("class", "f-link");
            const b = e.append("g").attr("class", "f-badge");
            b.append("rect").attr("rx", 7);
            b.append("text").attr("text-anchor", "middle").attr("dy", "0.35em");
            return e;
          },
          (update) => update,
          (exit) => exit.remove()
        );
        g.select("path")
          .attr("d", (x) => `M${x.x1},${x.y1}L${x.x2},${x.y2}`)
          .attr("stroke", (x) => DIR_COLORS[x.main])
          .attr("marker-end", (x) => `url(#arrow-${DIR_MARK[x.main]})`);
        g.select(".f-badge").attr("transform", (x) => `translate(${x.mx},${x.my})`);
        g.select(".f-badge text").text((x) => x.label).attr("fill", (x) => DIR_COLORS[x.main]);
        g.select(".f-badge rect")
          .attr("x", (x) => -(x.label.length * 3.6 + 6)).attr("y", -9)
          .attr("width", (x) => x.label.length * 7.2 + 12).attr("height", 18)
          .attr("fill", "rgba(13,14,18,0.92)")
          .attr("stroke", (x) => DIR_COLORS[x.main]);
        g.transition(t).style("opacity", 1);
      }
      // Arrowheads for each direction color.
      const defs = orbitSvg.append("defs");
      Object.entries(DIR_COLORS).forEach(([k, color]) => {
        defs.append("marker").attr("id", `arrow-${DIR_MARK[k]}`).attr("viewBox", "0 0 10 10").attr("refX", 2).attr("refY", 5)
          .attr("markerWidth", 6).attr("markerHeight", 6).attr("orient", "auto-start-reverse")
          .append("path").attr("d", "M0,0L10,5L0,10z").attr("fill", color);
      });

      function renderOrbitTools() {
        const options = [`<option value="" ${!state.splitBy ? "selected" : ""}>Nothing</option>`, `<option value="decade" ${state.splitBy === "decade" ? "selected" : ""}>Decade</option>`]
          .concat(EX ? [`<optgroup label="◇ Example data (Atlas 2)">${SPLIT_VARS.map((vid) => EX.varById.get(vid)).filter(Boolean).map((def) => `<option value="${esc(def.id)}" ${state.splitBy === def.id ? "selected" : ""}>${esc(def.parentType ? `${typeOf(def.parentType)?.label.toLowerCase()} › ${def.label}` : def.label)}</option>`).join("")}</optgroup>`] : []);
        $("orbit-tools").innerHTML = `
          ${EX ? `<div class="seg" role="group" aria-label="What the orbit shows">
            <button type="button" class="${state.orbitMode === "together" ? "on" : ""}" data-mode="together">Studied together</button>
            <button type="button" class="ex ${state.orbitMode === "findings" ? "on" : ""}" data-mode="findings" title="Example data: made-up Atlas 2 findings">◇ Findings</button>
          </div>` : ""}
          <label class="split-pick">Split by <select id="split-by">${options.join("")}</select></label>`;
      }
      $("orbit-tools").addEventListener("click", (event) => {
        const b = event.target.closest("[data-mode]");
        if (!b || b.dataset.mode === state.orbitMode) return;
        state.orbitMode = b.dataset.mode;
        updateOrbit(450);
      });
      $("orbit-tools").addEventListener("change", (event) => {
        if (event.target.id !== "split-by") return;
        state.splitBy = event.target.value;
        updateOrbit(300);
      });

      function renderOrbitLegend() {
        const shownCount = orbit.shown.length;
        const more = orbit.typedCount > state.orbitLimit;
        const fewer = state.orbitLimit > ORBIT_STEP;
        $("orbit-legend").innerHTML = `
          <div class="row">
            <svg width="30" height="16" aria-hidden="true"><circle cx="6" cy="9" r="4" fill="#8a93a6"/><circle cx="21" cy="8" r="7" fill="#8a93a6"/></svg>
            <span>Size = the concept's papers${rangeActive() ? ` in ${rangeText()}` : ""}</span>
          </div>
          <div class="row">
            <svg width="30" height="18" aria-hidden="true"><circle cx="15" cy="9" r="2.5" fill="#8a93a6"/><circle cx="15" cy="9" r="5.5" fill="none" stroke="#6b7282" stroke-dasharray="2 2"/><circle cx="15" cy="9" r="8.5" fill="none" stroke="#6b7282" stroke-dasharray="2 2"/></svg>
            <span>Rings rank relevance: shared papers ÷ papers in either concept</span>
          </div>
          <div class="row">
            ${sliceIcon()}
            <span>Slices group the concept types</span>
          </div>
          ${orbit.findingsMode ? `<div class="legend-ex"><div>${exampleBadge("Findings · example data")}</div><span>Arrows run from cause to effect: ↑ increased · ↓ reduced · ○ no effect · ± mixed. Only pairs with example findings are shown.</span></div>` : ""}
          ${state.splitBy ? `<div class="row" style="align-items:flex-start"><svg width="30" height="18" aria-hidden="true"><circle cx="15" cy="9" r="5" fill="#8a93a6"/><circle cx="15" cy="9" r="7.5" fill="none" stroke="#6d95d0" stroke-width="3"/></svg>
            <span>${splitIsExample() ? `<span style="display:block;margin-bottom:4px">${exampleBadge()}</span>` : ""}Ring = shared papers split by ${esc(state.splitBy === "decade" ? "decade" : EX.varById.get(state.splitBy).label)}:
              <span class="legend-split">${splitKeys().map((k, i) => `<span><i style="background:${splitColor(k, i)}"></i>${esc(k)}</span>`).join("")}</span></span></div>` : ""}
          ${orbit.typedCount ? `<div class="legend-more">
            <span>Showing ${shownCount} of ${orbit.typedCount}</span>
            ${more ? `<button type="button" class="pill-btn" data-action="orbit-more">Show more</button>` : ""}
            ${fewer ? `<button type="button" class="pill-btn" data-action="orbit-fewer">Show fewer</button>` : ""}
          </div>` : ""}`;
      }
      $("orbit-legend").addEventListener("click", (event) => {
        const el = event.target.closest("[data-action]");
        if (!el) return;
        state.orbitLimit = el.dataset.action === "orbit-more" ? state.orbitLimit + ORBIT_STEP : ORBIT_STEP;
        updateOrbit();
      });

      // ---------- Compare tray ----------
      let lastCompared = null;
      const compareKey = (c) => pairKey(c.a, c.b);
      const isCompared = (a, b) => state.compare.some((c) => compareKey(c) === pairKey(a, b));

      function compareButton(a, b, extraClass = "") {
        const on = isCompared(a, b);
        const full = !on && state.compare.length >= MAX_COMPARE;
        return `<button type="button" class="compare-btn ${on ? "on" : ""} ${extraClass}" data-action="compare" data-a="${esc(a)}" data-b="${esc(b)}"
          ${full ? `disabled title="You can compare up to ${MAX_COMPARE} connections"` : ""}>${on ? "✓ Comparing" : "+ Compare"}</button>`;
      }

      function compareMiniChart(link, color) {
        const years = d3.range(Y0, Y1 + 1);
        const counts = d3.rollup(link.papers, (v) => v.length, (p) => p.year);
        const max = d3.max(years, (y) => counts.get(y) || 0) || 1;
        const W = 160, H = 22, bw = W / years.length;
        return `<svg class="cmp-chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">${years.map((y, i) => {
          const v = counts.get(y) || 0;
          if (!v) return "";
          const h = Math.max(1.5, (v / max) * H);
          const out = y < state.range[0] || y > state.range[1];
          return `<rect class="${out ? "out" : ""}" x="${i * bw + 0.4}" y="${H - h}" width="${bw - 0.8}" height="${h}" rx="1" fill="${color}"/>`;
        }).join("")}</svg>`;
      }

      function renderCompare() {
        const tray = $("compare-tray");
        if (!state.compare.length) {
          tray.hidden = true;
          tray.innerHTML = "";
          return;
        }
        const items = state.compare.map((c) => {
          const A = byId.get(c.a), B = byId.get(c.b);
          const link = linkByPair.get(compareKey(c));
          const papers = papersIn(link.papers);
          const n = papers.length;
          const either = papersOf(A).length + papersOf(B).length - n;
          return { c, A, B, link, n, j: either ? n / either : 0, lift: liftOf(n, papersOf(A).length, papersOf(B).length).lift, ids: new Set(papers.map((p) => p.paper_id)) };
        });
        const range = rangeActive() ? ` · ${rangeText()}` : "";
        const cards = items.map(({ c, A, B, link, n, j }, i) => `
          <div class="cmp-card ${compareKey(c) === lastCompared ? "pop" : ""}" role="button" tabindex="0" data-action="cmp-open" data-i="${i}" title="Open this connection">
            <div class="cmp-head">
              <span class="cmp-num">${i + 1}</span>
              <button type="button" class="cmp-x" data-action="cmp-remove" data-i="${i}" aria-label="Remove from comparison">×</button>
            </div>
            <div class="cmp-pair">${dot(A.type)}${esc(cap(A.label))}<span class="arrow">↔</span>${dot(B.type)}${esc(cap(B.label))}</div>
            <div class="cmp-stats"><strong>${plural(n, "paper")}</strong> · ${pct(j)} overlap${range}</div>
            ${compareMiniChart(link, colorOf(B.type))}
          </div>`).join("");
        lastCompared = null;

        // How many papers the compared connections have in common with each other.
        let overlap = "";
        const both = (x, y) => [...x.ids].filter((id) => y.ids.has(id)).length;
        const papersPhrase = (k, verb) => `${plural(k, "paper")} ${k === 1 ? `${verb}s` : verb}`;
        if (items.length === 2) {
          const k = both(items[0], items[1]);
          overlap = k ? `${papersPhrase(k, "appear")} in both` : "No papers appear in both";
        } else if (items.length === 3) {
          const pairs = [[0, 1], [0, 2], [1, 2]].map(([x, y]) => ({ x, y, k: both(items[x], items[y]) }));
          const all = [...items[0].ids].filter((id) => items[1].ids.has(id) && items[2].ids.has(id)).length;
          overlap = pairs.some((p) => p.k)
            ? `Papers in both — ${pairs.map((p) => `${p.x + 1} & ${p.y + 1}: ${p.k}`).join(" · ")} · all three: ${all}`
            : "No papers appear in more than one";
        }
        tray.innerHTML = `<div class="cmp-cards">${cards}</div>${overlap ? `<div class="cmp-overlap ${/^No /.test(overlap) ? "none" : ""}">${overlap}</div>` : ""}`;
        tray.hidden = false;
      }

      function refreshCompare() {
        renderCompare();
        if (state.view === "concept" && fitOrbitViewBox(true)) updateOrbit(450);
      }

      function toggleCompare(a, b) {
        const i = state.compare.findIndex((c) => compareKey(c) === pairKey(a, b));
        if (i >= 0) state.compare.splice(i, 1);
        else if (state.compare.length < MAX_COMPARE) {
          state.compare.push({ a, b });
          lastCompared = pairKey(a, b);
        }
        refreshCompare();
        renderRight({ keepScroll: true });
      }

      function removeCompared(i, card) {
        const finish = () => {
          state.compare.splice(i, 1);
          refreshCompare();
          renderRight({ keepScroll: true });
        };
        if (REDUCED_MOTION || !card) return finish();
        card.classList.add("leaving");
        setTimeout(finish, 180);
      }

      // Opens a compared connection, switching to one of its concepts first if needed.
      function openConnection(a, b) {
        if (state.center === b) navigate(conceptHash(b, a));
        else navigate(conceptHash(a, b));
      }

      $("compare-tray").addEventListener("click", (event) => {
        const el = event.target.closest("[data-action]");
        if (!el) return;
        const i = Number(el.dataset.i);
        if (el.dataset.action === "cmp-remove") removeCompared(i, el.closest(".cmp-card"));
        else if (el.dataset.action === "cmp-open") openConnection(state.compare[i].a, state.compare[i].b);
      });
      $("compare-tray").addEventListener("keydown", (event) => {
        if ((event.key === "Enter" || event.key === " ") && event.target.matches('[role="button"]')) {
          event.preventDefault();
          event.target.click();
        }
      });

      // ---------- Concept view: left panel ----------
      function yearChart(papers, overlay, overlayColor) {
        const years = d3.range(Y0, Y1 + 1);
        const counts = d3.rollup(papers, (v) => v.length, (p) => p.year);
        const overlayCounts = overlay ? d3.rollup(overlay, (v) => v.length, (p) => p.year) : null;
        const max = d3.max(years, (y) => counts.get(y) || 0) || 1;
        const W = 260, H = 64, bw = W / years.length;
        const bars = years.map((y, i) => {
          const v = counts.get(y) || 0;
          const o = overlayCounts ? overlayCounts.get(y) || 0 : 0;
          const h = (v / max) * H, oh = (o / max) * H;
          const tip = `${y}: ${plural(v, "paper")}${overlayCounts ? ` · ${o} shared` : ""}`;
          return `<g data-year="${y}"><title>${tip}</title>
            <rect x="${i * bw}" y="0" width="${bw}" height="${H}" fill="transparent"/>
            ${v ? `<rect x="${i * bw + 0.6}" y="${H - h}" width="${bw - 1.2}" height="${h}" rx="1.5" fill="var(--bar)"/>` : ""}
            ${o ? `<rect x="${i * bw + 0.6}" y="${H - oh}" width="${bw - 1.2}" height="${oh}" rx="1.5" fill="${overlayColor}"/>` : ""}
          </g>`;
        }).join("");
        return `<div class="chart-wrap"><svg class="year-chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Papers per year">${bars}</svg></div>`;
      }

      // "Show connections to": one row per type, nested under its group; groups collapse.
      function filterTreeHtml() {
        const nested = shownTypeTree.some((t) => t.children.some((c) => c.total > 0));
        const row = (t) => {
          const kids = t.children.filter((c) => c.total > 0);
          const open = !state.collapsedTypes.has(t.id);
          const caret = kids.length
            ? `<button type="button" class="caret ${open ? "open" : ""}" data-action="toggle-group" data-tid="${esc(t.id)}" aria-expanded="${open}" aria-label="Show or hide ${esc(t.plural)}">▶</button>`
            : nested ? `<span class="caret-spacer"></span>` : "";
          return `<div class="fnode" data-tid="${esc(t.id)}">
            <div class="frow">
              ${caret}
              <label><input type="checkbox" data-tid="${esc(t.id)}" />${dot(t.id)} ${esc(t.plural)} <span class="n" data-count></span></label>
            </div>
            ${kids.length ? `<div class="fchildren ${open ? "" : "collapsed"}"><div>${kids.map(row).join("")}</div></div>` : ""}
          </div>`;
        };
        return shownTypeTree.filter((t) => !t.parentId).map(row).join("");
      }

      function renderLeft(animate) {
        const center = byId.get(state.center);
        const link = selectedLink();
        const neighbor = link ? byId.get(state.connection) : null;
        $("left").innerHTML = `<div class="pane ${animate ? "swap" : ""}">
          <button type="button" class="back-link" data-action="field">‹ Back to Field</button>
          <div class="card">
            <h1 class="concept-name">${esc(cap(center.label))}</h1>
            ${badge(center.type)}
            ${center.description
              ? `<p class="definition"><span class="label">Definition</span><br/>${esc(center.description)}</p>`
              : `<p class="definition empty">No definition in the data yet.</p>`}
            <p class="stats" id="concept-stats"></p>
          </div>
          <div class="card">
            <div class="card-head">
              <p class="label">Papers per year</p>
              <span class="range-text" id="range-text"></span>
            </div>
            ${yearChart(center.papers, link && link.papers, neighbor && colorOf(neighbor.type))}
            <div class="range-slider">
              <div class="track"><div class="fill" id="range-fill"></div></div>
              <input type="range" id="range-lo" min="${Y0}" max="${Y1}" step="1" value="${state.range[0]}" aria-label="First year" />
              <input type="range" id="range-hi" min="${Y0}" max="${Y1}" step="1" value="${state.range[1]}" aria-label="Last year" />
            </div>
            <div class="year-axis">
              <span>${Y0}</span>
              <button type="button" class="link-btn" id="range-reset">Reset years</button>
              <span>${Y1}</span>
            </div>
            ${neighbor ? `<div class="chart-key"><span><i style="background:var(--bar)"></i>All papers</span><span><i style="background:${colorOf(neighbor.type)}"></i>Shared with ${esc(cap(neighbor.label))}</span></div>` : ""}
            <hr class="divider" />
            <p class="label">Show connections to</p>
            <div class="filters">${filterTreeHtml()}</div>
          </div>
          ${pinButton([center.id], "this concept")}
        </div>`;
        refreshLeftLive();
      }

      // Updates the parts of the left panel that follow the year range, without rebuilding it (so slider drags keep working).
      function refreshLeftLive() {
        const center = byId.get(state.center);
        const [lo, hi] = state.range;
        const active = rangeActive();
        $("concept-stats").innerHTML = `Appears in ${plural(center.paperCount, "paper")}${center.firstYear ? ` · first seen ${center.firstYear}` : ""}`
          + (scopeActive() ? `<br/><strong>${papersOf(center).length}</strong> ${pinnedPapers ? "match your filters" : `in ${rangeText()}`}` : "");
        $("range-text").textContent = active ? rangeText() : "All years";
        $("range-text").classList.toggle("active", active);
        $("range-reset").style.visibility = active ? "visible" : "hidden";
        const span = Y1 - Y0 || 1;
        $("range-fill").style.left = `${((lo - Y0) / span) * 100}%`;
        $("range-fill").style.right = `${((Y1 - hi) / span) * 100}%`;
        const loInput = $("range-lo"), hiInput = $("range-hi");
        if (Number(loInput.value) !== lo) loInput.value = lo;
        if (Number(hiInput.value) !== hi) hiInput.value = hi;
        // When both handles meet at the far right, keep the first-year handle on top so it can still be dragged.
        loInput.style.zIndex = lo >= Y1 - 1 ? 3 : 1;
        hiInput.style.zIndex = 2;
        document.querySelectorAll("#left .year-chart g[data-year]").forEach((g) => {
          const y = Number(g.dataset.year);
          g.classList.toggle("out", y < lo || y > hi);
        });
        // A group counts the connections of every type inside it, and is partly checked when only some of them are on.
        const counts = d3.rollup(neighborData().filter((d) => conceptOn(d.node) && !state.pins.includes(d.node.id)), (v) => v.length, (d) => d.node.type);
        shownTypeTree.forEach((t) => {
          const row = document.querySelector(`#left .fnode[data-tid="${CSS.escape(t.id)}"] > .frow`);
          if (!row) return;
          const c = d3.sum(t.nodeTypes, (id) => counts.get(id) || 0);
          const on = t.nodeTypes.filter((id) => state.showTypes.has(id)).length;
          const box = row.querySelector("input");
          row.querySelector("[data-count]").textContent = `(${c})`;
          row.classList.toggle("zero", c === 0);
          box.disabled = c === 0;
          box.checked = on === t.nodeTypes.length;
          box.indeterminate = on > 0 && on < t.nodeTypes.length;
        });
      }

      function setRange(lo, hi) {
        state.range = [lo, hi];
        applyFilters({ live: true });
      }

      $("left").addEventListener("click", (event) => {
        const caret = event.target.closest('[data-action="toggle-group"]');
        if (caret) {
          const id = caret.dataset.tid;
          const open = state.collapsedTypes.has(id);
          if (open) state.collapsedTypes.delete(id);
          else state.collapsedTypes.add(id);
          caret.classList.toggle("open", open);
          caret.setAttribute("aria-expanded", String(open));
          caret.closest(".fnode").querySelector(":scope > .fchildren").classList.toggle("collapsed", !open);
        } else if (event.target.closest('[data-action="field"]')) goField();
        else if (event.target.id === "range-reset") setRange(Y0, Y1);
        else {
          const pin = event.target.closest("[data-pin]");
          if (pin) togglePins(pin.dataset.pin.split(","));
        }
      });
      $("left").addEventListener("change", (event) => {
        const tid = event.target.dataset.tid;
        if (!tid) return;
        // Checking a group switches every type inside it.
        typeOf(tid).nodeTypes.forEach((id) => {
          if (event.target.checked) state.showTypes.add(id);
          else state.showTypes.delete(id);
        });
        refreshLeftLive();
        updateOrbit();
        renderRight({ keepScroll: true });
      });
      $("left").addEventListener("input", (event) => {
        const id = event.target.id;
        if (id !== "range-lo" && id !== "range-hi") return;
        let lo = Number($("range-lo").value), hi = Number($("range-hi").value);
        if (lo > hi) {
          if (id === "range-lo") lo = hi;
          else hi = lo;
          event.target.value = id === "range-lo" ? lo : hi;
        }
        setRange(lo, hi);
      });

      // ---------- Concept view: right panel ----------
      let appendFrom = null;

      function papersListForTab() {
        const center = byId.get(state.center);
        const link = selectedLink();
        const list = papersIn(link ? link.papers : center.papers).slice();
        const conceptCount = (p) => (conceptsByPaper.get(p.paper_id) || []).length;
        if (state.papersSort === "oldest") list.sort((a, b) => a.year - b.year || a.title.localeCompare(b.title));
        else if (state.papersSort === "concepts") list.sort((a, b) => conceptCount(b) - conceptCount(a) || b.year - a.year);
        else list.sort((a, b) => b.year - a.year || a.title.localeCompare(b.title));
        return list;
      }

      function paperRow(p, showConcepts, isNew) {
        const k = (conceptsByPaper.get(p.paper_id) || []).length;
        return `<button type="button" class="paper-row ${isNew ? "pop-in" : ""}" data-action="paper" data-id="${p.paper_id}">
          <span class="p-title">${esc(paperTitle(p))}</span>
          <span class="p-meta">${esc(p.authors || "Unknown authors")} · ${esc(p.year)}${showConcepts ? ` <span class="k">· ${plural(k, "concept")}</span>` : ""}</span>
        </button>`;
      }
      const rangeChip = () => (rangeActive()
        ? `<div class="chip-filter"><span>Years ${rangeText()}</span><button type="button" data-action="clear-range" aria-label="Show all years">×</button></div>`
        : "");
      function rowsWithStagger(items, render) {
        return items.map((item, i) => {
          const isNew = appendFrom !== null && i >= appendFrom;
          const html = render(item, isNew);
          return isNew ? html.replace('class="paper-row pop-in"', `class="paper-row pop-in" style="animation-delay:${(i - appendFrom) * 25}ms"`) : html;
        }).join("");
      }

      function renderPapersList() {
        const neighbor = state.connection ? byId.get(state.connection) : null;
        const list = papersListForTab();
        const shown = list.slice(0, state.papersShown);
        const remaining = list.length - shown.length;
        const chips = `${neighbor ? `<div class="chip-filter" style="border-color:${colorOf(neighbor.type)}">
            <span>Shared with ${esc(cap(neighbor.label))}</span>
            <button type="button" data-action="clear-conn" aria-label="Show all papers">×</button>
          </div>` : ""}${rangeChip()}`;
        return `
          <div class="panel-head">
            <h2>Papers <span class="count">(${list.length})</span></h2>
            <label class="sort">Sort
              <select data-change="papers-sort">
                <option value="newest" ${state.papersSort === "newest" ? "selected" : ""}>Newest</option>
                <option value="oldest" ${state.papersSort === "oldest" ? "selected" : ""}>Oldest</option>
                <option value="concepts" ${state.papersSort === "concepts" ? "selected" : ""}>Most concepts</option>
              </select>
            </label>
          </div>
          ${chips ? `<div class="chip-row">${chips}</div>` : ""}
          <div class="rows">${rowsWithStagger(shown, (p, isNew) => paperRow(p, state.papersSort === "concepts", isNew)) || `<div class="empty-note">No papers${rangeActive() ? ` in ${rangeText()}` : ""}.</div>`}</div>
          ${remaining > 0 ? `<button type="button" class="load-more" data-action="more-papers">Load more · ${remaining} remaining</button>` : ""}
          ${examplePapersHtml(byId.get(state.center))}`;
      }

      function renderConnectionsList() {
        const list = visibleNeighbors();
        if (state.connSort === "least") list.sort((a, b) => a.shared - b.shared || a.node.label.localeCompare(b.node.label));
        else list.sort((a, b) => b.shared - a.shared || a.node.label.localeCompare(b.node.label));
        const chip = rangeChip();
        return `
          <div class="panel-head">
            <h2>Connections <span class="count">(${list.length})</span></h2>
            <label class="sort">Sort
              <select data-change="conn-sort">
                <option value="most" ${state.connSort === "most" ? "selected" : ""}>Most connected</option>
                <option value="least" ${state.connSort === "least" ? "selected" : ""}>Least connected</option>
              </select>
            </label>
          </div>
          ${chip ? `<div class="chip-row">${chip}</div>` : ""}
          <div class="rows">
            ${list.map((d) => `
              <div class="conn-row" role="button" tabindex="0" data-action="conn" data-id="${esc(d.node.id)}" data-hover="${esc(d.node.id)}">
                ${dot(d.node.type)}
                <span class="body">
                  <span class="name">${esc(cap(d.node.label))}</span>
                  <span class="sub">${esc(typeWord(d.node.type))} · ${pct(d.j)} overlap</span>
                </span>
                <span class="conn-side">
                  <span class="count">${plural(d.shared, "paper")}</span>
                  ${compareButton(state.center, d.node.id)}
                </span>
              </div>`).join("") || `<div class="empty-note">No connections${scopeActive() ? " that match your filters" : ""} of the selected types.</div>`}
          </div>
          ${gapsListHtml()}`;
      }

      // When concepts are pinned: concepts often studied with this one overall, but never in the narrowed papers.
      function gapsListHtml() {
        const center = byId.get(state.center);
        if (!pinnedPapers || !papersOf(center).length) return "";
        const shownIds = new Set(visibleNeighbors().map((d) => d.node.id));
        const missing = (adjacency.get(center.id) || [])
          .filter(({ id }) => !shownIds.has(id) && !state.pins.includes(id) && conceptOn(byId.get(id)))
          .map(({ id, link }) => ({ node: byId.get(id), overall: papersInRange(link.papers).length }))
          .filter((d) => d.overall >= 2)
          .sort((a, b) => b.overall - a.overall)
          .slice(0, 8);
        if (!missing.length) return "";
        return `<div class="gaps-list">
          <p class="eyebrow" style="margin-top:0">Possible gaps</p>
          <p class="fp-hint" style="margin:0 0 8px">Studied with ${esc(cap(center.label))} elsewhere, but in none of the ${plural(pinnedPapers.size, "paper")} that include ${listJoin(state.pins.map((id) => esc(cap(byId.get(id).label))))}.</p>
          <div class="rows">${missing.map((d) => `
            <div class="conn-row" role="button" tabindex="0" data-action="open-concept" data-id="${esc(d.node.id)}">
              ${dot(d.node.type)}
              <span class="body"><span class="name">${esc(cap(d.node.label))}</span><span class="sub">${esc(typeWord(d.node.type))} · ${plural(d.overall, "paper")} with ${esc(cap(center.label))} overall</span></span>
              <span class="conn-side"><span class="count zero">0 here</span></span>
            </div>`).join("")}</div>
        </div>`;
      }

      function renderConnectionDetail() {
        const center = byId.get(state.center);
        const neighbor = byId.get(state.connection);
        const link = selectedLink();
        const papers = papersIn(link.papers).slice().sort((a, b) => b.year - a.year || a.title.localeCompare(b.title));
        const n = papers.length;
        const shown = papers.slice(0, state.connPapersShown);
        const remaining = papers.length - shown.length;
        const range = rangeActive() ? ` between ${state.range[0]} and ${state.range[1]}` : "";
        return `
          <button type="button" class="back-link" data-action="back-conns">← All connections</button>
          <div class="detail-card">
            <p class="eyebrow" style="margin-top:0">Connection</p>
            <div class="pair">
              ${esc(cap(center.label))}
              <span class="arrow">↔</span>
              <span class="nb" style="text-decoration-color:${colorOf(neighbor.type)}">${esc(cap(neighbor.label))}</span>
            </div>
            ${badge(neighbor.type)}
            ${n
              ? `<p class="sentence">${esc(cap(connectionSentence(center, neighbor, n)))}${range}.</p>
                 ${strengthHtml(center, neighbor, n)}
                 <p class="eyebrow">What these papers have in common</p>
                 <p class="common">${commonGround(center, neighbor, papers)}</p>
                 <p class="common-note">Based on concepts extracted from the papers, not the full text.</p>`
              : `<p class="sentence">No shared papers ${pinnedPapers ? "that match your filters" : `in ${rangeText()}`}.</p>`}
            <div class="btn-row">
              <button type="button" class="btn" data-action="open-concept" data-id="${esc(neighbor.id)}">Open ${esc(cap(neighbor.label))} →</button>
              ${compareButton(center.id, neighbor.id, "big")}
            </div>
            ${pinButton([center.id, neighbor.id], "both")}
          </div>
          ${evidenceCard(center, neighbor)}
          ${n ? `
          <p class="eyebrow" style="margin-top:20px">When they met <span style="text-transform:none;letter-spacing:0">· each dot is a shared paper</span></p>
          <div class="met">${metTimeline(papers, colorOf(neighbor.type))}</div>
          <p class="met-note">${esc(trendText(papers))}</p>` : ""}
          <p class="eyebrow" style="margin-top:20px">Papers (${n})</p>
          <div class="rows">${shown.map((p) => paperRow(p, false, false)).join("")}</div>
          ${remaining > 0 ? `<button type="button" class="load-more" data-action="more-conn-papers">Load more · ${remaining} remaining</button>` : ""}`;
      }

      // Strength in plain words: share of each concept's papers, and how it compares with chance.
      function strengthHtml(center, neighbor, n) {
        const a = papersOf(center).length, b = papersOf(neighbor).length;
        const { lift, expected } = liftOf(n, a, b);
        const exp = expected < 1 ? "less than one" : expected < 10 ? expected.toFixed(1) : Math.round(expected);
        return `<div class="stat-tiles">
            <div class="stat-tile"><b>${n}</b><span>shared ${n === 1 ? "paper" : "papers"}</span></div>
            <div class="stat-tile"><b>${liftText(lift)}</b><span>vs. chance</span></div>
            <div class="stat-tile"><b>${Math.round((n / a) * 100)}%</b><span>of ${esc(cap(center.label))}'s papers</span></div>
            <div class="stat-tile"><b>${Math.round((n / b) * 100)}%</b><span>of ${esc(cap(neighbor.label))}'s papers</span></div>
          </div>
          <p class="strength">These two are ${liftPhrase(lift)}. If they were unrelated you'd expect about ${exp} shared ${expected >= 0.95 && expected < 1.05 ? "paper" : "papers"}${scopeActive() ? " among the papers in view" : ""}; there ${n === 1 ? "is" : "are"} ${n}.${n < 3 ? ` <span class="caution">With so few papers, read this lightly.</span>` : ""}</p>`;
      }

      // The shared papers as dots on a year axis, stacked when a year has several.
      function metTimeline(papers, color) {
        const W = 340, pad = 8, r = 3.4, step = 7.6;
        const x = d3.scaleLinear().domain([Y0, Y1]).range([pad, W - pad]);
        const byYear = d3.groups(papers.slice().sort((a, b) => a.year - b.year), (p) => p.year);
        const tallest = d3.max(byYear, ([, ps]) => ps.length) || 1;
        const H = Math.max(34, tallest * step + 22);
        const base = H - 18;
        const dots = byYear.flatMap(([year, ps]) => ps.map((p, i) => `<circle class="dotp" data-action="paper" data-id="${p.paper_id}" cx="${x(year).toFixed(1)}" cy="${(base - r - i * step).toFixed(1)}" r="${r}" fill="${color}"><title>${esc(paperTitle(p))} (${p.year})</title></circle>`)).join("");
        const out = rangeActive()
          ? `<rect x="0" y="0" width="${x(state.range[0]) - 2}" height="${base}" fill="rgba(255,255,255,0.03)"/><rect x="${x(state.range[1]) + 2}" y="0" width="${W - x(state.range[1]) - 2}" height="${base}" fill="rgba(255,255,255,0.03)"/>`
          : "";
        const ticks = [1990, 2000, 2010, 2020].filter((y) => y >= Y0 && y <= Y1);
        return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Shared papers by year">
          ${out}
          <g class="axis"><line x1="${pad}" x2="${W - pad}" y1="${base + 2}" y2="${base + 2}"/>${ticks.map((t) => `<text x="${x(t)}" y="${H - 3}" text-anchor="middle">${t}</text>`).join("")}</g>
          ${dots}
        </svg>`;
      }

      function trendText(papers) {
        const n = papers.length;
        const years = papers.map((p) => p.year);
        const [minY, maxY] = d3.extent(years);
        if (minY === maxY) return n === 1 ? `Published in ${minY}.` : `All ${n} were published in ${minY}.`;
        const mid = Math.floor((minY + maxY) / 2);
        const early = years.filter((y) => y <= mid).length, late = n - early;
        const shape = late >= early * 1.5 ? "Growing over time" : early >= late * 1.5 ? "Mostly older work" : "Spread fairly evenly";
        return `${shape}: ${early} from ${minY}–${mid}, ${late} from ${mid + 1}–${maxY}.`;
      }

      // A 2–3 sentence summary of the shared papers, built only from extracted concepts and years:
      // which other concepts recur, how the count changed over time, and the earliest and latest paper.
      function commonGround(center, neighbor, papers) {
        const n = papers.length;
        const conceptRef = (id, count) => {
          const c = byId.get(id);
          return `<span role="button" tabindex="0" class="ref" data-action="open-concept" data-id="${esc(id)}" style="--c:${colorOf(c.type)}">${esc(c.label)}</span>${count ? ` (${count})` : ""}`;
        };
        // Spans rather than buttons, so long titles wrap with the sentence instead of breaking out of it.
        const paperRef = (p) => `“<span role="button" tabindex="0" class="ref plain" data-action="paper" data-id="${p.paper_id}">${esc(paperTitle(p))}</span>” (${esc(p.authors || "Unknown authors")}, ${p.year})`;

        const counts = new Map();
        papers.forEach((p) => (conceptsByPaper.get(p.paper_id) || []).forEach((id) => {
          if (id !== center.id && id !== neighbor.id) counts.set(id, (counts.get(id) || 0) + 1);
        }));

        if (n === 1) {
          const others = [...counts.keys()];
          return `The one shared paper, ${paperRef(papers[0])}, ${others.length ? `also covers ${listJoin(others.map((id) => conceptRef(id)))}` : "covers no other concepts"}.`;
        }

        const minCount = n >= 5 ? 2 : 1;
        // Concepts are grouped under the type that owns the phrasing, so sub-types share their parent's phrase.
        const phraseOwner = (type) => ancestry(type).find((t) => t.summary)?.id || type;
        const owners = [...new Set(nodeTypes.map(phraseOwner))];
        const phrases = owners.map((owner) => {
          const top = [...counts.entries()]
            .filter(([id, c]) => phraseOwner(byId.get(id).type) === owner && c >= minCount)
            .sort((a, b) => b[1] - a[1] || byId.get(a[0]).label.localeCompare(byId.get(b[0]).label))
            .slice(0, 2);
          if (!top.length) return null;
          const template = typeOf(owner).summary || "also involve {list}";
          return fillTemplate(template, { list: listJoin(top.map(([id, c]) => conceptRef(id, c))), s: top.length > 1 ? "s" : "" });
        }).filter(Boolean);
        const recurring = phrases.length
          ? `Alongside both concepts, these ${n} papers most often ${listJoin(phrases)}.`
          : `No other concept comes up in more than one of these papers.`;

        const years = papers.map((p) => p.year);
        const [minY, maxY] = d3.extent(years);
        let trend;
        if (minY === maxY) {
          trend = `All ${n} were published in ${minY}.`;
        } else {
          const mid = Math.floor((minY + maxY) / 2);
          const early = years.filter((y) => y <= mid).length, late = n - early;
          const [peakYear, peakCount] = d3.greatest(d3.rollups(years, (v) => v.length, (y) => y), ([y, c]) => c * 10000 + y);
          const shape = late >= early * 1.5 ? "The count has grown over time" : early >= late * 1.5 ? "Most of them are older" : "They are spread fairly evenly over time";
          trend = `${shape}: ${early} from ${minY}–${mid} and ${late} from ${mid + 1}–${maxY}${peakCount > 1 ? `, peaking in ${peakYear} with ${peakCount}` : ""}.`;
        }

        const byYear = papers.slice().sort((a, b) => a.year - b.year || a.title.localeCompare(b.title));
        const ends = `The earliest is ${paperRef(byYear[0])} and the most recent is ${paperRef(byYear[byYear.length - 1])}.`;
        return `${recurring} ${trend} ${ends}`;
      }

      function relatedPapers(paperId) {
        const mine = conceptsByPaper.get(paperId) || [];
        const counts = new Map();
        mine.forEach((cid) => {
          papersOf(byId.get(cid)).forEach((p) => {
            if (p.paper_id !== paperId) counts.set(p.paper_id, (counts.get(p.paper_id) || 0) + 1);
          });
        });
        return [...counts.entries()]
          .sort((a, b) => b[1] - a[1] || paperById.get(b[0]).year - paperById.get(a[0]).year)
          .slice(0, 5)
          .map(([id]) => {
            const theirs = new Set(conceptsByPaper.get(id));
            return { paper: paperById.get(id), shared: mine.filter((cid) => theirs.has(cid)).map((cid) => byId.get(cid)) };
          });
      }

      function relatedSentence(shared) {
        const names = shared.map((n) => n.label);
        const listed = names.length > 4 ? [...names.slice(0, 3), `${names.length - 3} more`] : names;
        return `Shares ${plural(shared.length, "concept")} with this paper: ${listJoin(listed)}.`;
      }

      function renderPaperDetail() {
        const paper = currentPaper();
        if (paper.isExample) return renderExamplePaper(paper);
        const concepts = (conceptsByPaper.get(paper.paper_id) || []).map((id) => byId.get(id));
        const backLabel = state.paperTrail.length ? "← Previous paper" : state.connection ? "← Shared papers" : "← All papers";
        const related = relatedPapers(paper.paper_id);
        return `
          <button type="button" class="back-link" data-action="back-paper">${backLabel}</button>
          <div class="detail-card">
            <p class="eyebrow" style="margin-top:0">Paper</p>
            <h2 class="paper-title">${esc(paperTitle(paper))}</h2>
            <span class="byline">${esc(paper.authors || "Unknown authors")} · ${esc(paper.year)}</span>
          </div>

          <p class="eyebrow" style="margin-top:20px">Concepts in this paper (${concepts.length})</p>
          <div class="chips">
            ${concepts.map((n) => n.id === state.center
              ? `<span class="chip current" title="The concept you're viewing">${dot(n.type)}${esc(cap(n.label))}</span>`
              : `<button type="button" class="chip" data-action="open-concept" data-id="${esc(n.id)}" title="Open ${esc(cap(n.label))}">${dot(n.type)}${esc(cap(n.label))}</button>`).join("")}
          </div>

          <div class="detail-card" style="margin-top:18px">
            <p class="eyebrow" style="margin-top:0">Summary</p>
            <p class="placeholder">Summary coming soon.</p>
            <button type="button" class="btn" disabled title="No link to the original paper in the data yet">Original paper ↗</button>
          </div>
          ${studyCardPlaceholder(paper)}

          <p class="eyebrow" style="margin-top:22px">Related papers${rangeActive() ? ` · ${rangeText()}` : ""}</p>
          <div class="rows">
            ${related.map(({ paper: p, shared }) => `
              <button type="button" class="related" data-action="paper-push" data-id="${p.paper_id}">
                <span class="p-title">${esc(paperTitle(p))}</span>
                <span class="p-meta">${esc(p.authors || "Unknown authors")} · ${esc(p.year)}</span>
                <span class="why">${esc(relatedSentence(shared))}</span>
              </button>`).join("") || `<div class="empty-note">No other papers share concepts with this one.</div>`}
          </div>`;
      }

      // ---------- Study card (Atlas 2) ----------
      const fmtValue = (v, def) => (def?.kind === "yesno" ? (v.value ? "yes" : "no") : def?.kind === "number" ? String(v.value) : String(v.value));
      const DIR = {
        increased: { sym: "↑", cls: "increased", word: "increased" },
        reduced: { sym: "↓", cls: "reduced", word: "reduced" },
        "no effect": { sym: "○", cls: "noeffect", word: "no effect" },
        mixed: { sym: "±", cls: "mixed", word: "mixed" }
      };
      const dirChip = (d) => `<span class="dir dir-${DIR[d]?.cls || "noeffect"}" title="${esc(DIR[d]?.word || d)}">${DIR[d]?.sym || "?"}</span>`;
      const strengthBars = (st) => (st ? `<span class="strength-bars" title="${esc(st)} effect">${{ weak: "▮▯▯", moderate: "▮▮▯", strong: "▮▮▮" }[st] || ""}</span> ${esc(st)}` : "");
      // "Using an LLM assistant ↑ cognitive fixation" style one-liner with its paper and certainty.
      function findingHtml(f, { showPaper = true } = {}) {
        return `<button type="button" class="finding" data-action="paper" data-id="${esc(f.paper.id)}" title="Open the example paper">
          ${dirChip(f.direction)}
          <span>
            <span class="st">${esc(f.statement)}</span>
            <span class="meta">
              ${f.strength ? `<span>${strengthBars(f.strength)}</span>` : ""}
              <span>${esc(f.hedging === "hedged" ? "hedged claim" : "firm claim")}</span>
              <span>${certMark(f.certainty)} ${esc(CERT[f.certainty]?.label.replace(", not checked yet", "") || "")}</span>
              ${showPaper ? `<span>${esc(f.paper.title.replace(/^Example study ([A-Z]):.*/, "Example study $1"))} · ${f.paper.year}</span>` : ""}
            </span>
          </span>
        </button>`;
      }

      // A real paper has no Atlas 2 values yet: say so, and point to an example of what the card will hold.
      function studyCardPlaceholder(paper) {
        if (!EX) return "";
        const mine = new Set(conceptsByPaper.get(paper.paper_id) || []);
        const example = EX.papers.slice().sort((a, b) => b.concepts.filter((id) => mine.has(id)).length - a.concepts.filter((id) => mine.has(id)).length)[0];
        return `<div class="ex-zone">
          <div class="ex-head"><span class="t">Study details</span>${exampleBadge("Atlas 2 preview")}</div>
          <p class="placeholder" style="font-size:13px">Not coded yet. In Atlas 2 this card will list the paper's values under Paper, Study, Measurement and Claim, each marked by how certain it is.</p>
          ${example ? `<button type="button" class="btn" data-action="paper" data-id="${esc(example.id)}">See an example study card →</button>` : ""}
        </div>`;
      }

      function renderExamplePaper(paper) {
        const concepts = paper.concepts.map((id) => byId.get(id));
        const backLabel = state.paperTrail.length ? "← Previous paper" : state.connection ? "← Shared papers" : "← All papers";
        const sections = EX.groups.map((g) => {
          if (g.id === "claim") {
            return `<div class="study-sec"><h4>${esc(g.label)} <span>${esc(g.asks)}</span></h4>
              ${(paper.findings || []).length ? paper.findings.map((f, i) => findingHtml(EX.findings.find((x) => x.id === `${paper.id}-${i}`) || { ...f, paper }, { showPaper: false })).join("") : `<p class="placeholder">No findings coded.</p>`}
            </div>`;
          }
          const rows = EX.variables.filter((v) => v.group === g.id && paper.values?.[v.id]).map((v) => {
            const val = paper.values[v.id];
            const dim = state.exCert.has(val.certainty) ? "" : "dim";
            return `<span class="k ${dim}">${v.parentType ? `<em>${esc(typeOf(v.parentType)?.label.toLowerCase() || v.family)} ›</em> ` : v.family && v.family !== v.label ? `<em>${esc(v.family)} ›</em> ` : ""}${esc(v.label)}</span><span class="v ${dim}" ${dim ? `title="Hidden by your certainty filter"` : ""}>${certMark(val.certainty)}${esc(fmtValue(val, v))}</span>`;
          }).join("");
          return rows ? `<div class="study-sec"><h4>${esc(g.label)} <span>${esc(g.asks)}</span></h4><div class="kv">${rows}</div></div>` : "";
        }).join("");
        return `
          <button type="button" class="back-link" data-action="back-paper">${backLabel}</button>
          <div class="ex-zone">
            <div class="ex-head"><span class="t">Example paper</span>${exampleBadge()}</div>
            <h2 class="paper-title">${esc(paper.title)}</h2>
            <span class="byline">${esc(paper.authors)} · ${esc(paper.year)}</span>
            <p class="ex-note">A made-up paper to show what an Atlas 2 study card could hold. Not a real study.</p>
          </div>

          <p class="eyebrow" style="margin-top:20px">Concepts in this paper (${concepts.length})</p>
          <div class="chips">
            ${concepts.map((n) => n.id === state.center
              ? `<span class="chip current" title="The concept you're viewing">${dot(n.type)}${esc(cap(n.label))}</span>`
              : `<button type="button" class="chip" data-action="open-concept" data-id="${esc(n.id)}">${dot(n.type)}${esc(cap(n.label))}</button>`).join("")}
          </div>

          <div class="ex-zone">
            <div class="ex-head"><span class="t">Study card</span>${exampleBadge()}</div>
            ${certKey()}
            ${sections}
          </div>`;
      }

      // ---------- Atlas 2 filters (example data) ----------
      // A paper passes when, for every variable with a choice, it has a value of a certainty that's switched on and that value is chosen.
      const exFilterCount = () => (EX ? [...state.exValues.values()].filter((set) => set.size).length + state.exMin.size + (state.exCert.size < 3 ? 1 : 0) : 0);
      const valueKey = (val, def) => fmtValue(val, def);
      function exValueOk(val, def) {
        if (!val || !state.exCert.has(val.certainty)) return false;
        if (def.kind === "number") return !state.exMin.has(def.id) || Number(val.value) >= state.exMin.get(def.id);
        const chosen = state.exValues.get(def.id);
        return !chosen || !chosen.size || chosen.has(valueKey(val, def));
      }
      function exPaperPasses(p) {
        for (const def of EX.variables) {
          if (def.group === "claim") continue;
          const active = def.kind === "number" ? state.exMin.has(def.id) : state.exValues.get(def.id)?.size;
          if (active && !exValueOk(p.values?.[def.id], def)) return false;
        }
        return true;
      }
      const FINDING_FIELD = { finding_direction: "direction", finding_strength: "strength", finding_hedging: "hedging" };
      function exFindingPasses(f) {
        if (!state.exCert.has(f.certainty) || !exPaperPasses(f.paper)) return false;
        return Object.entries(FINDING_FIELD).every(([vid, field]) => {
          const chosen = state.exValues.get(vid);
          return !chosen || !chosen.size || chosen.has(String(f[field]));
        });
      }
      function exChips() {
        if (!EX) return [];
        const chips = [];
        state.exValues.forEach((set, vid) => { if (set.size) chips.push({ html: `${esc(EX.varById.get(vid).label)}: ${esc([...set].join(" or "))}`, kind: "val", v: vid }); });
        state.exMin.forEach((min, vid) => chips.push({ html: `${esc(EX.varById.get(vid).label)} ≥ ${min}`, kind: "min", v: vid }));
        if (state.exCert.size < 3) chips.push({ html: `Certainty: ${esc([...state.exCert].map((c) => CERT[c].label.replace(", not checked yet", "")).join(", ") || "none")}`, kind: "cert", v: "" });
        return chips;
      }
      const NUM_STEPS = { sample_size: [20, 50, 100], task_duration: [30, 60, 120] };

      function exFiltersHtml() {
        if (!EX) return "";
        const papersWith = (def, val) => EX.papers.filter((p) => p.values?.[def.id] && state.exCert.has(p.values[def.id].certainty) && valueKey(p.values[def.id], def) === val).length;
        const findingsWith = (field, val) => EX.findings.filter((f) => state.exCert.has(f.certainty) && String(f[field]) === val).length;
        const groups = EX.groups.map((g) => {
          const vars = EX.variables.filter((v) => v.group === g.id);
          const selected = vars.filter((v) => (v.kind === "number" ? state.exMin.has(v.id) : state.exValues.get(v.id)?.size)).length;
          const open = state.exOpen.has(g.id);
          const body = !open ? "" : vars.map((def) => {
            const label = `${def.parentType ? `<em>${esc(typeOf(def.parentType)?.label.toLowerCase() || def.family)} ›</em> ` : def.family && def.family !== def.label ? `<em>${esc(def.family)} ›</em> ` : ""}${esc(def.label)} ${certMark(def.obtained === "record" ? "recorded" : def.obtained === "judge" ? "checked" : "ai")}`;
            let chips;
            if (def.kind === "number") {
              const steps = NUM_STEPS[def.id] || [];
              const cur = state.exMin.get(def.id);
              chips = [`<button type="button" class="vchip ${cur == null ? "on" : ""}" data-ex="min" data-v="${esc(def.id)}" data-val="">any</button>`]
                .concat(steps.map((n) => `<button type="button" class="vchip ${cur === n ? "on" : ""}" data-ex="min" data-v="${esc(def.id)}" data-val="${n}">≥ ${n}</button>`)).join("");
            } else {
              const values = def.kind === "yesno" ? ["yes", "no"] : def.values || [];
              const chosen = state.exValues.get(def.id) || new Set();
              chips = values.map((val) => {
                const n = g.id === "claim" ? findingsWith(FINDING_FIELD[def.id], val) : papersWith(def, val);
                return `<button type="button" class="vchip ${chosen.has(val) ? "on" : ""}" data-ex="val" data-v="${esc(def.id)}" data-val="${esc(val)}" ${n || chosen.has(val) ? "" : "disabled"}>${esc(val)}<span>${n}</span></button>`;
              }).join("");
            }
            return `<div class="ex-var"><div class="vl">${label}</div><div class="vchips">${chips}</div></div>`;
          }).join("");
          return `<div class="ex-group">
            <button type="button" class="ex-group-head" data-ex="group" data-v="${esc(g.id)}" aria-expanded="${open}">
              <span class="caret ${open ? "open" : ""}">▶</span><b>${esc(g.label)}</b><span>${esc(g.asks)}</span>${selected ? `<span class="sel">${selected} chosen</span>` : ""}
            </button>
            ${body}
          </div>`;
        }).join("");
        const passing = EX.papers.filter(exPaperPasses).length;
        return `<section class="fp-section ex-zone">
          <div class="ex-head"><span class="t">Atlas 2 variables</span>${exampleBadge()}</div>
          <p class="fp-hint">Real papers have no Atlas 2 values yet, so these filter only the ${EX.papers.length} example papers and their findings (evidence cards, study cards, findings in the orbit). Counts are example papers${EX.findings.length ? ", or findings for Claim" : ""}. The mark by each variable shows how it's usually obtained.</p>
          <p class="label" style="margin-top:4px"><span>Count values that are</span></p>
          <div class="cert-filter">${Object.keys(CERT).map((c) => `<button type="button" class="vchip ${state.exCert.has(c) ? "on" : ""}" data-ex="cert" data-v="${c}">${certMark(c)}${esc(CERT[c].label.replace(", not checked yet", ""))}</button>`).join("")}</div>
          ${groups}
          <p class="ex-note">${passing} of ${EX.papers.length} example papers match.</p>
        </section>`;
      }

      // ---------- Evidence card (Atlas 2) ----------
      // What the example findings say about this pair: direction counts, the findings themselves,
      // evidence quality, certainty, and the conditions each direction came from ("holds when").
      const HOLDS_VARS = ["subject_expertise", "task_team", "setting", "condition_tool"];
      function evidenceCard(center, neighbor) {
        if (!EX) return "";
        const coded = EX.byPair.get(pairKey(center.id, neighbor.id)) || [];
        if (!coded.length) {
          return `<div class="ex-zone"><div class="ex-empty">${exampleBadge("Atlas 2 preview")}<span>No findings coded for this pair in the example data. In Atlas 2, what these papers found would appear here.</span></div></div>`;
        }
        const all = coded.filter(exFindingPasses);
        if (!all.length) {
          return `<div class="ex-zone"><div class="ex-empty">${exampleBadge()}<span>${plural(coded.length, "example finding")} for this pair, but none match your Atlas 2 filters.</span></div></div>`;
        }
        // One block per direction of cause (IV → DV), most findings first.
        const blocks = d3.groups(all, (f) => `${f.iv}>${f.dv}`).sort((a, b) => b[1].length - a[1].length).map(([, fs]) => {
          const iv = byId.get(fs[0].iv), dv = byId.get(fs[0].dv);
          const counts = Object.keys(DIR).map((d) => ({ d, n: fs.filter((f) => f.direction === d).length })).filter((x) => x.n);
          const max = d3.max(counts, (x) => x.n) || 1;
          const colors = { increased: "#8bc5ff", reduced: "#f4a3c0", "no effect": "#9aa2b2", mixed: "#c9b6ff" };
          const studies = (k) => `${k} ${k === 1 ? "study" : "studies"}`;
          const bars = counts.map(({ d, n }) => `<div class="ev-bar">${dirChip(d)}<span>${esc(DIR[d].word)}</span><span class="track"><i style="width:${(n / max) * 100}%;background:${colors[d]}"></i></span><span class="n">${studies(n)}</span></div>`).join("");
          const papers = [...new Set(fs.map((f) => f.paper))];
          const sizes = papers.map((p) => p.values?.sample_size?.value).filter((v) => v != null).sort((a, b) => a - b);
          const median = sizes.length ? sizes[Math.floor(sizes.length / 2)] : null;
          const causal = papers.filter((p) => p.values?.causal_design?.value === true).length;
          const validated = papers.filter((p) => p.values?.measure_validated?.value === true).length;
          const checked = fs.filter((f) => f.certainty === "checked").length;
          const disagree = counts.length > 1;
          const holds = HOLDS_VARS.map((vid) => {
            const def = EX.varById.get(vid);
            const groups = d3.groups(fs.filter((f) => f.paper.values?.[vid]), (f) => fmtValue(f.paper.values[vid], def));
            // Only conditions that actually differ between the findings say anything about when they hold.
            if (groups.length < 2) return "";
            return `<div class="hrow"><span class="hk">${esc(def.label)}:</span>${groups.map(([val, gfs]) => `<span class="hv">${esc(val)} ${gfs.map((f) => dirChip(f.direction)).join("")}</span>`).join("")}</div>`;
          }).filter(Boolean).join("");
          return `<div style="margin-top:6px">
            <p class="ev-title">Effect of <b>${esc(cap(iv.label))}</b> on <b>${esc(dv.label)}</b> · ${plural(fs.length, "finding")}</p>
            <div class="ev-bars">${bars}</div>
            ${disagree ? `<p class="ex-note" style="color:#ffcf8a">The findings disagree. See “Holds when” for the conditions behind each.</p>` : ""}
            <div class="ev-facts">
              <span class="k">Evidence</span><span class="v">median sample ${median ?? "?"} · ${causal} of ${studies(papers.length)} with a causal design · ${validated} with validated measures</span>
              <span class="k">Certainty</span><span class="v">${certMark("checked")} ${checked} checked by a person · ${certMark("ai")} ${fs.length - checked} AI-extracted</span>
              ${holds ? `<span class="k">Holds when</span><span class="v holds">${holds}</span>` : ""}
            </div>
            ${fs.map((f) => findingHtml(f)).join("")}
          </div>`;
        }).join("");
        return `<div class="ex-zone">
          <div class="ex-head"><span class="t">What was found</span>${exampleBadge()}</div>
          ${blocks}
          <p class="ex-note">${all.length < coded.length ? `Showing ${all.length} of ${coded.length} findings that match your Atlas 2 filters. ` : ""}Made-up findings from ${EX.papers.length} example papers, to show how Atlas 2 could explain a connection. Not real results; real counts above are unaffected.</p>
        </div>`;
      }

      // Example papers on this concept, at the bottom of its paper list.
      function examplePapersHtml(center) {
        if (!EX) return "";
