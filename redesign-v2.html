    .seg button {
      border: none;
      background: none;
      color: var(--muted);
      border-radius: 999px;
      padding: 6px 12px;
      font: 11.5px var(--mono);
      cursor: pointer;
      white-space: nowrap;
    }
    .seg button.on { background: var(--surface-3); color: var(--text); }
    .seg button.ex.on { background: rgba(255, 196, 107, 0.16); color: #ffe2b0; }
    .split-pick { display: flex; align-items: center; gap: 6px; font: 11.5px var(--mono); color: var(--muted); background: rgba(13, 14, 18, 0.9); border: 1px solid var(--line); border-radius: 999px; padding: 4px 4px 4px 12px; }
    .split-pick select { max-width: 170px; }
    .orbit-wrap.findings-mode { outline: 1.5px dashed var(--ex-line); outline-offset: -1.5px; }
    #orbit .split-ring path { stroke: var(--bg); stroke-width: 0.6; }
    #orbit .spoke.hide { stroke-opacity: 0 !important; }
    #orbit .f-link { fill: none; stroke-width: 2.2; stroke-linecap: round; }
    #orbit .f-badge rect { stroke-width: 1; }
    #orbit .f-badge text { font: 600 10.5px var(--mono); }
    #orbit .ring.dim, #orbit .ring-label.dim { opacity: 0.25; }
    .legend-ex { display: grid; gap: 5px; padding-top: 6px; border-top: 1px dashed var(--ex-line); }
    .legend-split { display: flex; flex-wrap: wrap; gap: 4px 10px; }
    .legend-split span { display: inline-flex; align-items: center; gap: 5px; }
    .legend-split i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }

    /* Atlas 2 variables in the filter panel */
    .fp-section.ex-zone { border-top: 1.5px dashed var(--ex-line); margin-top: 16px; padding-top: 14px; }
    .ex-group { border-top: 1px solid var(--line); padding: 6px 0; }
    .ex-group:first-of-type { border-top: none; }
    .ex-group-head {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
      background: none;
      border: none;
      padding: 4px 0;
      cursor: pointer;
      text-align: left;
    }
    .ex-group-head .caret { pointer-events: none; }
    .ex-group-head b { font-size: 13px; }
    .ex-group-head span { font: 11px var(--mono); color: var(--faint); }
    .ex-group-head .sel { margin-left: auto; color: var(--ex); }
    .ex-var { margin: 6px 0 8px 24px; }
    .ex-var .vl { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .ex-var .vl em { font-style: normal; color: var(--faint); }
    .vchips { display: flex; flex-wrap: wrap; gap: 4px; }
    .vchip {
      border: 1px solid var(--line-strong);
      background: var(--surface-2);
      border-radius: 999px;
      padding: 3px 9px;
      font: 11.5px var(--mono);
      color: #cfd5e0;
      cursor: pointer;
    }
    .vchip span { color: var(--faint); margin-left: 3px; }
    .vchip.on { border-color: var(--ex); background: rgba(255, 196, 107, 0.16); color: #ffe2b0; }
    .vchip:disabled { opacity: 0.35; cursor: not-allowed; }
    .cert-filter { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0 10px; }
    .cert-filter .vchip { display: inline-flex; align-items: center; gap: 5px; }
    .chip-filter.ex { border-style: dashed; border-color: var(--ex-line); background: var(--ex-bg); }
    .kv .dim { opacity: 0.35; }

    /* Study card */
    .study-sec { margin-top: 12px; }
    .study-sec h4 { margin: 0 0 6px; display: flex; align-items: baseline; gap: 8px; font-size: 13px; }
    .study-sec h4 span { font: 11px var(--mono); color: var(--faint); font-weight: 400; }
    .kv { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); gap: 4px 10px; font-size: 12.5px; }
    .kv .k { color: var(--muted); }
    .kv .k em { font-style: normal; color: var(--faint); }
    .kv .v { display: flex; align-items: center; gap: 6px; color: #e3e7ee; }
    .ex-papers { margin-top: 18px; }
    .ex-papers .paper-row { background: rgba(13, 14, 18, 0.35); }

    .preview-note {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-top: 22px;
      padding: 12px 16px;
      border: 1.5px dashed var(--ex-line);
      border-radius: var(--r-md);
      background: var(--ex-bg);
      color: #d5dbe6;
      font-size: 13px;
      line-height: 1.5;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="crumbs">
        <button type="button" id="crumb-home">Design Engineering Atlas</button>
        <span id="crumb-trail"></span>
      </div>
      <div class="search-wrap">
        <input id="search-input" type="text" placeholder="Search concepts…" autocomplete="off" />
        <div id="search-results" hidden></div>
      </div>
      <button id="filters-btn" class="filters-btn" type="button" aria-expanded="false" aria-controls="filter-panel">Filters <span class="n" id="filters-count" hidden></span></button>
      <div class="spacer"></div>
      <button id="help-btn" type="button" title="Glossary of concept types" aria-label="Open glossary">?</button>
    </header>
    <div class="filter-bar" id="filter-bar" hidden></div>

    <main>
      <aside class="filter-panel" id="filter-panel" hidden aria-label="Filters"></aside>
      <section id="landing-view" hidden></section>
      <section id="field-view" hidden>
        <svg id="field" aria-label="Field view of all concepts"></svg>
        <div class="field-legend" id="field-legend"></div>
        <div class="net3d" id="net3d" hidden aria-label="Every concept as a star in 3D space">
          <div class="net3d-labels" id="net3d-labels"></div>
          <div class="net-legend" id="net3d-legend"></div>
        </div>
        <div class="net-note" id="net-note" hidden></div>
        <div class="net-tools" id="net-tools">
          <button type="button" class="pill-btn" id="net-overview">Landmarks overview</button>
          <button type="button" class="pill-btn" id="net-spin" hidden>Pause rotation</button>
          <button type="button" class="pill-btn" id="net-reset" hidden>Reset view</button>
          <div class="seg" role="group" aria-label="2D or 3D">
            <button type="button" data-dim="3d">3D</button>
            <button type="button" data-dim="2d">2D</button>
          </div>
        </div>
      </section>

      <section id="concept-view" hidden>
        <aside class="left bubble-panel" id="left"></aside>
        <div class="orbit-wrap" id="orbit-wrap">
          <svg id="orbit" aria-label="Concepts orbiting the selected concept"></svg>
          <div class="orbit-top">
            <div class="compare-tray" id="compare-tray" hidden></div>
            <div class="orbit-note" id="orbit-note" hidden></div>
          </div>
          <div class="orbit-empty" id="orbit-empty" hidden></div>
          <div class="orbit-legend" id="orbit-legend"></div>
          <div class="orbit-tools" id="orbit-tools"></div>
        </div>
        <aside class="right bubble-panel">
          <div class="tabs" id="tabs">
            <span class="tab-indicator" id="tab-indicator"></span>
            <button type="button" class="tab" data-tab="papers"></button>
            <button type="button" class="tab" data-tab="connections"></button>
          </div>
          <div class="right-body" id="right-body"></div>
        </aside>
      </section>
    </main>
  </div>

  <div class="tooltip" id="tooltip" hidden></div>

  <div class="modal-backdrop" id="glossary" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="glossary-title">
      <div class="modal-head">
        <h2 id="glossary-title">Glossary</h2>
        <button type="button" class="modal-close" id="glossary-close" aria-label="Close">×</button>
      </div>
      <div id="glossary-body"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
  <script>
    (async function init() {
      // Colors for types the schema doesn't color (used only for types missing from it).
      const SPARE_COLORS = ["#f48fb1", "#80cbc4", "#fff176", "#9fa8da", "#ffab91", "#c5e1a5", "#b0bec5", "#e6ee9c", "#4fc3f7", "#81c784", "#ffb74d", "#ce93d8"];
      const PAGE = 20;
      const ORBIT_STEP = 24;
      // Orbit geometry, in viewBox units centered on the selected concept.
      const OR_R = 440;
      const RINGS = [112, 198, 284];
      const RING_BAND = 34;
      const RING_NAMES = ["Very related", "Related", "Loosely related"];
      const RING_OFFSET = [0, -0.25, 0.25];
      const WEDGE_IN = 62;
      const WEDGE_OUT = 330;
      const SECTOR_LABEL_R = WEDGE_OUT + 14;
      const TOP_GAP = (40 * Math.PI) / 180;
      const SECTOR_PAD = (5 * Math.PI) / 180;
      const WRAP_AT = 18;
      const CHAR_W = 7.2;
      const LINE_H = 14;
      const REDUCED_MOTION = matchMedia("(prefers-reduced-motion: reduce)").matches;
      const ms = (d) => (REDUCED_MOTION ? 0 : d);

      const $ = (id) => document.getElementById(id);
      const tooltip = $("tooltip");

      // ---------- Load data ----------
      let raw, schemaFile = null, exampleRaw = null;
      try {
        if (location.protocol === "file:") throw new Error("This page has to be served over http to load graph_data.json.");
        const [response, schemaResponse, exampleResponse] = await Promise.all([
          fetch("./graph_data.json"),
          fetch("./atlas_schema.json").catch(() => null),
          fetch("./atlas2_example.json").catch(() => null)
        ]);
        if (!response.ok) throw new Error(`Could not load graph_data.json (HTTP ${response.status}).`);
        raw = await response.json();
        if (schemaResponse && schemaResponse.ok) schemaFile = await schemaResponse.json();
        else if (!raw.schema) console.warn("No atlas_schema.json found; type names and colors are generated from the data.");
        if (exampleResponse && exampleResponse.ok) exampleRaw = await exampleResponse.json();
        else console.warn("No atlas2_example.json found; the Atlas 2 preview panels are hidden.");
      } catch (error) {
        $("app").innerHTML = `<div class="error">${esc(error.message)}<br/>From the project folder run <code>python3 -m http.server 8000</code> and open http://localhost:8000/redesign.html</div>`;
        console.error(error);
        return;
      }

      // ---------- Prepare data ----------
      const nodes = raw.nodes.map((n) => ({
        id: String(n.id),
        label: n.label,
        type: n.type,
        description: (n.description || "").trim(),
        papers: n.papers || [],
        paperCount: (n.papers || []).length,
        firstYear: Number(n.first_year) || null
      }));
      const byId = new Map(nodes.map((n) => [n.id, n]));

      // ---------- Type registry ----------
      // Types, their labels, colors, definitions and nesting come from the schema: a `schema` block in
      // graph_data.json if present, otherwise atlas_schema.json. Types that nodes use but the schema
      // doesn't list still work, with a generated label and color.
      const schema = raw.schema || schemaFile || {};
      const typeById = new Map();
      const addType = (t) => typeById.set(t.id, { children: [], nodeCount: 0, ...t });
      (schema.types || []).forEach((t) => addType({
        id: String(t.id),
        label: t.label || cap(String(t.id)),
        plural: t.plural || t.label || cap(String(t.id)),
        color: t.color || null,
        definition: (t.definition || "").trim(),
        summary: t.summary || null,
        parentId: t.parent != null ? String(t.parent) : null
      }));
      nodes.forEach((n) => {
        if (!typeById.has(n.type)) {
          console.warn(`Type "${n.type}" is not in the schema; using a generated label and color.`);
          addType({ id: n.type, label: cap(n.type), plural: cap(n.type), color: null, definition: "", summary: null, parentId: null });
        }
        typeById.get(n.type).nodeCount += 1;
      });
      const typeList = [...typeById.values()];
      typeList.forEach((t) => {
        const parent = t.parentId && typeById.get(t.parentId);
        if (parent && parent !== t) parent.children.push(t);
        else t.parentId = null;
      });
      // Walk the tree from the top-level entries; anything unreachable (a parent loop) becomes top-level.
      const typeRoots = typeList.filter((t) => !t.parentId);
      const reached = new Set();
      const reach = (t, depth) => {
        reached.add(t.id);
        t.depth = depth;
        t.children.forEach((c) => { if (!reached.has(c.id)) reach(c, depth + 1); });
      };
      typeRoots.forEach((t) => reach(t, 0));
      typeList.filter((t) => !reached.has(t.id)).forEach((t) => {
        if (reached.has(t.id)) return;
        console.warn(`Type "${t.id}" is part of a parent loop in the schema; showing it at the top level.`);
        const parent = typeById.get(t.parentId);
        parent.children = parent.children.filter((c) => c !== t);
        t.parentId = null;
        typeRoots.push(t);
        reach(t, 0);
      });
      // Depth-first order is the display order everywhere; each entry also knows the node types beneath it.
      const typesInOrder = [];
      const visit = (t) => { typesInOrder.push(t); t.children.forEach(visit); };
      typeRoots.forEach(visit);
      const typeRankById = new Map(typesInOrder.map((t, i) => [t.id, i]));
      const collect = (t) => {
        t.nodeTypes = [...(t.nodeCount ? [t.id] : []), ...t.children.flatMap(collect)];
        t.total = t.nodeCount + d3.sum(t.children, (c) => c.total);
        return t.nodeTypes;
      };
      typeRoots.forEach(collect);
      const usedColors = new Set(typeList.map((t) => t.color).filter(Boolean));
      const spareColors = SPARE_COLORS.filter((c) => !usedColors.has(c));
      typesInOrder.forEach((t) => {
        if (t.color) return;
        const parent = t.parentId && typeById.get(t.parentId);
        t.color = parent ? parent.color : spareColors.shift() || "#9aa2b2";
      });

      const typeOf = (id) => typeById.get(id);
      const colorOf = (id) => typeById.get(id)?.color || "#9aa2b2";
      const typeRank = (id) => typeRankById.get(id) ?? Infinity;
      // The types concepts actually have, in display order (what the old fixed list of four used to be).
      const nodeTypes = typesInOrder.filter((t) => t.nodeCount > 0).map((t) => t.id);
      const shownTypeTree = typesInOrder.filter((t) => t.total > 0);
      const ancestry = (id) => {
        const chain = [];
        for (let t = typeById.get(id); t && chain.length < 32; t = t.parentId && typeById.get(t.parentId)) chain.push(t);
        return chain;
      };
      const inherited = (id, key) => ancestry(id).map((t) => t[key]).find(Boolean) || null;
      const definitionOf = (id) => inherited(id, "definition") || "";

      const paperById = new Map();
      const conceptsByPaper = new Map();
      nodes.forEach((n) => {
        n.papers.forEach((p) => {
          paperById.set(p.paper_id, p);
          if (!conceptsByPaper.has(p.paper_id)) conceptsByPaper.set(p.paper_id, []);
          conceptsByPaper.get(p.paper_id).push(n.id);
        });
      });
      conceptsByPaper.forEach((ids) => ids.sort((a, b) => typeRank(byId.get(a).type) - typeRank(byId.get(b).type) || byId.get(a).label.localeCompare(byId.get(b).label)));

      // Some node pairs appear more than once in the edge list; their paper lists are identical, so keep one.
      // An edge's papers are exactly the papers its two concepts share, so shared counts come from that list.
      const linkByPair = new Map();
      const pairKey = (a, b) => (a < b ? `${a}|${b}` : `${b}|${a}`);
      raw.edges.forEach((e) => {
        const a = String(e.source), b = String(e.target);
        if (!byId.has(a) || !byId.has(b)) return;
        const key = pairKey(a, b);
        if (linkByPair.has(key)) return;
        linkByPair.set(key, { a, b, papers: e.papers || [], shared: (e.papers || []).length });
      });
      const links = [...linkByPair.values()];
      const adjacency = new Map();
      links.forEach((l) => {
        if (!adjacency.has(l.a)) adjacency.set(l.a, []);
        if (!adjacency.has(l.b)) adjacency.set(l.b, []);
        adjacency.get(l.a).push({ id: l.b, link: l });
        adjacency.get(l.b).push({ id: l.a, link: l });
      });

      const [Y0, Y1] = (raw.meta && raw.meta.year_range) || d3.extent([...paperById.values()], (p) => p.year);
      const nodeR = d3.scaleSqrt().domain([0, d3.max(nodes, (n) => n.paperCount)]).range([3, 20]);

      // ---------- Example data (Atlas 2 preview) ----------
      // atlas2_example.json holds ten made-up papers in a guessed Atlas 2 format. They are kept apart from
      // the real papers: they never change real counts, and everything built on them is labelled "Example data".
      const EX = (() => {
        if (!exampleRaw) return null;
        const papers = (exampleRaw.papers || []).map((p) => ({ ...p, paper_id: p.id, isExample: true, concepts: (p.concepts || []).map(String).filter((id) => byId.has(id)) }));
        const variables = exampleRaw.variables || [];
        const findings = papers.flatMap((p) => (p.findings || [])
          .filter((f) => byId.has(String(f.iv)) && byId.has(String(f.dv)))
          .map((f, i) => ({ ...f, iv: String(f.iv), dv: String(f.dv), id: `${p.id}-${i}`, paper: p })));
        const byPair = new Map();
        const byConcept = new Map();
        findings.forEach((f) => {
          const key = pairKey(f.iv, f.dv);
          if (!byPair.has(key)) byPair.set(key, []);
          byPair.get(key).push(f);
          [f.iv, f.dv].forEach((id) => {
            if (!byConcept.has(id)) byConcept.set(id, []);
            byConcept.get(id).push(f);
          });
        });
        return {
          papers,
          paperById: new Map(papers.map((p) => [p.id, p])),
          variables,
          varById: new Map(variables.map((v) => [v.id, v])),
          groups: exampleRaw.groups || [],
          certainty: exampleRaw.certainty || [],
          findings,
          byPair,
          byConcept
        };
      })();
      const exampleBadge = (text = "Example data") => `<span class="ex-badge" title="Made-up data in a guessed Atlas 2 format, for trying out the design. Not real findings.">◇ ${esc(text)}</span>`;
      const CERT = { recorded: { mark: "", label: "Recorded" }, ai: { mark: "", label: "AI-extracted, not checked yet" }, checked: { mark: "✓", label: "Checked by a person" } };
      const certMark = (c) => `<span class="cert cert-${esc(c)}" title="${esc(CERT[c]?.label || c)}">${CERT[c]?.mark ?? "?"}</span>`;
      const certKey = () => `<div class="cert-key">${Object.keys(CERT).map((c) => `<span>${certMark(c)}${esc(CERT[c].label.replace(", not checked yet", ""))}</span>`).join("")}</div>`;

      // ---------- State ----------
      const state = {
        view: "field",
        landingOpen: new Set(),
        // Filters: shared by every view and kept as you move around.
        types: new Set(nodeTypes),
        minPapers: 1,
        pins: [],
        filtersOpen: false,
        // Atlas 2 filters (example data only): chosen values per variable, a minimum per number, and which certainties count.
        exValues: new Map(),
        exMin: new Map(),
        exCert: new Set(["recorded", "ai", "checked"]),
        exOpen: new Set(["study"]),
        // Orbit: "together" (shared papers) or "findings" (example Atlas 2 findings), and what to split nodes by.
        orbitMode: "together",
        splitBy: "",
        center: null,
        tab: "papers",
        connection: null,
        paper: null,
        papersSort: "newest",
        papersShown: PAGE,
        connSort: "most",
        connPapersShown: PAGE,
        // Sub-groups start collapsed; top-level groups start open.
        collapsedTypes: new Set(typesInOrder.filter((t) => t.depth >= 1 && t.children.length).map((t) => t.id)),
        showTypes: new Set(nodeTypes),
        // Papers opened one after another from "Related papers", so "← Previous paper" can step back.
        paperTrail: [],
        keepPapersTab: false,
        orbitLimit: ORBIT_STEP,
        range: [Y0, Y1],
        compare: [],
        hover: null
      };
      const MAX_COMPARE = 3;

      // ---------- Helpers ----------
      function esc(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll("\"", "&quot;")
          .replaceAll("'", "&#39;");
      }
      function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
      const trunc = (s, n) => (s.length > n ? `${s.slice(0, n).replace(/\s+\S*$/, "")}…` : s);
      // Long names wrap onto two lines, split at the space that balances them best.
      function wrapLabel(s) {
        if (s.length <= WRAP_AT) return [s];
        let best = null;
        for (let i = s.indexOf(" "); i !== -1; i = s.indexOf(" ", i + 1)) {
          const lines = [s.slice(0, i), s.slice(i + 1)];
          const width = Math.max(lines[0].length, lines[1].length);
          if (!best || width < best.width) best = { lines, width };
        }
        return best ? best.lines : [s];
      }
      const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;
      const pct = d3.format(".1~%");
      const withArticle = (s) => `${/^[aeiou]/i.test(s) ? "an" : "a"} ${s}`;
      function listJoin(items) {
        if (items.length <= 1) return items.join("");
        return `${items.slice(0, -1).join(", ")} and ${items[items.length - 1]}`;
      }
      const badge = (type) => `<span class="badge" style="background:${colorOf(type)}">${esc(typeOf(type)?.label || type)}</span>`;
      const typeWord = (type) => (typeOf(type)?.label || type).toLowerCase();
      const dot = (type) => `<span class="dot" style="background:${colorOf(type)}"></span>`;

      // Most titles in the data are in all caps; those get title case, everything else is left alone.
      const SMALL_WORDS = new Set("a an and as at but by for from in into nor of on onto or per than the to via vs with within without".split(" "));
      const ACRONYMS = new Map("AI CAD CAE CFD DDC EEG ECG FEA FMEA FMRI FNIRS GPT HCI HRV IOT LLM ML NASA NLP PSS QFD STEM TRIZ UI UX VR AR XR MBSE AHP AUT II III IV".split(" ").map((w) => [w, w]));
      [["LLMS", "LLMs"], ["IOT", "IoT"], ["FMRI", "fMRI"], ["FNIRS", "fNIRS"], ["AIS", "AIs"]].forEach(([k, v]) => ACRONYMS.set(k, v));
      function titleCase(title) {
        const t = (title || "").trim();
        const letters = t.replace(/[^A-Za-z]/g, "");
        if (!letters || letters.replace(/[^A-Z]/g, "").length / letters.length < 0.7) return t;
        let forceCap = true;
        return t.replace(/[A-Za-z0-9][A-Za-z0-9'’]*|[^A-Za-z0-9]+/g, (token) => {
          if (!/[A-Za-z0-9]/.test(token[0])) {
            if (/[:?!—–]/.test(token)) forceCap = true;
            return token;
          }
          const upper = token.toUpperCase();
          const first = forceCap;
          forceCap = false;
          if (ACRONYMS.has(upper)) return ACRONYMS.get(upper);
          if (/^\d+[A-Z]$/.test(upper)) return upper;
          const lower = token.toLowerCase();
          if (!first && SMALL_WORDS.has(lower)) return lower;
          return lower.charAt(0).toUpperCase() + lower.slice(1);
        });
      }
      const paperTitle = (p) => titleCase(p.title) || "[title unavailable]";

      // Fills a schema phrase: {key} is replaced by vars[key]; {a key} adds "a"/"an" in front.
      function fillTemplate(template, vars) {
        return template.replace(/\{(a )?(\w+)\}/g, (match, article, key) => {
          if (!(key in vars)) return match;
          return article ? withArticle(vars[key]) : vars[key];
        });
      }

      // The edge `type` field is unreliable, so the sentence is chosen from the two concepts' own types,
      // using the schema's sentence for that pair of types (or for their parent types).
      const SENTENCES = schema.connectionSentences || {};
      function connectionSentence(center, neighbor, n) {
        const [x, y] = typeRank(center.type) <= typeRank(neighbor.type) ? [center, neighbor] : [neighbor, center];
        let template = null;
        for (const tx of ancestry(x.type)) {
          for (const ty of ancestry(y.type)) {
            template = SENTENCES[`${tx.id}+${ty.id}`] || null;
            if (template) break;
          }
          if (template) break;
        }
        template = template || SENTENCES.default || "{n} studied both {A} and {B}";
        return fillTemplate(template, { n: plural(n, "paper"), A: x.label, B: y.label });
      }

      // ---------- Year range ----------
      const rangeActive = () => state.range[0] > Y0 || state.range[1] < Y1;
      const rangeText = () => `${state.range[0]}–${state.range[1]}`;
      const inRange = (p) => p.year >= state.range[0] && p.year <= state.range[1];
      // The papers in view: inside the year range and, when concepts are pinned, covering every pinned concept.
      let pinnedPapers = null;
      function recomputeScope() {
        if (!state.pins.length) { pinnedPapers = null; return; }
        const sets = state.pins.map((id) => new Set(byId.get(id).papers.map((p) => p.paper_id)));
        sets.sort((a, b) => a.size - b.size);
        pinnedPapers = new Set([...sets[0]].filter((id) => sets.every((set) => set.has(id))));
      }
      const scopeActive = () => rangeActive() || !!pinnedPapers;
      const inScope = (p) => inRange(p) && (!pinnedPapers || pinnedPapers.has(p.paper_id));
      const papersIn = (list) => (scopeActive() ? list.filter(inScope) : list);
      const papersInRange = (list) => (rangeActive() ? list.filter(inRange) : list);
      // How much more often two concepts share papers than if they were unrelated:
      // shared papers ÷ (papers of A × papers of B ÷ all papers in view).
      function liftOf(nShared, aCount, bCount) {
        const total = scopeCount();
        const expected = total ? (aCount * bCount) / total : 0;
        return { lift: expected ? nShared / expected : 0, expected };
      }
      const liftText = (lift) => (lift >= 10 ? lift.toFixed(0) : lift.toFixed(1)) + "×";
      // Short form for lists and tooltips.
      const liftShort = (lift) => (lift >= 1.15 ? `${liftText(lift)} chance` : lift > 0.87 ? "about chance" : `below chance (${liftText(lift)})`);
      // "studied together 2.0× more often than chance", in plain words, for any lift.
      function liftPhrase(lift) {
        if (lift >= 1.15) return `studied together <strong>${liftText(lift)} more often</strong> than chance`;
        if (lift > 0.87) return `studied together <strong>about as often as chance</strong> would predict`;
        return `studied together <strong>less often than chance</strong> (${liftText(lift)})`;
      }
      // A concept is shown when its type is on and it has enough papers in the year range.
      const conceptOn = (n) => state.types.has(n.type) && papersInRange(n.papers).length >= state.minPapers;
      const papersOf = (node) => papersIn(node.papers);

      // ---------- Tooltip (kept inside the graph area it belongs to) ----------
      let tipBounds = null;
      function showTip(html, event, boundsEl) {
        const wasHidden = tooltip.hidden;
        tipBounds = boundsEl;
        tooltip.innerHTML = html;
        tooltip.hidden = false;
        if (wasHidden) {
          tooltip.classList.remove("show");
          void tooltip.offsetWidth;
          tooltip.classList.add("show");
        }
        moveTip(event);
      }
      function moveTip(event) {
        const r = tooltip.getBoundingClientRect();
        const b = (tipBounds || document.body).getBoundingClientRect();
        let x = event.clientX + 16, y = event.clientY + 16;
        if (x + r.width > b.right - 10) x = event.clientX - r.width - 16;
        if (y + r.height > b.bottom - 10) y = event.clientY - r.height - 16;
        x = Math.min(Math.max(b.left + 10, x), b.right - r.width - 10);
        y = Math.min(Math.max(b.top + 10, y), b.bottom - r.height - 10);
        tooltip.style.left = `${x}px`;
        tooltip.style.top = `${y}px`;
      }
      function hideTip() { tooltip.hidden = true; }

      function conceptTip(n, extra) {
        const def = n.description
          ? `<p class="tt-def">${esc(trunc(n.description, 240))}</p>`
          : `<p class="tt-def" style="color:var(--faint);font-style:italic">No definition in the data yet.</p>`;
        return `<div class="tt-name">${esc(cap(n.label))}</div>${badge(n.type)}${def}<div class="tt-meta">${extra}</div>`;
      }

      // ---------- Routing ----------
      function navigate(hash) {
        if (location.hash !== hash) location.hash = hash;
        else route();
      }
      // Every level has its own address, so links can be shared and browser Back steps out one level:
      // #/concept/<id>, #/concept/<id>/with/<id>, and either of those followed by /paper/<paper id>.
      function conceptHash(center, connection = null, paper = null) {
        return `#/concept/${encodeURIComponent(center)}`
          + (connection ? `/with/${encodeURIComponent(connection)}` : "")
          + (paper != null ? `/paper/${paper}` : "");
      }
      const openConcept = (id) => navigate(conceptHash(id));
      // Home is the full network (3D stars, or 2D); the landmarks overview lives at #/overview.
      const goHome = () => navigate("#/");
      const goField = goHome;
      const goOverview = () => navigate("#/overview");
      const selectConnection = (id) => navigate(conceptHash(state.center, id));
      const clearConnection = () => navigate(conceptHash(state.center));
      const openPaper = (id) => navigate(conceptHash(state.center, state.connection, id));
      const closePaper = () => navigate(conceptHash(state.center, state.connection));
      // One level up from wherever you are: paper → connection → concept → field.
      function goUp() {
        if (state.view === "landing") { goHome(); return; }
        if (state.view !== "concept") return;
        if (state.paper != null) closePaper();
        else if (state.connection) clearConnection();
        else goHome();
      }
      function route() {
        const m = location.hash.match(/^#\/concept\/([^/]+)(?:\/with\/([^/]+))?(?:\/paper\/(\d+|ex\d+))?\/?$/);
        const id = m && decodeURIComponent(m[1]);
        if (/^#\/overview\/?$/.test(location.hash)) { showLanding(); return; }
        if (!id || !byId.has(id)) { showField(); return; }
        const conn = m[2] ? decodeURIComponent(m[2]) : null;
        const paper = m[3] ? (isExampleId(m[3]) ? m[3] : Number(m[3])) : null;
        showConcept(id, {
          connection: conn && linkByPair.has(pairKey(id, conn)) ? conn : null,
          paper: paper != null && getPaper(paper) ? paper : null
        });
      }
      window.addEventListener("hashchange", route);

      // ---------- Top bar ----------
      $("crumb-home").addEventListener("click", goHome);


      // Search
      const searchInput = $("search-input");
      const searchResults = $("search-results");
      let activeResult = -1;
      function fuzzyMatch(label, query) {
        const q = query.toLowerCase().trim();
        const l = label.toLowerCase();
        if (l.includes(q)) return true;
        let i = 0;
        for (const ch of l) {
          if (ch === q[i]) i += 1;
          if (i === q.length) return true;
        }
        return false;
      }
      function searchMatches() {
        const q = searchInput.value.trim();
        if (!q) return [];
        const lower = q.toLowerCase();
        return nodes
          .filter((n) => fuzzyMatch(n.label, q))
          .sort((a, b) => {
            const ai = a.label.toLowerCase().indexOf(lower), bi = b.label.toLowerCase().indexOf(lower);
            if ((ai === -1) !== (bi === -1)) return ai === -1 ? 1 : -1;
            return b.paperCount - a.paperCount;
          })
          .slice(0, 8);
      }
      function renderSearch() {
        const matches = searchMatches();
        searchResults.hidden = !matches.length;
        searchResults.innerHTML = matches.map((n, i) => `
          <div class="search-item ${i === activeResult ? "active" : ""}" data-id="${esc(n.id)}">
            <span>${dot(n.type)} ${esc(cap(n.label))}</span><span class="t">${esc(typeWord(n.type))}</span>
          </div>`).join("");
        return matches;
      }
      function chooseSearch(id) {
        searchInput.value = "";
        searchResults.hidden = true;
        activeResult = -1;
        searchInput.blur();
        if (state.view === "field" && net.dim === "3d" && net.scene) net.flyTo(id, { open: false });
        else openConcept(id);
      }
      searchInput.addEventListener("input", () => { activeResult = -1; renderSearch(); });
      searchInput.addEventListener("keydown", (event) => {
        const matches = searchMatches();
        if (event.key === "Escape") { searchResults.hidden = true; activeResult = -1; return; }
        if (!matches.length) return;
        if (event.key === "ArrowDown") { event.preventDefault(); activeResult = Math.min(matches.length - 1, activeResult + 1); renderSearch(); }
        else if (event.key === "ArrowUp") { event.preventDefault(); activeResult = Math.max(0, activeResult - 1); renderSearch(); }
        else if (event.key === "Enter") { event.preventDefault(); chooseSearch(matches[Math.max(0, activeResult)].id); }
      });
      searchResults.addEventListener("click", (event) => {
        const item = event.target.closest(".search-item");
        if (item) chooseSearch(item.dataset.id);
      });
      document.addEventListener("click", (event) => {
        if (!searchResults.contains(event.target) && event.target !== searchInput) searchResults.hidden = true;
      });

      // Glossary
      $("glossary-body").innerHTML = `
        ${shownTypeTree.map((t) => `
          <div class="gloss-item" style="margin-left:${t.depth * 20}px">
            ${dot(t.id)}
            <div><strong>${esc(t.plural)}</strong><span class="n">${plural(t.total, "concept")}</span></div>
            ${t.definition ? `<p>${esc(t.definition)}</p>` : ""}
          </div>`).join("")}
        <div class="more">
          <p><strong>Connections.</strong> Two concepts are connected when the same papers study both. The number on a connection is how many papers they share.</p>
          <p><strong>Orbit.</strong> When you open a concept, its most related connections orbit around it, grouped by type. Size shows a concept's papers. The three rings rank relevance (shared papers ÷ papers in either concept): the inner ring holds the top third.</p>
          <p><strong>× chance.</strong> How many times more often two concepts share papers than you'd expect if they were unrelated. Common concepts (like Engineering Students) share many papers with everything, so a big count can still be "about chance".</p>
          <p style="color:var(--muted)">Extracted from ${raw.meta?.paper_count ?? paperById.size} empirical papers in the ASME DTM proceedings, ${Y0}–${Y1}.</p>
          ${EX ? `<p>${exampleBadge()} <strong>Atlas 2 preview.</strong> Panels in a dashed amber frame use ${EX.papers.length} made-up papers to show how findings, certainty and study details could look once Atlas 2 data exists. They are not real findings and never change the real counts.</p>
          <p><strong>Certainty marks</strong> (on example data):</p>${certKey()}` : ""}
        </div>`;
      const glossary = $("glossary");
      $("help-btn").addEventListener("click", () => { glossary.hidden = false; });
      $("glossary-close").addEventListener("click", () => { glossary.hidden = true; });
      glossary.addEventListener("click", (event) => { if (event.target === glossary) glossary.hidden = true; });
      document.addEventListener("keydown", (event) => {
        if (event.key !== "Escape") return;
        if (!glossary.hidden) { glossary.hidden = true; return; }
        if (state.filtersOpen) { setFiltersOpen(false); return; }
        if (event.target === searchInput || !searchResults.hidden) return;
        goUp();
      });

      // ---------- Field view ----------
      const fieldSvg = d3.select("#field");
      const fieldEl = fieldSvg.node();
      const fieldDims = { w: fieldEl.clientWidth || innerWidth, h: fieldEl.clientHeight || innerHeight - 62 };
      fieldSvg.attr("viewBox", [0, 0, fieldDims.w, fieldDims.h]);
      const fieldRoot = fieldSvg.append("g");
      const fieldLinkG = fieldRoot.append("g");
      const fieldNodeG = fieldRoot.append("g");
      const fieldZoom = d3.zoom().scaleExtent([0.2, 6]).on("zoom", (event) => fieldRoot.attr("transform", event.transform));
      fieldSvg.call(fieldZoom);

      const fieldLinks = links.map((l) => ({ source: l.a, target: l.b, link: l }));
      const maxShared = d3.max(links, (l) => l.shared) || 1;
      const widthScale = d3.scaleLinear().domain([0, maxShared]).range([0.6, 5]);
      const opacityScale = d3.scaleLinear().domain([0, maxShared]).range([0.08, 0.7]);

      const fieldSim = d3.forceSimulation(nodes)
        .force("link", d3.forceLink(fieldLinks).id((d) => d.id).distance((d) => 120 - Math.min(90, d.link.shared * 1.8)))
        .force("charge", d3.forceManyBody().strength(-140))
        .force("center", d3.forceCenter(fieldDims.w / 2, fieldDims.h / 2))
        .force("x", d3.forceX(fieldDims.w / 2).strength((d) => (adjacency.has(d.id) ? 0.03 : 0.15)))
        .force("y", d3.forceY(fieldDims.h / 2).strength((d) => (adjacency.has(d.id) ? 0.03 : 0.15)))
        .force("collision", d3.forceCollide().radius((d) => nodeR(d.paperCount) + 2));

      const fieldLinkSel = fieldLinkG.selectAll("line")
        .data(fieldLinks)
        .join("line")
        .attr("stroke", "#f0f2f5")
        .attr("stroke-linecap", "round");

      const fieldNodeSel = fieldNodeG.selectAll("circle")
        .data(nodes, (d) => d.id)
        .join("circle")
        .attr("r", (d) => nodeR(d.paperCount))
        .attr("fill", (d) => colorOf(d.type))
        .attr("stroke", "#11131a")
        .attr("stroke-width", 1.2)
        .style("cursor", "pointer")
        .on("mouseenter", (event, d) => showTip(conceptTip(d, `${plural(d.paperCount, "paper")} · click to explore`), event, $("field-view")))
        .on("mousemove", moveTip)
        .on("mouseleave", hideTip)
        .on("click", (event, d) => { event.stopPropagation(); hideTip(); openConcept(d.id); })
        .call(d3.drag()
          .on("start", (event, d) => { if (!event.active) fieldSim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
          .on("drag", (event, d) => { d.fx = event.x; d.fy = event.y; })
          .on("end", (event, d) => { if (!event.active) fieldSim.alphaTarget(0); d.fx = null; d.fy = null; }));

      fieldSim.on("tick", () => {
        fieldLinkSel
          .attr("x1", (d) => d.source.x).attr("y1", (d) => d.source.y)
          .attr("x2", (d) => d.target.x).attr("y2", (d) => d.target.y);
        fieldNodeSel.attr("cx", (d) => d.x).attr("cy", (d) => d.y);
      });

      const fieldNodeOn = (n) => conceptOn(n) && papersIn(n.papers).length > 0;
      const fieldLinkCount = (l) => papersIn(l.papers).length;

      function updateField() {
        fieldNodeSel.attr("display", (d) => (fieldNodeOn(d) ? null : "none"));
        let visibleLinks = 0;
        fieldLinkSel
          .attr("display", (d) => {
            const on = fieldNodeOn(d.source) && fieldNodeOn(d.target) && fieldLinkCount(d.link) > 0;
            if (on) visibleLinks += 1;
            return on ? null : "none";
          })
          .attr("stroke-width", (d) => widthScale(fieldLinkCount(d.link)))
          .attr("stroke-opacity", (d) => opacityScale(fieldLinkCount(d.link)));
        if (net.scene) net.applyFilters();
      }

      $("field-legend").innerHTML = `
        ${shownTypeTree.filter((t) => !t.parentId).map((t) => `<div class="row">${dot(t.id)}${esc(t.plural)} (${t.total})</div>`).join("")}
        <div class="hint">Size = papers · line = shared papers</div>
        <div class="hint">Hover for a definition · click to explore</div>
`;

      function resizeField() {
        const w = fieldEl.clientWidth, h = fieldEl.clientHeight;
        if (!w || !h || (w === fieldDims.w && h === fieldDims.h)) return;
        fieldDims.w = w;
        fieldDims.h = h;
        fieldSvg.attr("viewBox", [0, 0, w, h]);
        fieldSim.force("center", d3.forceCenter(w / 2, h / 2));
        fieldSim.force("x").x(w / 2);
        fieldSim.force("y").y(h / 2);
        fieldSim.alpha(0.25).restart();
      }
      window.addEventListener("resize", resizeField);

      function showField() {
        state.view = "field";
        state.center = null;
        hideTip();
        $("concept-view").hidden = true;
        $("landing-view").hidden = true;
        $("field-view").hidden = false;
        renderCrumbs();
        resizeField();
        updateField();
        setNetDim(net.dim);
      }

      // ---------- Full network in 3D ----------
      // Each concept is a star. Position comes from a fixed 3D layout computed once: concepts are pulled
      // toward the ones whose papers they share the biggest share of, and pushed away from everything else.
      // Concepts with no links sit evenly on an outer shell.
      const net = {
        dim: (() => { try { return localStorage.getItem("atlas-net-dim") === "2d" ? "2d" : "3d"; } catch { return "3d"; } })(),
        scene: null,
        loading: null
      };

      function layout3D() {
        let r = 11;
        const rnd = () => ((r = (r * 1664525 + 1013904223) >>> 0) / 4294967296);
        const linked = nodes.filter((n) => (adjacency.get(n.id) || []).length);
        const loose = nodes.filter((n) => !(adjacency.get(n.id) || []).length);
        const idx = new Map(linked.map((n, i) => [n.id, i]));
        const N = linked.length;
        const P = new Float64Array(N * 3), V = new Float64Array(N * 3);
        for (let i = 0; i < N; i++) {
          const u = rnd() * 2 - 1, t = rnd() * Math.PI * 2, rad = 150 * Math.cbrt(rnd()), sq = Math.sqrt(1 - u * u);
          P[i * 3] = rad * sq * Math.cos(t); P[i * 3 + 1] = rad * sq * Math.sin(t); P[i * 3 + 2] = rad * u;
        }
        // Strength of a tie = shared papers ÷ √(papers of A × papers of B), so big hubs don't pull everything in.
        const cos = (l) => l.shared / Math.sqrt(byId.get(l.a).paperCount * byId.get(l.b).paperCount);
        // Springs only on each concept's six strongest ties; with all ~1,900 the space collapses into one ball.
        const springs = new Map();
        linked.forEach((n) => adjacency.get(n.id).map((x) => x.link).sort((x, y) => cos(y) - cos(x)).slice(0, 6)
          .forEach((l) => springs.set(pairKey(l.a, l.b), l)));
        const S = [...springs.values()].map((l) => {
          const w = Math.min(1, cos(l) * 1.6);
          return { i: idx.get(l.a), j: idx.get(l.b), len: 18 + 70 * (1 - w), k: 0.04 + 0.25 * w };
        });
        const ITER = 420, REP = 2600, GRAV = 0.012;
        for (let it = 0; it < ITER; it++) {
          const alpha = 1 - it / ITER;
          for (let i = 0; i < N; i++) {
            for (let j = i + 1; j < N; j++) {
              let dx = P[i * 3] - P[j * 3], dy = P[i * 3 + 1] - P[j * 3 + 1], dz = P[i * 3 + 2] - P[j * 3 + 2];
              let d2 = dx * dx + dy * dy + dz * dz;
              if (d2 < 1) { dx = rnd() - 0.5; dy = rnd() - 0.5; dz = rnd() - 0.5; d2 = 1; }
              const d = Math.sqrt(d2), f = (REP / d2) * alpha;
              const fx = (dx / d) * f, fy = (dy / d) * f, fz = (dz / d) * f;
              V[i * 3] += fx; V[i * 3 + 1] += fy; V[i * 3 + 2] += fz;
              V[j * 3] -= fx; V[j * 3 + 1] -= fy; V[j * 3 + 2] -= fz;
            }
          }
          S.forEach(({ i, j, len, k }) => {
            const dx = P[j * 3] - P[i * 3], dy = P[j * 3 + 1] - P[i * 3 + 1], dz = P[j * 3 + 2] - P[i * 3 + 2];
            const d = Math.sqrt(dx * dx + dy * dy + dz * dz) || 1;
            const f = k * (d - len) * alpha;
            const fx = (dx / d) * f, fy = (dy / d) * f, fz = (dz / d) * f;
            V[i * 3] += fx; V[i * 3 + 1] += fy; V[i * 3 + 2] += fz;
            V[j * 3] -= fx; V[j * 3 + 1] -= fy; V[j * 3 + 2] -= fz;
          });
          for (let i = 0; i < N * 3; i++) {
            V[i] -= P[i] * GRAV * alpha;
            P[i] += Math.max(-12, Math.min(12, V[i]));
            V[i] *= 0.6;
          }
        }
        const pos = new Map();
        let maxR = 0;
        linked.forEach((n, i) => {
          const p = [P[i * 3], P[i * 3 + 1], P[i * 3 + 2]];
          pos.set(n.id, p);
          maxR = Math.max(maxR, Math.hypot(...p));
        });
        const shell = maxR * 1.35;
        loose.sort((a, b) => b.paperCount - a.paperCount).forEach((n, i) => {
          const y = 1 - (2 * (i + 0.5)) / loose.length, rr = Math.sqrt(1 - y * y), th = i * Math.PI * (3 - Math.sqrt(5));
          pos.set(n.id, [shell * rr * Math.cos(th), shell * y, shell * rr * Math.sin(th)]);
        });
        return { pos, radius: maxR, shell, looseCount: loose.length };
      }

      // A soft round sprite texture: `hard` gives a crisp core, otherwise a wide glow.
      function starTexture(THREE, hard) {
        const c = document.createElement("canvas");
        c.width = c.height = 128;
        const g = c.getContext("2d");
        const grad = g.createRadialGradient(64, 64, 0, 64, 64, 64);
        if (hard) {
          grad.addColorStop(0, "rgba(255,255,255,1)");
          grad.addColorStop(0.55, "rgba(255,255,255,1)");
          grad.addColorStop(0.72, "rgba(255,255,255,0.35)");
          grad.addColorStop(1, "rgba(255,255,255,0)");
        } else {
          grad.addColorStop(0, "rgba(255,255,255,0.9)");
          grad.addColorStop(0.25, "rgba(255,255,255,0.35)");
          grad.addColorStop(1, "rgba(255,255,255,0)");
        }
        g.fillStyle = grad;
        g.fillRect(0, 0, 128, 128);
        const tex = new THREE.CanvasTexture(c);
        tex.colorSpace = THREE.SRGBColorSpace;
        return tex;
      }

      async function buildNet3D() {
        const THREE = await import("three");
        const { OrbitControls } = await import("three/addons/controls/OrbitControls.js");
        const host = $("net3d");
        let renderer;
        try {
          renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        } catch (error) {
          throw new Error("3D needs WebGL, which isn't available in this browser.");
        }
        renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
        renderer.setClearColor(0x07080c, 1);
        host.prepend(renderer.domElement);
        renderer.domElement.setAttribute("tabindex", "0");

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x07080c, 0.0009);
        const camera = new THREE.PerspectiveCamera(50, 1, 1, 8000);
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.zoomToCursor = true;
        controls.minDistance = 15;
        controls.maxDistance = 1800;
        controls.rotateSpeed = 0.6;
        controls.autoRotate = !REDUCED_MOTION;
        controls.autoRotateSpeed = 0.3;

        const L = layout3D();
        const HOME = { pos: new THREE.Vector3(0, L.shell * 0.45, L.shell * 1.75), target: new THREE.Vector3(0, 0, 0) };
        camera.position.copy(HOME.pos);
        controls.target.copy(HOME.target);

        // Faint background stars, far away and unaffected by fog.
        const bg = new Float32Array(1600 * 3);
        for (let i = 0; i < 1600; i++) {
          const u = Math.random() * 2 - 1, t = Math.random() * Math.PI * 2, rr = 2600 + Math.random() * 2400, sq = Math.sqrt(1 - u * u);
          bg[i * 3] = rr * sq * Math.cos(t); bg[i * 3 + 1] = rr * sq * Math.sin(t); bg[i * 3 + 2] = rr * u;
        }
        const bgGeo = new THREE.BufferGeometry();
        bgGeo.setAttribute("position", new THREE.BufferAttribute(bg, 3));
        scene.add(new THREE.Points(bgGeo, new THREE.PointsMaterial({ color: 0x8a93a6, size: 1.3, sizeAttenuation: false, transparent: true, opacity: 0.45, fog: false, depthWrite: false })));

        // Stars: a glow and a crisp core per concept, tinted by type.
        const glowTex = starTexture(THREE, false), coreTex = starTexture(THREE, true);
        const stars = new Map();
        nodes.forEach((n) => {
          const color = new THREE.Color(colorOf(n.type));
          const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color, transparent: true, opacity: 0.3, blending: THREE.AdditiveBlending, depthWrite: false }));
          const core = new THREE.Sprite(new THREE.SpriteMaterial({ map: coreTex, color, transparent: true, depthWrite: false }));
          const p = new THREE.Vector3(...L.pos.get(n.id));
          glow.position.copy(p);
          core.position.copy(p);
          scene.add(glow, core);
          stars.set(n.id, { n, glow, core, p, r: 3, visible: true });
        });

        // Lines: every connection, very faint; brighter with more shared papers. Additive, so they glow where they bunch.
        const linkGeo = new THREE.BufferGeometry();
        const linkMat = new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: 1, blending: THREE.AdditiveBlending, depthWrite: false });
        const linkLines = new THREE.LineSegments(linkGeo, linkMat);
        scene.add(linkLines);
        // The hovered or focused star's own lines, drawn on top in its color.
        const hiGeo = new THREE.BufferGeometry();
        const hiMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.75, depthWrite: false, blending: THREE.AdditiveBlending });
        const hiLines = new THREE.LineSegments(hiGeo, hiMat);
        scene.add(hiLines);

        // Labels: one HTML element per concept, positioned each frame.
        const labelLayer = $("net3d-labels");
        stars.forEach((st) => {
          const el = document.createElement("div");
          el.className = "nl";
          el.innerHTML = `${dot(st.n.type)}${esc(cap(st.n.label))}`;
          labelLayer.appendChild(el);
          st.el = el;
          st.labelW = Math.min(260, cap(st.n.label).length * 7 + 16);
        });

        Object.assign(net, { THREE, renderer, scene, camera, controls, stars, linkGeo, linkLines, hiGeo, hiLines, hiMat, L, HOME, hover: null, focus: null, fly: null, running: false, big: new Set() });

        net.applyFilters = function () {
          const counts = new Map();
          stars.forEach((st) => {
            const c = papersIn(st.n.papers).length;
            counts.set(st.n.id, c);
            st.visible = fieldNodeOn(st.n);
            st.r = nodeR(Math.max(1, c));
            st.core.visible = st.glow.visible = st.visible;
            st.core.scale.setScalar(st.r * 1.5);
            st.glow.scale.setScalar(st.r * 3.2);
          });
          // The biggest concepts in view always keep a label.
          net.big = new Set([...stars.values()].filter((st) => st.visible).sort((a, b) => counts.get(b.n.id) - counts.get(a.n.id)).slice(0, 14).map((st) => st.n.id));
          const shown = links.filter((l) => stars.get(l.a).visible && stars.get(l.b).visible && fieldLinkCount(l) > 0);
          const max = d3.max(shown, fieldLinkCount) || 1;
          const posArr = new Float32Array(shown.length * 6), colArr = new Float32Array(shown.length * 6);
          shown.forEach((l, i) => {
            const a = stars.get(l.a).p, b = stars.get(l.b).p;
            posArr.set([a.x, a.y, a.z, b.x, b.y, b.z], i * 6);
            // Faint by default (one-paper links nearly vanish), so ~1,900 lines don't saturate the core.
            const k = 0.006 + 0.16 * Math.pow(Math.log1p(fieldLinkCount(l) - 1) / Math.log1p(max - 1 || 1), 1.6);
            colArr.set([0.62 * k, 0.72 * k, 0.95 * k, 0.62 * k, 0.72 * k, 0.95 * k], i * 6);
          });
          linkGeo.setAttribute("position", new THREE.BufferAttribute(posArr, 3));
          linkGeo.setAttribute("color", new THREE.BufferAttribute(colArr, 3));
          linkGeo.computeBoundingSphere();
          net.visibleLinks = shown;
          renderNetLegend();
          setHighlight();
        };

        // Lights up one star's own lines (the hovered star, else the focused one).
        function setHighlight() {
          const id = net.hover || net.focus;
          if (!id || !stars.get(id)?.visible) { hiGeo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(0), 3)); return; }
          const mine = net.visibleLinks.filter((l) => l.a === id || l.b === id);
          const arr = new Float32Array(mine.length * 6);
          mine.forEach((l, i) => { const a = stars.get(l.a).p, b = stars.get(l.b).p; arr.set([a.x, a.y, a.z, b.x, b.y, b.z], i * 6); });
          hiGeo.setAttribute("position", new THREE.BufferAttribute(arr, 3));
          hiGeo.computeBoundingSphere();
          hiMat.color.set(colorOf(stars.get(id).n.type));
          // Its strongest neighbors get labels too.
          net.hotNeighbors = new Set(mine.sort((x, y) => fieldLinkCount(y) - fieldLinkCount(x)).slice(0, 6).map((l) => (l.a === id ? l.b : l.a)));
          linkLines.material.opacity = 0.55;
        }
        net.setHighlight = setHighlight;

        // Screen-space picking: the nearest visible star under the pointer, preferring the one closest to the camera.
        const v = new THREE.Vector3();
        function project(st, w, h) {
          v.copy(st.p).project(camera);
          if (v.z > 1 || v.z < -1) return null;
          const dist = camera.position.distanceTo(st.p);
          const px = (st.r * 1.5 * 0.5 * h) / (2 * dist * Math.tan((camera.fov * Math.PI) / 360));
          return { x: (v.x * 0.5 + 0.5) * w, y: (-v.y * 0.5 + 0.5) * h, dist, px };
        }
        net.project = project;
        function pick(mx, my) {
          const w = host.clientWidth, h = host.clientHeight;
          let best = null;
          stars.forEach((st) => {
            if (!st.visible) return;
            const s = project(st, w, h);
            if (!s) return;
            const d = Math.hypot(s.x - mx, s.y - my);
            if (d > Math.max(7, s.px + 4)) return;
            const score = d + s.dist * 0.01;
            if (!best || score < best.score) best = { st, score };
          });
          return best ? best.st : null;
        }

        const canvas = renderer.domElement;
        let down = null;
        canvas.addEventListener("pointerdown", (event) => { down = { x: event.clientX, y: event.clientY }; });
        canvas.addEventListener("pointermove", (event) => {
          const rect = canvas.getBoundingClientRect();
          const st = pick(event.clientX - rect.left, event.clientY - rect.top);
          const id = st ? st.n.id : null;
          host.classList.toggle("hovering", !!id);
          if (id !== net.hover) { net.hover = id; setHighlight(); if (!id) linkLines.material.opacity = net.focus ? 0.55 : 1; }
          if (st) showTip(conceptTip(st.n, `${plural(papersIn(st.n.papers).length, "paper")}${scopeActive() ? " in view" : ""} · click to fly in`), event, $("field-view"));
          else hideTip();
        });
        canvas.addEventListener("pointerleave", () => { net.hover = null; host.classList.remove("hovering"); setHighlight(); hideTip(); });
        canvas.addEventListener("pointerup", (event) => {
          if (!down || Math.hypot(event.clientX - down.x, event.clientY - down.y) > 5) return;
          if (net.hover) { hideTip(); net.flyTo(net.hover, { open: true }); }
        });
        controls.addEventListener("start", () => { if (!net.fly) setSpin(false); });

        // Smoothly moves the camera to look at a star from a little way off, then optionally opens its page.
        net.flyTo = function (id, { open = false } = {}) {
          const st = stars.get(id);
          if (!st) return;
          if (!st.visible) { if (open) openConcept(id); return; }
          setSpin(false);
          net.focus = id;
          setHighlight();
          const dir = camera.position.clone().sub(controls.target).normalize();
          const endTarget = st.p.clone();
          const endPos = st.p.clone().add(dir.multiplyScalar(55 + st.r * 7));
          net.fly = { t0: performance.now(), dur: REDUCED_MOTION ? 0 : 1100, fromPos: camera.position.clone(), fromTarget: controls.target.clone(), toPos: endPos, toTarget: endTarget, then: open ? () => openConcept(id) : null };
        };
        net.reset = function () {
          net.focus = null;
          setHighlight();
          linkLines.material.opacity = 1;
          net.fly = { t0: performance.now(), dur: REDUCED_MOTION ? 0 : 1100, fromPos: camera.position.clone(), fromTarget: controls.target.clone(), toPos: HOME.pos.clone(), toTarget: HOME.target.clone(), then: () => setSpin(!REDUCED_MOTION) };
        };

        new ResizeObserver(() => {
          const w = host.clientWidth, h = host.clientHeight;
          if (!w || !h) return;
          renderer.setSize(w, h, false);
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
        }).observe(host);

        net.applyFilters();
      }

      // Labels: the biggest concepts, the hovered/focused one and its strongest neighbors, and anything near the camera
      // (fading in as you approach). Placed greedily by priority so they never overlap.
      const LABEL_NEAR = 110, LABEL_FAR = 260;
      function placeNetLabels() {
        const host = $("net3d");
        const w = host.clientWidth, h = host.clientHeight;
        const boxes = [];
        const cands = [];
        net.stars.forEach((st) => {
          st.show = false;
          if (!st.visible) return;
          const s = net.project(st, w, h);
          if (!s || s.x < -50 || s.x > w + 50 || s.y < -20 || s.y > h + 20) return;
          const hot = st.n.id === net.hover || st.n.id === net.focus;
          const near = (net.hover || net.focus) && net.hotNeighbors?.has(st.n.id);
          const big = net.big.has(st.n.id);
          const fade = Math.max(0, Math.min(1, (LABEL_FAR - s.dist) / (LABEL_FAR - LABEL_NEAR)));
          if (!hot && !near && !big && fade <= 0) return;
          const pri = hot ? 1e6 : near ? 1e5 : big ? 1e4 + papersIn(st.n.papers).length : fade * 1000;
          cands.push({ st, s, pri, hot, big, opacity: hot || near ? 1 : big ? Math.max(0.55, Math.min(1, 1.25 - s.dist / 1600)) : fade });
        });
        cands.sort((a, b) => b.pri - a.pri);
        // At most 16 labels for nearby stars, nearest first, on top of the always-on ones.
        let nearShown = 0;
        cands.forEach((c) => {
          const nearOnly = c.pri < 1e4;
          if (nearOnly && nearShown >= 16) return;
          const x0 = c.s.x + Math.max(4, c.s.px) + 4, y0 = c.s.y - 9;
          const box = { x0, y0, x1: x0 + c.st.labelW, y1: y0 + 18 };
          if (!c.hot && boxes.some((b) => b.x0 < box.x1 && b.x1 > box.x0 && b.y0 < box.y1 && b.y1 > box.y0)) return;
          boxes.push(box);
          if (nearOnly) nearShown += 1;
          c.st.show = true;
          c.st.el.style.transform = `translate(${x0.toFixed(1)}px, ${y0.toFixed(1)}px)`;
          c.st.el.style.opacity = c.opacity.toFixed(2);
          c.st.el.className = `nl${c.big ? " big" : ""}${c.hot ? " hot" : ""}`;
        });
        net.stars.forEach((st) => { st.el.style.display = st.show ? "flex" : "none"; });
      }

      const easeInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
      function netTick(now) {
        if (state.view !== "field" || net.dim !== "3d") { net.running = false; return; }
        if (net.fly) {
          const f = net.fly;
          const k = f.dur ? Math.min(1, (now - f.t0) / f.dur) : 1;
          const e = easeInOut(k);
          net.camera.position.lerpVectors(f.fromPos, f.toPos, e);
          net.controls.target.lerpVectors(f.fromTarget, f.toTarget, e);
          if (k >= 1) {
            net.fly = null;
            if (f.then) setTimeout(f.then, 180);
          }
        }
        net.controls.update();
        net.renderer.render(net.scene, net.camera);
        placeNetLabels();
        requestAnimationFrame(netTick);
      }

      function setSpin(on) {
        if (!net.controls) return;
        net.controls.autoRotate = on;
        $("net-spin").textContent = on ? "Pause rotation" : "Rotate";
      }

      function renderNetLegend() {
        const looseShown = [...net.stars.values()].filter((st) => st.visible && !(adjacency.get(st.n.id) || []).length).length;
        $("net3d-legend").innerHTML = `
          <div class="types">${nodeTypes.filter((t) => state.types.has(t)).map((t) => `<span>${dot(t)}${esc(typeOf(t).plural)}</span>`).join("")}</div>
          <div><b>Color</b> = type · <b>Size</b> = papers${scopeActive() ? " in view" : ""}</div>
          <div><b>Distance</b> = closer stars share a bigger share of their papers (approximate)</div>
          <div><b>Lines</b> = shared papers, brighter = more. Hover a star to light up its own.</div>
          ${looseShown ? `<div><b>Outer shell</b> = ${looseShown} concepts with no shared-paper links</div>` : ""}
          <div class="how">Drag to rotate · scroll to zoom toward the pointer · right-drag to pan · click a star to fly in</div>`;
      }

      // Switches the full network between the 3D space and the original 2D graph.
      async function setNetDim(dim) {
        net.dim = dim;
        try { localStorage.setItem("atlas-net-dim", dim); } catch { /* preference only */ }
        document.querySelectorAll("#net-tools [data-dim]").forEach((b) => b.classList.toggle("on", b.dataset.dim === dim));
        const is3d = dim === "3d";
        $("field").style.display = is3d ? "none" : "";
        $("field-legend").hidden = is3d;
        $("net3d").hidden = !is3d;
        $("net-reset").hidden = $("net-spin").hidden = !is3d;
        hideTip();
        if (!is3d || state.view !== "field") return;
        if (!net.scene) {
          const note = $("net-note");
          note.textContent = "Placing 228 stars…";
          note.hidden = false;
          try {
            net.loading = net.loading || buildNet3D();
            await net.loading;
            note.hidden = true;
          } catch (error) {
            console.error(error);
            note.textContent = `${error.message || "3D couldn't start."} Showing the 2D view.`;
            setTimeout(() => { note.hidden = true; }, 6000);
            net.loading = null;
            setNetDim("2d");
            return;
          }
        }
        net.applyFilters();
        if (!net.running && state.view === "field" && net.dim === "3d") {
          net.running = true;
          requestAnimationFrame(netTick);
        }
      }
      $("net-tools").addEventListener("click", (event) => {
        const b = event.target.closest("[data-dim]");
        if (b) setNetDim(b.dataset.dim);
      });
      $("net-reset").addEventListener("click", () => net.reset && net.reset());
      $("net-overview").addEventListener("click", goOverview);
      $("net-spin").addEventListener("click", () => setSpin(!net.controls?.autoRotate));

      // ---------- Landing: a few landmarks instead of the whole network ----------
      const LANDMARKS = 5;
      const RECENT_FROM = Y1 - 9;

      // Papers per year as a tiny area line, for the rising cards.
      function sparkline(papers, color) {
        const years = d3.range(Y0, Y1 + 1);
        const counts = d3.rollup(papers, (v) => v.length, (p) => p.year);
        const vals = years.map((y) => counts.get(y) || 0);
        const max = d3.max(vals) || 1;
        const W = 200, H = 26;
        const x = (i) => (i / (years.length - 1)) * W, y = (v) => H - 1 - (v / max) * (H - 3);
        const line = vals.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
        const cut = x(RECENT_FROM - Y0);
        return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
          <rect x="${cut}" y="0" width="${W - cut}" height="${H}" fill="rgba(255,255,255,0.04)"/>
          <path d="${line}L${W},${H}L0,${H}Z" fill="${color}" fill-opacity="0.18"/>
          <path d="${line}" fill="none" stroke="${color}" stroke-width="1.4"/>
        </svg>`;
      }

      // Concepts whose recent share of papers is well above the field's: at least 8 papers in view,
      // and most of them from the last ten years.
      function risingConcepts() {
        const all = papersIn([...paperById.values()]);
        const fieldShare = all.length ? all.filter((p) => p.year >= RECENT_FROM).length / all.length : 0;
        return nodes.filter((n) => conceptOn(n) && !state.pins.includes(n.id)).map((n) => {
          const ps = papersOf(n);
          const recent = ps.filter((p) => p.year >= RECENT_FROM).length;
          return { node: n, n: ps.length, recent, share: ps.length ? recent / ps.length : 0 };
        }).filter((d) => d.n >= 8 && d.share >= Math.min(0.95, fieldShare + 0.2))
          .sort((a, b) => b.share - a.share || b.n - a.n)
          .slice(0, 6)
          .map((d) => ({ ...d, fieldShare }));
      }

      function topConnections() {
        return links
          .filter((l) => conceptOn(byId.get(l.a)) && conceptOn(byId.get(l.b)) && !state.pins.includes(l.a) && !state.pins.includes(l.b))
          .map((l) => ({ l, n: papersIn(l.papers).length }))
          .filter((d) => d.n > 0)
          .sort((a, b) => b.n - a.n)
          .slice(0, 6);
      }

      function renderLanding() {
        const inView = scopeCount();
        const typeCards = nodeTypes.filter((t) => state.types.has(t)).map((t) => {
          const list = nodes.filter((n) => n.type === t && conceptOn(n) && !state.pins.includes(n.id))
            .map((n) => ({ n, c: papersOf(n).length }))
            .filter((d) => d.c > 0)
            .sort((a, b) => b.c - a.c || a.n.label.localeCompare(b.n.label));
          const open = state.landingOpen.has(t);

              <span class="name">${esc(cap(d.n.label))}</span><span class="num">${d.c}</span>
              <span class="bar"><i style="width:${(d.c / max) * 100}%"></i></span>

          return `<div class="type-card" style="--c:${colorOf(t)}">
            <h3>${esc(typeOf(t).plural)} <span class="n">${list.length}</span></h3>
            <p class="def">${esc(definitionOf(t))}</p>
            <div class="${open ? "all-list" : ""}">${shown.map(row).join("") || `<div class="empty-note">None match your filters.</div>`}</div>
            ${list.length > LANDMARKS ? `<button type="button" class="link-btn more" data-more="${esc(t)}">${open ? "Show top 5" : `See all ${list.length}`}</button>` : ""}
          </div>`;
        }).join("");

        const rising = risingConcepts();
        const pairs = topConnections();
        $("landing-view").innerHTML = `<div class="landing">
          <div class="hero">
            <div>
              <p class="kicker">Design Engineering Atlas</p>
              <h1>What has design research studied, and what goes together?</h1>
              <p>A map of <strong>${totalPapers} empirical papers</strong> from the ASME Design Theory and Methodology conference, ${Y0}–${Y1}. Each paper is tagged with the <strong>subjects</strong> it observed, the <strong>tasks</strong> they did, the <strong>problems</strong> they worked on and the <strong>cognitive constructs</strong> it measured. Start from a landmark below, or search.</p>
            </div>
            <div class="hero-side">
              <div class="hero-search">
                <input type="text" id="hero-search" placeholder="Search a concept, e.g. fixation" autocomplete="off" />
                <div class="pin-results" id="hero-results" hidden></div>
              </div>
              <button type="button" class="see-network" data-network="1">← Back to the network</button>
            </div>
          </div>

          ${EX ? `<div class="preview-note">${exampleBadge("Atlas 2 preview")}<span>Some panels (findings, evidence, study cards and the Paper / Study / Measurement / Claim filters) are filled with <strong>${EX.papers.length} made-up example papers</strong> so you can try the Atlas 2 design. They always sit in a dashed amber frame like this one, and never change the real counts. Try <button type="button" class="link-btn" data-open="8238" style="font-size:13px">cognitive fixation</button>.</span></div>` : ""}

          ${!inView ? `<div class="gap-box land-gap"><strong>0 papers: possible gap</strong><p>No paper covers every concept you pinned${rangeActive() ? ` in ${rangeText()}` : ""}. Open Filters to see the closest combinations that do.</p></div>` : ""}

          <section class="land-section">
            <h2>Landmarks</h2>
            <p class="sub">The most studied concepts of each type${scopeActive() ? `, counting the ${inView} papers that match your filters` : ""}. Bars show papers.</p>
            <div class="type-grid">${typeCards}</div>
          </section>

          ${rising.length ? `<section class="land-section">
            <h2>Rising</h2>
            <p class="sub">Most of their papers are from ${RECENT_FROM}–${Y1}; across ${scopeActive() ? "the papers in view" : "the whole Atlas"} that share is ${Math.round(rising[0].fieldShare * 100)}%.</p>
            <div class="rise-grid">${rising.map((d) => `
              <button type="button" class="rise-card" data-open="${esc(d.node.id)}">
                <span class="top">${dot(d.node.type)}${esc(cap(d.node.label))}</span>
                <div class="meta"><strong>${Math.round(d.share * 100)}%</strong> of its ${d.n} papers since ${RECENT_FROM}</div>
                ${sparkline(papersOf(d.node), colorOf(d.node.type))}
              </button>`).join("")}</div>
          </section>` : ""}

          ${pairs.length ? `<section class="land-section">
            <h2>Most studied together</h2>
            <p class="sub">The pairs of concepts that share the most papers. Open one to see why they're connected.</p>
            <div class="pair-grid">${pairs.map(({ l, n }) => {
              const A = byId.get(l.a), B = byId.get(l.b);
              return `<button type="button" class="pair-card" data-pair="${esc(l.a)}|${esc(l.b)}">
                <span class="names">${dot(A.type)}${esc(cap(A.label))}<span class="arrow">↔</span>${dot(B.type)}${esc(cap(B.label))}</span>
                <div class="s">${esc(cap(connectionSentence(A, B, n)))}.</div>
              </button>`;
            }).join("")}</div>
          </section>` : ""}
        </div>`;
      }

      $("landing-view").addEventListener("click", (event) => {
        const el = event.target.closest("[data-open],[data-more],[data-pair],[data-network],.search-item[data-id]");
        if (!el) return;
        if (el.dataset.id) openConcept(el.dataset.id);
        else if (el.dataset.open) openConcept(el.dataset.open);
        else if (el.dataset.pair) { const [a, b] = el.dataset.pair.split("|"); navigate(conceptHash(a, b)); }
        else if (el.dataset.network) goField();
        else if (el.dataset.more) {
          const t = el.dataset.more;
          if (state.landingOpen.has(t)) state.landingOpen.delete(t); else state.landingOpen.add(t);
          renderLanding();
        }
      });
      // The landing's own search box, with the same matching as the top bar.
      function heroMatches(q) {
        const lower = q.toLowerCase();
        return nodes.filter((n) => fuzzyMatch(n.label, q))
          .sort((a, b) => ((b.label.toLowerCase().includes(lower)) - (a.label.toLowerCase().includes(lower))) || b.paperCount - a.paperCount)
          .slice(0, 7);
      }
      $("landing-view").addEventListener("input", (event) => {
        if (event.target.id !== "hero-search") return;
        const q = event.target.value.trim();
        const matches = q ? heroMatches(q) : [];
        $("hero-results").hidden = !matches.length;
        $("hero-results").innerHTML = matches.map((n) => `<div class="search-item" data-id="${esc(n.id)}"><span>${dot(n.type)} ${esc(cap(n.label))}</span><span class="t">${esc(typeWord(n.type))}</span></div>`).join("");
      });
      $("landing-view").addEventListener("keydown", (event) => {
        if (event.target.id !== "hero-search" || event.key !== "Enter") return;
        const q = event.target.value.trim();
        const first = q && heroMatches(q)[0];
        if (first) openConcept(first.id);
      });

      function showLanding() {
        state.view = "landing";
        state.center = null;
        hideTip();
        $("concept-view").hidden = true;
        $("field-view").hidden = true;
        $("landing-view").hidden = false;
        renderCrumbs();
        renderLanding();
      }

      // ---------- Concept view: shared data ----------
      const byRelevance = (a, b) => b.j - a.j || b.shared - a.shared || a.node.label.localeCompare(b.node.label);

      // Every neighbor of the current concept, with counts and relevance limited to the selected year range.
      function neighborData() {
        const center = byId.get(state.center);
        const centerCount = papersOf(center).length;
        return (adjacency.get(center.id) || []).map(({ id, link }) => {
          const node = byId.get(id);
          const sharedPapers = papersIn(link.papers);
          const shared = sharedPapers.length;
          const total = papersOf(node).length;
          const { lift } = liftOf(shared, centerCount, total);
          return { node, link, sharedPapers, shared, total, lift, either: centerCount + total - shared, j: shared ? shared / (centerCount + total - shared) : 0 };
        }).filter((d) => d.shared > 0);
      }
      // Pinned concepts are left out: every paper in view covers them, so they'd only add noise.
      const visibleNeighbors = () => neighborData().filter((d) => state.showTypes.has(d.node.type) && conceptOn(d.node) && !state.pins.includes(d.node.id));
      const selectedLink = () => (state.connection ? linkByPair.get(pairKey(state.center, state.connection)) : null);

      // Real papers have numeric ids; example papers (atlas2_example.json) have ids like "ex3".
      const isExampleId = (id) => typeof id === "string" && /^ex\d+$/.test(id);
      const getPaper = (id) => (isExampleId(id) ? EX?.paperById.get(id) || null : paperById.get(id) || null);
      const conceptIdsOfPaper = (p) => (p.isExample ? p.concepts : conceptsByPaper.get(p.paper_id) || []);
      function currentPaper() {
        return state.tab === "papers" && state.paper != null ? getPaper(state.paper) : null;
      }

      // Atlas › Concept › ↔ Connection › Paper; every step but the last is a link back to that level.
      function renderCrumbs() {
        const steps = [];
        if (state.view === "landing") steps.push({ html: "Overview", hash: null, title: "Landmarks of the Atlas" });
        if (state.view === "concept") {
          const center = byId.get(state.center);
          steps.push({ html: `${dot(center.type)}${esc(cap(center.label))}`, hash: conceptHash(center.id), title: cap(center.label) });
          if (state.connection) {
            const nb = byId.get(state.connection);
            steps.push({ html: `↔ ${dot(nb.type)}${esc(cap(nb.label))}`, hash: conceptHash(center.id, nb.id), title: `Connection with ${cap(nb.label)}` });
          }
          if (state.paper != null) {
            const p = getPaper(state.paper);
            steps.push({ html: `${p.isExample ? "Example paper" : "Paper"}: ${esc(trunc(paperTitle(p), 38))}`, hash: null, title: paperTitle(p) });
          }
        }
        $("crumb-trail").innerHTML = steps.map((s, i) => {
          const here = i === steps.length - 1;
          return `<span class="crumb-sep">›</span><button type="button" class="crumb ${here ? "here" : ""}" ${here ? "aria-current=\"page\"" : `data-hash="${esc(s.hash)}"`} title="${esc(s.title)}">${s.html}</button>`;
        }).join("");
      }
      $("crumb-trail").addEventListener("click", (event) => {
        const el = event.target.closest("[data-hash]");
        if (el) navigate(el.dataset.hash);
      });

      // ---------- Concept view: orbit ----------
      const orbitSvg = d3.select("#orbit");
      const orbitRoot = orbitSvg.append("g");
      const wedgeG = orbitRoot.append("g");
      const ringG = orbitRoot.append("g");
      const wedgeArc = d3.arc().innerRadius(WEDGE_IN).outerRadius(WEDGE_OUT).cornerRadius(18);
      // d3.arc measures angles clockwise from 12 o'clock; the layout measures them from 3 o'clock.
      const arcAngles = (g) => ({ startAngle: g.start + Math.PI / 2, endAngle: g.end + Math.PI / 2 });
      const spokeG = orbitRoot.append("g");
      const findingG = orbitRoot.append("g");
      const orbitNodeG = orbitRoot.append("g");
      const splitG = orbitRoot.append("g");
      const centerG = orbitRoot.append("g").attr("class", "center-node");
      const labelG = orbitRoot.append("g");
      const sectorLabelG = orbitRoot.append("g");
      const ringLabelG = orbitRoot.append("g");
      const orbitZoom = d3.zoom().scaleExtent([0.5, 5]).on("zoom", (event) => orbitRoot.attr("transform", event.transform));
      orbitSvg.call(orbitZoom).on("dblclick.zoom", null);
      orbitSvg.on("click", () => { if (state.connection || state.paper != null) clearConnection(); });

      ringG.selectAll("circle").data(RINGS).join("circle").attr("class", "ring").attr("r", (r) => r);
      ringLabelG.selectAll("text").data(RINGS).join("text")
        .attr("class", "ring-label")
        .attr("text-anchor", "middle")
        .attr("y", (r) => -r + 3.5)
        .text((r, i) => RING_NAMES[i]);
      const centerCircle = centerG.append("circle").attr("stroke", "#ffffff").attr("stroke-width", 2.5).style("filter", "drop-shadow(0 0 10px rgba(255,255,255,0.35))");
      const centerLabel = labelG.append("text").attr("class", "name center-name").attr("text-anchor", "middle");

      let orbit = { center: null, shown: [], inPaper: null, typedCount: 0, box: null, unit: 0, vb: { x0: -OR_R, x1: OR_R, y0: -OR_R, y1: OR_R } };

      // Match the viewBox to the panel's shape so labels can use the extra width or height.
      // When the compare tray is showing, the orbit is fitted into the space below it.
      function fitOrbitViewBox(animate) {
        const el = $("orbit-wrap");
        const w = el.clientWidth, h = el.clientHeight;
        if (!w || !h) return false;
        const tray = $("compare-tray");
        const top = tray.hidden ? 0 : tray.offsetHeight + 16;
        const h2 = Math.max(160, h - top);
        const vw = 2 * OR_R * Math.max(1, w / h2), vh = 2 * OR_R * Math.max(1, h2 / w);
        const unit = vw / w;
        const box = [-vw / 2, -vh / 2 - top * unit, vw, vh + top * unit];
        if (animate && !REDUCED_MOTION && orbit.box) {
          orbitSvg.transition("viewbox").duration(450).ease(d3.easeCubicOut).attrTween("viewBox", () => {
            const interp = d3.interpolate(orbit.box, box);
            return (k) => interp(k).join(" ");
          });
        } else {
          orbitSvg.interrupt("viewbox").attr("viewBox", box.join(" "));
        }
        const changed = JSON.stringify(box) !== JSON.stringify(orbit.box);
        orbit.box = box;
        orbit.unit = unit;
        orbit.vb = { x0: -vw / 2 + 6, x1: vw / 2 - 6, y0: -vh / 2 + 6, y1: vh / 2 - 6 };
        return changed;
      }
      new ResizeObserver(() => {
        if (fitOrbitViewBox(false) && state.view === "concept") updateOrbit(0);
      }).observe($("orbit-wrap"));

      // Types get their own slice of the circle (with a gap at the top for the ring names);
      // each neighbor sits on the ring for its relevance rank.
      function layoutOrbit(shown) {
        const groups = nodeTypes.map((type) => ({ type, items: shown.filter((d) => d.node.type === type) })).filter((g) => g.items.length);
