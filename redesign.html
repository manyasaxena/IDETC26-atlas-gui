<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atlas Redesign</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0d0e12;
      --surface: #15171e;
      --surface-2: #1b1e27;
      --surface-3: #232735;
      --line: rgba(255, 255, 255, 0.07);
      --line-strong: rgba(255, 255, 255, 0.14);
      --text: #eceff4;
      --muted: #9aa2b2;
      --faint: #6b7282;
      --bar: #4a5061;
      --accent: #8bc5ff;
      --subject: #4fc3f7;
      --task: #81c784;
      --problem: #ffb74d;
      --construct: #ce93d8;
      --r-xl: 28px;
      --r-lg: 22px;
      --r-md: 16px;
      --r-sm: 12px;
      --shadow: 0 22px 48px -22px rgba(0, 0, 0, 0.75), 0 2px 10px rgba(0, 0, 0, 0.25);
      --shadow-soft: 0 10px 26px -14px rgba(0, 0, 0, 0.6);
      --ease: cubic-bezier(0.22, 0.8, 0.24, 1);
      --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      --sans: "IBM Plex Sans", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 14px;
      overflow: hidden;
    }
    button { font: inherit; color: inherit; }
    select {
      font: 12px var(--mono);
      color: var(--text);
      background: var(--surface-3);
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      padding: 5px 10px;
      outline: none;
      cursor: pointer;
    }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pop { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: none; } }
    @keyframes slideFromLeft { from { opacity: 0; transform: translateX(-24px) scale(0.98); } to { opacity: 1; transform: none; } }
    @keyframes slideFromRight { from { opacity: 0; transform: translateX(24px) scale(0.98); } to { opacity: 1; transform: none; } }

    #app {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-rows: 62px 1fr;
    }

    /* ---------- Top bar ---------- */
    .topbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 16px;
      font-family: var(--mono);
      font-size: 12px;
      min-width: 0;
    }
    .crumbs {
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      min-width: 0;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 14px;
      box-shadow: var(--shadow-soft);
    }
    .crumbs button {
      background: none;
      border: none;
      padding: 0;
      color: var(--text);
      font-weight: 600;
      cursor: pointer;
    }
    .crumbs button:hover { color: var(--accent); }
    #crumb-node { overflow: hidden; text-overflow: ellipsis; max-width: 240px; }
    #crumb-node:empty { display: none; }

    .search-wrap { position: relative; width: 240px; flex: 0 0 auto; }
    #search-input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      color: var(--text);
      padding: 9px 16px;
      font: 12px var(--mono);
      outline: none;
      box-shadow: var(--shadow-soft);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    #search-input:focus { border-color: var(--line-strong); box-shadow: 0 0 0 4px rgba(139, 197, 255, 0.12); }
    #search-results {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      background: var(--surface-2);
      border: 1px solid var(--line-strong);
      border-radius: var(--r-md);
      padding: 6px;
      z-index: 40;
      box-shadow: var(--shadow);
      animation: pop 0.18s var(--ease);
      transform-origin: top center;
    }
    .search-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 999px;
      cursor: pointer;
    }
    .search-item:hover, .search-item.active { background: var(--surface-3); }
    .search-item .t { color: var(--faint); text-transform: capitalize; }

    .field-controls { display: flex; align-items: center; gap: 6px; flex-wrap: nowrap; }
    .filter-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 999px;
      padding: 7px 12px;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      box-shadow: var(--shadow-soft);
      transition: opacity 0.2s, transform 0.15s var(--ease);
    }
    .filter-pill:active { transform: scale(0.96); }
    .filter-pill.off { opacity: 0.35; }
    .filter-pill .n { color: var(--faint); }
    #temporal-toggle {
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 999px;
      padding: 7px 14px;
      cursor: pointer;
      letter-spacing: 0.4px;
      white-space: nowrap;
      box-shadow: var(--shadow-soft);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    #temporal-toggle.active { border-color: var(--subject); box-shadow: 0 0 0 3px rgba(79, 195, 247, 0.18); }
    .spacer { flex: 1; }
    #help-btn {
      width: 36px;
      height: 36px;
      flex: 0 0 auto;
      border-radius: 50%;
      border: 1px solid var(--line-strong);
      background: var(--surface);
      font-weight: 600;
      cursor: pointer;
      box-shadow: var(--shadow-soft);
      transition: transform 0.15s var(--ease), border-color 0.2s;
    }
    #help-btn:hover { border-color: var(--muted); transform: scale(1.06); }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      display: inline-block;
      flex: 0 0 auto;
    }

    main { min-height: 0; position: relative; }

    /* ---------- Field view ---------- */
    #field-view { position: absolute; inset: 0; animation: fadeIn 0.35s var(--ease); }
    #field { width: 100%; height: 100%; display: block; cursor: grab; }
    #field:active { cursor: grabbing; }
    .field-legend {
      position: absolute;
      left: 16px;
      bottom: 16px;
      background: rgba(21, 23, 30, 0.92);
      border: 1px solid var(--line);
      border-radius: var(--r-lg);
      padding: 12px 16px;
      font: 12px var(--mono);
      color: var(--muted);
      display: grid;
      gap: 5px;
      box-shadow: var(--shadow);
    }
    .field-legend .row { display: flex; align-items: center; gap: 8px; }
    .field-legend .hint { color: var(--faint); margin-top: 4px; }
    .temporal-bar {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: 16px;
      width: min(600px, calc(100% - 360px));
      background: rgba(21, 23, 30, 0.95);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      font: 12px var(--mono);
      color: var(--muted);
      box-shadow: var(--shadow);
      animation: fadeUp 0.25s var(--ease);
    }
    #year-slider { flex: 1; accent-color: var(--subject); }
    #year-label { color: var(--text); font-weight: 600; }

    /* ---------- Concept view ---------- */
    #concept-view {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: 290px minmax(0, 1fr) 372px;
      gap: 12px;
      padding: 0 14px 14px;
    }
    #concept-view.enter .left { animation: slideFromLeft 0.5s var(--ease); }
    #concept-view.enter .right { animation: slideFromRight 0.5s var(--ease); }
    #concept-view.enter .orbit-wrap { animation: fadeIn 0.6s var(--ease); }
    .bubble-panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r-xl);
      box-shadow: var(--shadow);
      min-height: 0;
    }
    .left { overflow-y: auto; padding: 14px; }
    .pane { display: flex; flex-direction: column; gap: 12px; }
    .swap { animation: fadeUp 0.32s var(--ease); }
    .back-link {
      align-self: flex-start;
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 12px;
      color: var(--muted);
      font: 12px var(--mono);
      cursor: pointer;
      transition: color 0.2s, background 0.2s, transform 0.15s var(--ease);
    }
    .back-link:hover { color: var(--text); background: var(--surface-3); }
    .back-link:active { transform: scale(0.96); }
    .card {
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: var(--r-lg);
      padding: 16px;
    }
    .concept-name {
      margin: 0 0 10px;
      font-size: 22px;
      line-height: 1.15;
      font-weight: 700;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: 999px;
      font: 600 11px var(--mono);
      color: #0a0b0f;
      text-transform: capitalize;
    }
    .label {
      font: 500 11px var(--mono);
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin: 0 0 8px;
    }
    .definition { margin: 12px 0 0; line-height: 1.5; color: #cfd5e0; }
    .definition.empty { color: var(--faint); font-style: italic; }
    .stats { margin: 12px 0 0; font: 12px var(--mono); color: var(--muted); line-height: 1.55; }
    .stats strong { color: var(--text); font-weight: 600; }

    .card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .range-text {
      font: 600 12px var(--mono);
      color: var(--text);
      background: var(--surface-3);
      border-radius: 999px;
      padding: 3px 10px;
      transition: background 0.2s;
    }
    .range-text.active { background: rgba(139, 197, 255, 0.18); color: #d8ebff; }
    .chart-wrap { padding: 0 8px; }
    .year-chart { width: 100%; height: 64px; display: block; }
    .year-chart g { transition: opacity 0.2s; }
    .year-chart g.out { opacity: 0.18; }
    .range-slider { position: relative; height: 24px; margin-top: 4px; }
    .range-slider .track {
      position: absolute;
      top: 10px;
      left: 8px;
      right: 8px;
      height: 4px;
      border-radius: 999px;
      background: var(--surface-3);
    }
    .range-slider .fill {
      position: absolute;
      top: 0;
      bottom: 0;
      border-radius: 999px;
      background: var(--accent);
    }
    .range-slider input {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 24px;
      margin: 0;
      background: none;
      pointer-events: none;
      -webkit-appearance: none;
      appearance: none;
    }
    .range-slider input::-webkit-slider-runnable-track { background: none; height: 24px; }
    .range-slider input::-moz-range-track { background: none; }
    .range-slider input::-webkit-slider-thumb {
      -webkit-appearance: none;
      pointer-events: auto;
      width: 16px;
      height: 16px;
      margin-top: 4px;
      border-radius: 50%;
      background: #fff;
      border: 3px solid var(--accent);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
      cursor: grab;
      transition: transform 0.15s var(--ease);
    }
    .range-slider input::-webkit-slider-thumb:hover { transform: scale(1.15); }
    .range-slider input:active::-webkit-slider-thumb { cursor: grabbing; transform: scale(1.2); }
    .range-slider input::-moz-range-thumb {
      pointer-events: auto;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #fff;
      border: 3px solid var(--accent);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
      cursor: grab;
    }
    .year-axis {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font: 11px var(--mono);
      color: var(--faint);
      margin-top: 2px;
      padding: 0 2px;
    }
    .link-btn {
      background: none;
      border: none;
      padding: 0;
      color: var(--accent);
      font: 11px var(--mono);
      cursor: pointer;
    }
    .link-btn:hover { text-decoration: underline; text-underline-offset: 2px; }
    .chart-key { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px; font: 11px var(--mono); color: var(--muted); }
    .chart-key i { width: 9px; height: 9px; display: inline-block; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
    .filters { display: grid; gap: 4px; }
    .filters label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      padding: 5px 8px;
      border-radius: 999px;
      transition: background 0.2s, opacity 0.2s;
    }
    .filters label:hover { background: var(--surface-3); }
    .filters label.zero { opacity: 0.35; cursor: not-allowed; }
    .filters label.zero:hover { background: none; }
    .filters input { margin: 0; accent-color: #8a93a6; }
    .filters .n { color: var(--faint); font-family: var(--mono); font-size: 12px; }
    .divider { border: none; border-top: 1px solid var(--line); margin: 16px 0 14px; }

    .orbit-wrap { position: relative; min-width: 0; min-height: 0; overflow: hidden; border-radius: var(--r-xl); }
    #orbit { width: 100%; height: 100%; display: block; cursor: grab; }
    #orbit:active { cursor: grabbing; }
    #orbit .ring { fill: none; stroke: #343947; stroke-dasharray: 5 7; }
    #orbit .ring-label {
      fill: var(--muted);
      font: 500 10px var(--mono);
      letter-spacing: 0.4px;
      paint-order: stroke;
      stroke: var(--bg);
      stroke-width: 5px;
    }
    #orbit .wedge { fill-opacity: 0.05; stroke-opacity: 0.22; stroke-width: 1; }
    #orbit .sector-label {
      font: 600 11px var(--mono);
      letter-spacing: 0.8px;
      text-transform: uppercase;
      paint-order: stroke;
      stroke: var(--bg);
      stroke-width: 4px;
    }
    #orbit .spoke {
      stroke: #5a6070;
      stroke-opacity: 0.35;
      stroke-width: 1;
      stroke-linecap: round;
      transition: stroke 0.3s, stroke-opacity 0.3s, stroke-width 0.3s;
    }
    #orbit .spoke.lit { stroke-opacity: 0.75; }
    #orbit .spoke.faded { stroke-opacity: 0.06; }
    #orbit .spoke.sel { stroke-opacity: 1; stroke-width: 3.5; }
    #orbit .onode { cursor: pointer; }
    #orbit .hit { fill: transparent; }
    #orbit .onode .fill { stroke: #11131a; stroke-width: 1; transition: opacity 0.3s, stroke 0.2s, stroke-width 0.2s; }
    #orbit .onode.faded .fill { opacity: 0.12; }
    #orbit .onode.hov .fill { stroke: #fff; stroke-width: 2; }
    #orbit .onode.sel .fill { stroke: #fff; stroke-width: 2.5; }
    #orbit .center-node { transition: opacity 0.3s; }
    #orbit .center-node.faded { opacity: 0.3; }
    #orbit text.name {
      font: 12px var(--mono);
      fill: var(--text);
      paint-order: stroke;
      stroke: var(--bg);
      stroke-width: 4px;
      pointer-events: none;
    }
    #orbit text.nb-name { opacity: 0; transition: opacity 0.25s; }
    #orbit text.nb-name.show { opacity: 1; }
    #orbit text.center-name { font-weight: 600; font-size: 14px; }
    .orbit-legend {
      position: absolute;
      left: 12px;
      bottom: 12px;
      background: rgba(21, 23, 30, 0.94);
      border: 1px solid var(--line);
      border-radius: var(--r-lg);
      padding: 12px 14px;
      font: 11.5px var(--mono);
      color: var(--muted);
      display: grid;
      gap: 7px;
      max-width: 300px;
      box-shadow: var(--shadow);
    }
    .orbit-legend .row { display: flex; align-items: center; gap: 8px; }
    .orbit-legend svg { flex: 0 0 auto; }
    .legend-more { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
    .legend-more span { margin-right: 4px; color: var(--text); }
    .pill-btn {
      border: 1px solid var(--line-strong);
      background: var(--surface-3);
      color: var(--text);
      border-radius: 999px;
      padding: 4px 11px;
      font: 11.5px var(--mono);
      cursor: pointer;
      transition: background 0.2s, transform 0.15s var(--ease);
    }
    .pill-btn:hover { background: #2c3142; }
    .pill-btn:active { transform: scale(0.95); }
    .orbit-top {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }
    .orbit-top > * { pointer-events: auto; }
    .compare-tray { display: flex; flex-direction: column; gap: 6px; align-self: flex-start; max-width: 100%; }
    .cmp-cards { display: flex; gap: 8px; flex-wrap: wrap; }
    .cmp-card {
      width: 184px;
      background: rgba(27, 30, 39, 0.96);
      border: 1px solid var(--line-strong);
      border-radius: 20px;
      padding: 10px 12px 9px;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: transform 0.2s var(--ease), border-color 0.2s, opacity 0.18s, scale 0.18s;
    }
    .cmp-card:hover { transform: translateY(-2px); border-color: rgba(255, 255, 255, 0.24); }
    .cmp-card.pop { animation: pop 0.3s var(--ease); }
    .cmp-card.leaving { opacity: 0; scale: 0.9; }
    .cmp-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .cmp-num {
      display: inline-grid;
      place-items: center;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--surface-3);
      font: 600 10.5px var(--mono);
      color: var(--muted);
    }
    .cmp-x {
      width: 22px;
      height: 22px;
      border: none;
      border-radius: 50%;
      background: var(--surface-3);
      color: var(--muted);
      line-height: 1;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, transform 0.15s var(--ease);
    }
    .cmp-x:hover { background: #343a4c; color: var(--text); transform: scale(1.08); }
    .cmp-pair { font-size: 12.5px; line-height: 1.35; font-weight: 600; }
    .cmp-pair .dot { width: 7px; height: 7px; margin-right: 4px; vertical-align: 1px; }
    .cmp-pair .arrow { display: block; color: var(--muted); font-weight: 400; font-size: 11px; margin: 1px 0; }
    .cmp-stats { font: 11px var(--mono); color: var(--muted); margin-top: 7px; }
    .cmp-stats strong { color: var(--text); font-weight: 600; }
    .cmp-chart { display: block; width: 100%; height: 22px; margin-top: 6px; }
    .cmp-chart rect.out { opacity: 0.2; }
    .cmp-overlap {
      align-self: flex-start;
      font: 11.5px var(--mono);
      color: var(--text);
      background: rgba(21, 23, 30, 0.95);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 13px;
      box-shadow: var(--shadow-soft);
      animation: fadeUp 0.3s var(--ease);
    }
    .cmp-overlap.none { color: var(--muted); }
    .compare-btn {
      border: 1px dashed var(--line-strong);
      background: none;
      color: var(--muted);
      border-radius: 999px;
      padding: 2px 9px;
      font: 11px var(--mono);
      white-space: nowrap;
      cursor: pointer;
      transition: color 0.2s, background 0.2s, border-color 0.2s, transform 0.15s var(--ease);
    }
    .compare-btn:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
    .compare-btn:active:not(:disabled) { transform: scale(0.94); }
    .compare-btn.on { border-style: solid; border-color: rgba(139, 197, 255, 0.6); background: rgba(139, 197, 255, 0.14); color: #d8ebff; }
    .compare-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .compare-btn.big { padding: 8px 14px; font-size: 12px; }
    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .btn-row .btn { margin-top: 0; }
    .conn-side { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
    .orbit-note {
      align-self: center;
      max-width: 100%;
      background: rgba(21, 23, 30, 0.95);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 7px 16px;
      font: 12px var(--mono);
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      box-shadow: var(--shadow-soft);
      animation: fadeUp 0.3s var(--ease);
    }
    .orbit-empty {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, 64px);
      color: var(--faint);
      font: 12px var(--mono);
      background: var(--surface);
      border-radius: 999px;
      padding: 6px 14px;
    }

    .right { display: flex; flex-direction: column; overflow: hidden; }
    .tabs {
      position: relative;
      display: flex;
      gap: 2px;
      margin: 14px 14px 4px;
      padding: 4px;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 999px;
    }
    .tab-indicator {
      position: absolute;
      top: 4px;
      bottom: 4px;
      left: 0;
      border-radius: 999px;
      background: var(--surface-3);
      box-shadow: var(--shadow-soft);
      transition: transform 0.35s var(--ease), width 0.35s var(--ease);
    }
    .tab {
      position: relative;
      flex: 1;
      border: none;
      background: none;
      color: var(--muted);
      border-radius: 999px;
      padding: 8px 12px;
      font: 12px var(--mono);
      cursor: pointer;
      transition: color 0.25s;
    }
    .tab.active { color: var(--text); }
    .right-body { flex: 1; overflow-y: auto; padding: 10px 14px 16px; }
    .right-body .pane { gap: 0; }
    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin: 4px 0 10px;
    }
    .panel-head h2 { margin: 0; font-size: 20px; }
    .panel-head h2 .count { color: var(--muted); font-weight: 400; }
    .sort { display: flex; align-items: center; gap: 6px; font: 11px var(--mono); color: var(--muted); }
    .chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .chip-filter {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--line-strong);
      background: var(--surface-2);
      border-radius: 999px;
      padding: 4px 5px 4px 12px;
      font: 12px var(--mono);
      max-width: 100%;
      animation: pop 0.25s var(--ease);
    }
    .chip-filter span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chip-filter button {
      border: none;
      background: var(--surface-3);
      border-radius: 50%;
      width: 22px;
      height: 22px;
      line-height: 1;
      cursor: pointer;
      flex: 0 0 auto;
      transition: background 0.2s, transform 0.15s var(--ease);
    }
    .chip-filter button:hover { background: #343a4c; transform: scale(1.08); }

    .rows { display: flex; flex-direction: column; gap: 4px; }
    .paper-row, .conn-row, .related {
      display: block;
      width: 100%;
      text-align: left;
      background: transparent;
      border: 1px solid transparent;
      border-radius: var(--r-md);
      padding: 10px 12px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, transform 0.15s var(--ease);
    }
    .paper-row:hover, .conn-row:hover, .related:hover, .conn-row.hovered {

      border-color: var(--line);
    }
    .paper-row:active, .conn-row:active, .related:active { transform: scale(0.985); }
    .rows .pop-in { animation: fadeUp 0.35s var(--ease) both; }
    .p-title { display: block; line-height: 1.35; font-weight: 500; }
    .p-meta { display: block; margin-top: 4px; color: var(--muted); font-size: 12.5px; }
    .p-meta .k { color: var(--faint); font-family: var(--mono); font-size: 11.5px; }
    .conn-row { display: flex; align-items: flex-start; gap: 10px; }
    .conn-row .dot { margin-top: 5px; }
    .conn-row .body { flex: 1; min-width: 0; }
    .conn-row .name { display: block; font-weight: 500; }
    .conn-row .sub { display: block; color: var(--muted); font: 11.5px var(--mono); margin-top: 3px; }
    .conn-row .count {
      font: 12px var(--mono);
      white-space: nowrap;
      color: var(--text);
      background: var(--surface-3);
      border-radius: 999px;
      padding: 2px 9px;
    }
    .load-more {
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      border: 1px dashed var(--line-strong);
      border-radius: 999px;
      background: none;
      color: var(--muted);
      font: 12px var(--mono);
      cursor: pointer;
      transition: color 0.2s, background 0.2s, transform 0.15s var(--ease);
    }
    .load-more:hover { color: var(--text); background: var(--surface-2); }
    .load-more:active { transform: scale(0.98); }
    .empty-note { color: var(--faint); font: 12px var(--mono); padding: 12px 4px; }

    .eyebrow { font: 500 11px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; margin: 16px 0 8px; }
    .detail-card {
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: var(--r-lg);

    }
    .pair { font-size: 19px; font-weight: 700; line-height: 1.3; margin: 0 0 10px; }
    .pair .arrow { display: block; color: var(--muted); font-weight: 400; font-size: 15px; margin: 2px 0; }
    .pair .nb { text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: 5px; }
    .sentence {

    .ref {
      color: var(--text);
      cursor: pointer;

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid #35527a;

      border-radius: 999px;

      font: 12px var(--mono);

    .btn:disabled { border-color: var(--line); background: var(--surface-3); color: var(--faint); cursor: not-allowed; }

    .paper-title { margin: 0 0 10px; font-size: 19px; line-height: 1.3; }
    .byline {
      display: inline-block;

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--line-strong);
      background: var(--surface-2);
      border-radius: 999px;
      padding: 5px 12px;
      font-size: 12.5px;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s var(--ease);
    }
    .chip:hover { background: var(--surface-3); }
    .chip:active { transform: scale(0.95); }
    .chip.current { cursor: default; border-style: dashed; }
    .chip.current:hover { background: var(--surface-2); }
    .placeholder { color: var(--faint); font-style: italic; margin: 0; }
    .related .why { display: block; margin-top: 6px; color: #b9c1cf; font-size: 12.5px; line-height: 1.45; }

    /* ---------- Tooltip & glossary ---------- */
    .tooltip {
      position: fixed;
      pointer-events: none;
      z-index: 60;
      max-width: 300px;
      background: rgba(27, 30, 39, 0.98);
      border: 1px solid var(--line-strong);

      box-shadow: var(--shadow);

    .tooltip.show { animation: pop 0.16s var(--ease); }
    .tooltip .tt-name { font-weight: 700; font-size: 14px; margin-bottom: 6px; }
    .tooltip .tt-def { margin: 8px 0 0; color: #cfd5e0; line-height: 1.45; font-size: 12.5px; }
    .tooltip .tt-meta { margin-top: 8px; font: 11.5px var(--mono); color: var(--muted); line-height: 1.5; }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 80;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(3px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      animation: fadeIn 0.2s var(--ease);
    }
    .modal {
      width: min(560px, 100%);
      max-height: calc(100vh - 32px);
      overflow-y: auto;
      background: var(--surface);
      border: 1px solid var(--line-strong);
      border-radius: var(--r-xl);
      padding: 22px 24px;
      box-shadow: var(--shadow);
      animation: pop 0.28s var(--ease);
    }
    .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .modal-head h2 { margin: 0; font-size: 20px; }
    .modal-close {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--surface-3);
      border: none;
      color: var(--muted);
      font-size: 18px;
      cursor: pointer;
      line-height: 1;
    }
    .modal-close:hover { color: var(--text); }
    .gloss-item {
      display: grid;
      grid-template-columns: 14px 1fr;
      gap: 4px 10px;
      padding: 12px 14px;
      margin-bottom: 6px;
      background: var(--surface-2);
      border-radius: var(--r-md);
    }
    .gloss-item .dot { margin-top: 5px; }
    .gloss-item strong { font-size: 14px; }
    .gloss-item p { grid-column: 2; margin: 0; color: #cfd5e0; line-height: 1.45; }
    .gloss-item .n { color: var(--faint); font: 12px var(--mono); margin-left: 6px; }
    .modal .more { margin-top: 14px; color: #cfd5e0; line-height: 1.55; }
    .modal .more p { margin: 0 0 8px; }

    .error { padding: 24px; color: #ff8a80; font: 13px var(--mono); line-height: 1.6; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="crumbs">
        <button type="button" id="crumb-home">Design Engineering Atlas</button>
        <span id="crumb-node"></span>
      </div>
      <div class="search-wrap">
        <input id="search-input" type="text" placeholder="Search concepts…" autocomplete="off" />
        <div id="search-results" hidden></div>
      </div>
      <div class="field-controls" id="field-controls">
        <div id="type-filters" class="field-controls"></div>
        <button id="temporal-toggle" type="button">TEMPORAL MODE</button>
      </div>
      <div class="spacer"></div>
      <button id="help-btn" type="button" title="Glossary of concept types" aria-label="Open glossary">?</button>
    </header>

    <main>
      <section id="field-view">
        <svg id="field" aria-label="Field view of all concepts"></svg>
        <div class="field-legend" id="field-legend"></div>
        <div class="temporal-bar" id="temporal-bar" hidden>
          <span>Year</span>
          <input id="year-slider" type="range" />
          <span id="year-label"></span>
          <span id="year-counts"></span>
        </div>
      </section>

      <section id="concept-view" hidden>
        <aside class="left bubble-panel" id="left"></aside>
        <div class="orbit-wrap" id="orbit-wrap">
          <svg id="orbit" aria-label="Concepts orbiting the selected concept"></svg>
          <div class="orbit-top">
            <div class="compare-tray" id="compare-tray" hidden></div>
            <div class="orbit-note" id="orbit-note" hidden></div>
          </div>
          <div class="orbit-empty" id="orbit-empty" hidden></div>
          <div class="orbit-legend" id="orbit-legend"></div>
        </div>
        <aside class="right bubble-panel">
          <div class="tabs" id="tabs">
            <span class="tab-indicator" id="tab-indicator"></span>
            <button type="button" class="tab" data-tab="papers"></button>
            <button type="button" class="tab" data-tab="connections"></button>
          </div>
          <div class="right-body" id="right-body"></div>
        </aside>
      </section>
    </main>
  </div>

  <div class="tooltip" id="tooltip" hidden></div>

  <div class="modal-backdrop" id="glossary" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="glossary-title">
      <div class="modal-head">
        <h2 id="glossary-title">Glossary</h2>
        <button type="button" class="modal-close" id="glossary-close" aria-label="Close">×</button>
      </div>
      <div id="glossary-body"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
  <script>
    (async function init() {
      const COLORS = { subject: "#4fc3f7", task: "#81c784", problem: "#ffb74d", construct: "#ce93d8" };
      const TYPES = ["subject", "task", "problem", "construct"];
      const TYPE_ORDER = { subject: 0, task: 1, problem: 2, construct: 3 };
      const TYPE_LABELS = { subject: "Subjects", task: "Tasks", problem: "Problems", construct: "Constructs" };
      const TYPE_DEFS = {
        subject: "Agents whose behavior the study was designed to observe.",
        task: "Activities the subject performs that the study observes.",
        problem: "Design briefs or prompts given to the subject.",
        construct: "Cognitive or psychological phenomena the study illuminates."
      };
      const PAGE = 20;
      const ORBIT_STEP = 24;
      // Orbit geometry, in viewBox units centered on the selected concept.
      const OR_R = 440;
      const RINGS = [112, 198, 284];
      const RING_BAND = 34;
      const RING_NAMES = ["Very related", "Related", "Loosely related"];
      const RING_OFFSET = [0, -0.25, 0.25];
      const WEDGE_IN = 62;
      const WEDGE_OUT = 330;
      const SECTOR_LABEL_R = WEDGE_OUT + 14;
      const TOP_GAP = (40 * Math.PI) / 180;
      const SECTOR_PAD = (5 * Math.PI) / 180;
      const WRAP_AT = 18;
      const CHAR_W = 7.2;
      const LINE_H = 14;
      const REDUCED_MOTION = matchMedia("(prefers-reduced-motion: reduce)").matches;
      const ms = (d) => (REDUCED_MOTION ? 0 : d);

      const $ = (id) => document.getElementById(id);
      const tooltip = $("tooltip");

      // ---------- Load data ----------
      let raw;
      try {
        if (location.protocol === "file:") throw new Error("This page has to be served over http to load graph_data.json.");
        const response = await fetch("./graph_data.json");
        if (!response.ok) throw new Error(`Could not load graph_data.json (HTTP ${response.status}).`);
        raw = await response.json();
      } catch (error) {
        $("app").innerHTML = `<div class="error">${esc(error.message)}<br/>From the project folder run <code>python3 -m http.server 8000</code> and open http://localhost:8000/redesign.html</div>`;
        console.error(error);
        return;
      }

      // ---------- Prepare data ----------
      const nodes = raw.nodes.map((n) => ({
        id: String(n.id),
        label: n.label,
        type: n.type,
        description: (n.description || "").trim(),
        papers: n.papers || [],
        paperCount: (n.papers || []).length,
        firstYear: Number(n.first_year) || null
      }));
      const byId = new Map(nodes.map((n) => [n.id, n]));

      const paperById = new Map();
      const conceptsByPaper = new Map();
      nodes.forEach((n) => {
        n.papers.forEach((p) => {
          paperById.set(p.paper_id, p);
          if (!conceptsByPaper.has(p.paper_id)) conceptsByPaper.set(p.paper_id, []);
          conceptsByPaper.get(p.paper_id).push(n.id);
        });
      });
      conceptsByPaper.forEach((ids) => ids.sort((a, b) => TYPE_ORDER[byId.get(a).type] - TYPE_ORDER[byId.get(b).type] || byId.get(a).label.localeCompare(byId.get(b).label)));

      // Some node pairs appear more than once in the edge list; their paper lists are identical, so keep one.
      // An edge's papers are exactly the papers its two concepts share, so shared counts come from that list.
      const linkByPair = new Map();
      const pairKey = (a, b) => (a < b ? `${a}|${b}` : `${b}|${a}`);
      raw.edges.forEach((e) => {
        const a = String(e.source), b = String(e.target);
        if (!byId.has(a) || !byId.has(b)) return;
        const key = pairKey(a, b);
        if (linkByPair.has(key)) return;
        linkByPair.set(key, { a, b, papers: e.papers || [], shared: (e.papers || []).length });
      });
      const links = [...linkByPair.values()];
      const adjacency = new Map();
      links.forEach((l) => {
        if (!adjacency.has(l.a)) adjacency.set(l.a, []);
        if (!adjacency.has(l.b)) adjacency.set(l.b, []);
        adjacency.get(l.a).push({ id: l.b, link: l });
        adjacency.get(l.b).push({ id: l.a, link: l });
      });

      const [Y0, Y1] = (raw.meta && raw.meta.year_range) || d3.extent([...paperById.values()], (p) => p.year);
      const nodeR = d3.scaleSqrt().domain([0, d3.max(nodes, (n) => n.paperCount)]).range([3, 20]);
      const typeCounts = d3.rollup(nodes, (v) => v.length, (n) => n.type);

      // ---------- State ----------
      const state = {
        view: "field",
        types: new Set(TYPES),
        temporal: false,
        year: Y1,
        center: null,
        tab: "papers",
        connection: null,
        paperStack: [],
        papersSort: "newest",
        papersShown: PAGE,
        connSort: "most",
        connPapersShown: PAGE,
        showTypes: new Set(TYPES),
        orbitLimit: ORBIT_STEP,
        range: [Y0, Y1],
        compare: [],
        pendingConnection: null,
        hover: null
      };
      const MAX_COMPARE = 3;

      // ---------- Helpers ----------
      function esc(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll("\"", "&quot;")
          .replaceAll("'", "&#39;");
      }
      const cap = (s) => (s ? s.charAt(0).toUpperCase() + s.slice(1) : s);
      const trunc = (s, n) => (s.length > n ? `${s.slice(0, n).replace(/\s+\S*$/, "")}…` : s);
      // Long names wrap onto two lines, split at the space that balances them best.
      function wrapLabel(s) {
        if (s.length <= WRAP_AT) return [s];
        let best = null;
        for (let i = s.indexOf(" "); i !== -1; i = s.indexOf(" ", i + 1)) {
          const lines = [s.slice(0, i), s.slice(i + 1)];
          const width = Math.max(lines[0].length, lines[1].length);
          if (!best || width < best.width) best = { lines, width };
        }
        return best ? best.lines : [s];
      }
      const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;
      const pct = d3.format(".1~%");
      const withArticle = (s) => `${/^[aeiou]/i.test(s) ? "an" : "a"} ${s}`;
      function listJoin(items) {
        if (items.length <= 1) return items.join("");
        return `${items.slice(0, -1).join(", ")} and ${items[items.length - 1]}`;
      }
      const badge = (type) => `<span class="badge" style="background:${COLORS[type]}">${esc(type)}</span>`;
      const dot = (type) => `<span class="dot" style="background:${COLORS[type]}"></span>`;

      // Most titles in the data are in all caps; those get title case, everything else is left alone.
      const SMALL_WORDS = new Set("a an and as at but by for from in into nor of on onto or per than the to via vs with within without".split(" "));
      const ACRONYMS = new Map("AI CAD CAE CFD DDC EEG ECG FEA FMEA FMRI FNIRS GPT HCI HRV IOT LLM ML NASA NLP PSS QFD STEM TRIZ UI UX VR AR XR MBSE AHP AUT II III IV".split(" ").map((w) => [w, w]));
      [["LLMS", "LLMs"], ["IOT", "IoT"], ["FMRI", "fMRI"], ["FNIRS", "fNIRS"], ["AIS", "AIs"]].forEach(([k, v]) => ACRONYMS.set(k, v));
      function titleCase(title) {
        const t = (title || "").trim();
        const letters = t.replace(/[^A-Za-z]/g, "");
        if (!letters || letters.replace(/[^A-Z]/g, "").length / letters.length < 0.7) return t;
        let forceCap = true;
        return t.replace(/[A-Za-z0-9][A-Za-z0-9'’]*|[^A-Za-z0-9]+/g, (token) => {
          if (!/[A-Za-z0-9]/.test(token[0])) {
            if (/[:?!—–]/.test(token)) forceCap = true;
            return token;
          }
          const upper = token.toUpperCase();
          const first = forceCap;
          forceCap = false;
          if (ACRONYMS.has(upper)) return ACRONYMS.get(upper);
          if (/^\d+[A-Z]$/.test(upper)) return upper;
          const lower = token.toLowerCase();
          if (!first && SMALL_WORDS.has(lower)) return lower;
          return lower.charAt(0).toUpperCase() + lower.slice(1);
        });
      }
      const paperTitle = (p) => titleCase(p.title) || "[title unavailable]";

      // The edge `type` field is unreliable, so the sentence is chosen from the two concepts' own types.
      function connectionSentence(center, neighbor, n) {
        const [x, y] = TYPE_ORDER[center.type] <= TYPE_ORDER[neighbor.type] ? [center, neighbor] : [neighbor, center];
        const N = plural(n, "paper");
        const X = x.label, Y = y.label;
        switch (`${x.type}-${y.type}`) {
          case "subject-task": return `${N} observed ${X} during ${withArticle(Y)}`;
          case "subject-problem": return `${N} gave ${X} ${withArticle(Y)} design problem`;
          case "subject-construct": return `${N} measured ${Y} in ${X}`;
          case "task-problem": return `${N} used ${withArticle(X)} on ${withArticle(Y)} design problem`;
          case "task-construct": return `${N} measured ${Y} during ${withArticle(X)}`;
          case "problem-construct": return `${N} measured ${Y} on ${withArticle(X)} design problem`;
          case "construct-construct": return `${N} measured both ${X} and ${Y}`;
          default: return `${N} studied both ${X} and ${Y}`;
        }
      }

      // ---------- Year range ----------
      const rangeActive = () => state.range[0] > Y0 || state.range[1] < Y1;
      const rangeText = () => `${state.range[0]}–${state.range[1]}`;
      const inRange = (p) => p.year >= state.range[0] && p.year <= state.range[1];
      const papersIn = (list) => (rangeActive() ? list.filter(inRange) : list);
      const papersOf = (node) => papersIn(node.papers);

      // ---------- Tooltip (kept inside the graph area it belongs to) ----------
      let tipBounds = null;
      function showTip(html, event, boundsEl) {
        const wasHidden = tooltip.hidden;
        tipBounds = boundsEl;
        tooltip.innerHTML = html;
        tooltip.hidden = false;
        if (wasHidden) {
          tooltip.classList.remove("show");
          void tooltip.offsetWidth;
          tooltip.classList.add("show");
        }
        moveTip(event);
      }
      function moveTip(event) {
        const r = tooltip.getBoundingClientRect();
        const b = (tipBounds || document.body).getBoundingClientRect();
        let x = event.clientX + 16, y = event.clientY + 16;
        if (x + r.width > b.right - 10) x = event.clientX - r.width - 16;
        if (y + r.height > b.bottom - 10) y = event.clientY - r.height - 16;
        x = Math.min(Math.max(b.left + 10, x), b.right - r.width - 10);
        y = Math.min(Math.max(b.top + 10, y), b.bottom - r.height - 10);
        tooltip.style.left = `${x}px`;
        tooltip.style.top = `${y}px`;
      }
      function hideTip() { tooltip.hidden = true; }

      function conceptTip(n, extra) {
        const def = n.description
          ? `<p class="tt-def">${esc(trunc(n.description, 240))}</p>`
          : `<p class="tt-def" style="color:var(--faint);font-style:italic">No definition in the data yet.</p>`;
        return `<div class="tt-name">${esc(cap(n.label))}</div>${badge(n.type)}${def}<div class="tt-meta">${extra}</div>`;
      }

      // ---------- Routing ----------
      function navigate(hash) {

        else route();
      }
      const openConcept = (id) => navigate(`#/concept/${encodeURIComponent(id)}`);
      const goField = () => navigate("#/");
      function route() {
        const m = location.hash.match(/^#\/concept\/(.+)$/);

      // ---------- Top bar ----------
      $("crumb-home").addEventListener("click", goField);

      TYPES.forEach((type) => {
        const pill = document.createElement("button");

        pill.addEventListener("click", () => {

      const yearSlider = $("year-slider");

      // Search
      const searchInput = $("search-input");
      const searchResults = $("search-results");
      let activeResult = -1;
      function fuzzyMatch(label, query) {
        const q = query.toLowerCase().trim();
        const l = label.toLowerCase();
        if (l.includes(q)) return true;
        let i = 0;
        for (const ch of l) {
          if (ch === q[i]) i += 1;
          if (i === q.length) return true;
        }
        return false;
      }
      function searchMatches() {
        const q = searchInput.value.trim();
        if (!q) return [];
        const lower = q.toLowerCase();
        return nodes
          .filter((n) => fuzzyMatch(n.label, q))
          .sort((a, b) => {
            const ai = a.label.toLowerCase().indexOf(lower), bi = b.label.toLowerCase().indexOf(lower);
            if ((ai === -1) !== (bi === -1)) return ai === -1 ? 1 : -1;
            return b.paperCount - a.paperCount;
          })
          .slice(0, 8);
      }
      function renderSearch() {
        const matches = searchMatches();
        searchResults.hidden = !matches.length;
        searchResults.innerHTML = matches.map((n, i) => `
          <div class="search-item ${i === activeResult ? "active" : ""}" data-id="${esc(n.id)}">
            <span>${dot(n.type)} ${esc(cap(n.label))}</span><span class="t">${esc(n.type)}</span>
          </div>`).join("");
        return matches;
      }
      function chooseSearch(id) {
        searchInput.value = "";
        searchResults.hidden = true;
        activeResult = -1;
        searchInput.blur();
        openConcept(id);
      }
      searchInput.addEventListener("input", () => { activeResult = -1; renderSearch(); });
      searchInput.addEventListener("keydown", (event) => {
        const matches = searchMatches();
        if (event.key === "Escape") { searchResults.hidden = true; activeResult = -1; return; }
        if (!matches.length) return;
        if (event.key === "ArrowDown") { event.preventDefault(); activeResult = Math.min(matches.length - 1, activeResult + 1); renderSearch(); }
        else if (event.key === "ArrowUp") { event.preventDefault(); activeResult = Math.max(0, activeResult - 1); renderSearch(); }
        else if (event.key === "Enter") { event.preventDefault(); chooseSearch(matches[Math.max(0, activeResult)].id); }
      });
      searchResults.addEventListener("click", (event) => {
        const item = event.target.closest(".search-item");
        if (item) chooseSearch(item.dataset.id);

      document.addEventListener("click", (event) => {
